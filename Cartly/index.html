<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>Market Calculator</title>
<style>
  /* ───────────────────────── Theme tokens ───────────────────────── */
  :root{
    color-scheme:dark;
    --bg:#000;
    --text:#ffffff;
    --text-2:#b6b6bb;
    --text-3:#6b6b70;
    --green:#30d158;
    --orange:#ff9f0a;
    --red:#ff453a;
    --line:rgba(255,255,255,.10);

    --glass:rgba(255,255,255,.07);
    --glass-2:rgba(255,255,255,.14);
    --glass-border:rgba(255,255,255,.14);
    --hl:inset 0 1px 0 rgba(255,255,255,.20);
    --shadow:0 10px 26px rgba(0,0,0,.38);

    --sheet:rgba(26,26,28,.82);
    --toast:rgba(48,48,52,.86);

    --key-bg:rgba(255,255,255,.085);
    --key-fg:#ffffff;
    --key-bd:rgba(255,255,255,.13);
    --fn-bg:rgba(255,255,255,.19);
    --fn-fg:#ffffff;
    --op-bg:linear-gradient(180deg,rgba(255,178,58,.98),rgba(255,146,0,.95));
    --op-bd:rgba(255,205,130,.45);
  }
  html[data-theme="light"]{
    color-scheme:light;
    --bg:#e9edf5;
    --text:#0a0a0c;
    --text-2:#55565c;
    --text-3:#8e8e93;
    --green:#12913f;
    --orange:#ff9f0a;
    --red:#d70015;
    --line:rgba(0,0,0,.09);

    --glass:rgba(255,255,255,.55);
    --glass-2:rgba(255,255,255,.72);
    --glass-border:rgba(255,255,255,.90);
    --hl:inset 0 1px 0 rgba(255,255,255,.95);
    --shadow:0 10px 24px rgba(20,30,60,.12);

    --sheet:rgba(255,255,255,.88);
    --toast:rgba(32,32,36,.88);

    --key-bg:rgba(255,255,255,.58);
    --key-fg:#0a0a0c;
    --key-bd:rgba(255,255,255,.92);
    --fn-bg:rgba(255,255,255,.84);
    --fn-fg:#0a0a0c;
    --op-bg:linear-gradient(180deg,rgba(255,182,66,.98),rgba(255,150,0,.96));
    --op-bd:rgba(255,255,255,.75);
  }

  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Roboto,"Segoe UI",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    overscroll-behavior:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    user-select:none;-webkit-user-select:none;
    transition:background .28s ease,color .28s ease;
  }
  /* Ambient colour field so the glass has something to refract */
  body::before{
    content:'';position:fixed;inset:-15%;pointer-events:none;z-index:0;
    background:
      radial-gradient(38% 32% at 16% 10%, rgba(255,159,10,.22), transparent 70%),
      radial-gradient(44% 38% at 88% 20%, rgba(48,209,88,.16), transparent 72%),
      radial-gradient(50% 42% at 50% 104%, rgba(96,124,255,.20), transparent 72%);
    transition:opacity .28s ease;
  }
  html[data-theme="light"] body::before{
    background:
      radial-gradient(38% 32% at 16% 10%, rgba(255,159,10,.34), transparent 70%),
      radial-gradient(44% 38% at 88% 20%, rgba(48,209,88,.28), transparent 72%),
      radial-gradient(50% 42% at 50% 104%, rgba(120,140,255,.32), transparent 72%);
  }
  @supports(height:100dvh){html,body{height:100dvh}}

  .app{
    --vh:100vh;--gap:clamp(7px,2.2vw,12px);--pad:clamp(11px,3.1vw,18px);
    --reserved:clamp(228px,32vh,296px);
    --btn:clamp(46px,min((100vw - 2 * var(--pad) - 3 * var(--gap))/4,(var(--vh) - var(--reserved) - 4 * var(--gap))/5),88px);
    position:relative;z-index:1;
    width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;
    padding:calc(6px + env(safe-area-inset-top)) var(--pad) calc(8px + env(safe-area-inset-bottom));
    touch-action:manipulation;
  }
  @supports(height:100dvh){.app{--vh:100dvh}}

  /* ─────────────────────────── Top bar ─────────────────────────── */
  .topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 6px}
  .topbar-right{display:flex;align-items:center;gap:8px;min-width:0}

  .pill,.add-btn,.theme-btn{
    min-height:40px;border-radius:999px;font-family:inherit;cursor:pointer;touch-action:manipulation;
    transition:transform .12s cubic-bezier(.32,.72,0,1),background .2s,border-color .2s,opacity .15s;
  }
  .pill{
    display:inline-flex;align-items:center;gap:8px;min-width:0;flex-shrink:1;
    background:var(--glass);border:1px solid var(--glass-border);color:var(--text);
    padding:8px 14px;font-size:clamp(12.5px,3.5vw,15px);font-weight:500;letter-spacing:.1px;
    -webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
    box-shadow:var(--hl),0 6px 16px rgba(0,0,0,.14);
  }
  .pill:active,.add-btn:active,.theme-btn:active{transform:scale(.955)}
  .pill-count{color:var(--text-2);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .pill-dot{width:3px;height:3px;border-radius:50%;background:var(--text-3);flex:0 0 auto}
  .pill-total{color:var(--green);font-variant-numeric:tabular-nums;font-weight:700;min-width:24px;text-align:right;flex:0 0 auto}

  .add-btn{
    flex:0 0 auto;border:1px solid rgba(255,255,255,.28);
    background:linear-gradient(180deg,#49e478,#1fbe4c);
    color:#04130a;padding:8px 20px;font-size:15px;font-weight:700;
    box-shadow:0 8px 20px rgba(48,209,88,.28),inset 0 1px 0 rgba(255,255,255,.5);
  }
  .add-btn:disabled{opacity:.3;cursor:default;transform:none;box-shadow:none}

  .theme-btn{
    flex:0 0 auto;width:40px;height:40px;border-radius:50%;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--glass);border:1px solid var(--glass-border);color:var(--text);
    -webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
    box-shadow:var(--hl),0 6px 16px rgba(0,0,0,.14);
  }
  .theme-btn svg{width:18px;height:18px;display:block}
  .theme-btn .icon-sun{display:none}
  html[data-theme="light"] .theme-btn .icon-sun{display:block}
  html[data-theme="light"] .theme-btn .icon-moon{display:none}

  /* ─────────────────────────── Display ─────────────────────────── */
  .display{
    flex:1 1 auto;min-height:clamp(132px,24vh,210px);
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:4px 2px 14px;overflow:hidden;
  }
  .line-wrap{width:100%;overflow:hidden;text-align:right;line-height:1;flex:0 0 auto}
  .line-wrap + .line-wrap{margin-top:3px}
  .line{
    display:inline-block;white-space:nowrap;font-variant-numeric:tabular-nums;
    line-height:1.12;font-weight:700;transform-origin:100% 100%;
    transition:color .18s ease;
  }
  .line.primary{color:var(--text)}
  .line.secondary{color:var(--text-2)}
  .line.accent{color:var(--green)}
  .display.no-result #resWrap{display:none}
  .display.shake{animation:shake .36s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  /* ──────────────────────── Glass keypad ───────────────────────── */
  .keypad{flex:0 0 auto;width:calc(4 * var(--btn) + 3 * var(--gap));margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
  .key{
    width:100%;aspect-ratio:1;border-radius:50%;padding:0;
    border:1px solid var(--key-bd);
    background:var(--key-bg);
    color:var(--key-fg);
    -webkit-backdrop-filter:blur(14px) saturate(180%);
    backdrop-filter:blur(14px) saturate(180%);
    box-shadow:var(--hl),0 6px 16px rgba(0,0,0,.16);
    font-family:inherit;font-size:calc(var(--btn) * .40);font-weight:500;letter-spacing:-.01em;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    touch-action:manipulation;transition:transform .07s,filter .13s,background .18s,border-color .18s;
  }
  .key:active{filter:brightness(1.35);transform:scale(.955)}
  .key.fn{background:var(--fn-bg);color:var(--fn-fg);font-weight:600}
  .key.op{background:var(--op-bg);border-color:var(--op-bd);color:#fff;font-size:calc(var(--btn) * .46);font-weight:500}
  .key.op.active{background:#fff;color:var(--orange);border-color:rgba(255,159,10,.65)}
  .key.zero{grid-column:span 2;aspect-ratio:auto;height:var(--btn);border-radius:999px;justify-content:flex-start;padding-left:calc(var(--btn) * .33)}

  /* ───────────────────── Transaction sheet ─────────────────────── */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    display:flex;align-items:flex-end;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .26s ease}
  .modal.open{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:440px;border-radius:26px 26px 0 0;
    background:var(--sheet);
    -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
    padding:10px clamp(16px,4.4vw,22px) calc(18px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);
    max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;
    border-top:1px solid var(--glass-border);box-shadow:0 -20px 60px rgba(0,0,0,.38);
  }
  .modal.open .sheet{transform:translateY(0)}
  .grabber{width:38px;height:5px;border-radius:3px;background:var(--text-3);opacity:.5;margin:0 auto 12px;flex:0 0 auto}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .sheet-head h2{margin:0;font-size:clamp(17px,4.6vw,20px);font-weight:700;letter-spacing:-.02em;color:var(--text)}
  .close{width:32px;height:32px;border-radius:50%;background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text-2);
    font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .items{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0;min-height:70px;overscroll-behavior:contain}
  .empty{text-align:center;color:var(--text-3);font-size:14px;line-height:1.6;padding:34px 12px}
  .transaction{padding:13px 0;border-bottom:1px solid var(--line);animation:rowIn .26s cubic-bezier(.32,.72,0,1)}
  @keyframes rowIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
  .transaction:last-child{border-bottom:0}
  .transaction-head{display:flex;align-items:center;gap:10px}
  .item-idx{flex:0 0 auto;width:25px;height:25px;border-radius:50%;background:var(--glass-2);border:1px solid var(--glass-border);
    color:var(--text-2);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .transaction-amount{margin-left:auto;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em;color:var(--text)}
  .item-del{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:transparent;border:0;color:var(--text-3);font-size:13px;
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  .item-del:active{background:rgba(255,69,58,.16);color:var(--red)}
  .subtransactions{margin:10px 0 0 35px;padding-left:11px;border-left:1px solid var(--line);display:grid;gap:8px}
  .subtransaction{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:start;gap:7px;font-variant-numeric:tabular-nums}
  .sub-label{color:var(--text-3);font-size:12px;font-weight:700;padding-top:1px}
  .sub-expression{font-size:13px;color:var(--text);line-height:1.35;overflow-wrap:anywhere}
  .sub-amount{font-size:13px;color:var(--text-2);white-space:nowrap;text-align:right;font-weight:600}
  .sheet-foot{flex:0 0 auto;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .total-label{font-size:12px;color:var(--text-2);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .total-value{font-size:clamp(26px,7.2vw,32px);font-weight:700;letter-spacing:-.03em;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.1}
  .clear-all{background:var(--glass);border:1px solid var(--glass-border);color:var(--red);border-radius:999px;padding:9px 16px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,22px);
    background:var(--toast);color:#fff;font-size:13.5px;font-weight:500;padding:10px 18px;border-radius:999px;
    border:1px solid var(--glass-border);opacity:0;pointer-events:none;z-index:200;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    transition:opacity .22s,transform .28s cubic-bezier(.32,.72,0,1);
    max-width:88vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-height:560px) and (orientation:landscape){
    .app{--reserved:clamp(158px,28vh,208px);max-width:520px;overflow-y:auto;overscroll-behavior:contain}
    .display{min-height:86px}
  }
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<script>
  /* Set the theme before first paint to avoid a flash. */
  (function(){
    try{
      var t = localStorage.getItem('mc-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    }catch(_){ document.documentElement.setAttribute('data-theme','dark'); }
  })();
</script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="add-btn" id="addBtn" disabled>Add</button>
    <div class="topbar-right">
      <button class="pill" id="pill" aria-label="View transaction breakdown">
        <span class="pill-count" id="pillCount">No transactions</span><span class="pill-dot"></span><span class="pill-total" id="pillTotal">₹0</span>
      </button>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle light and dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>

  <div class="display" id="displayWrap" aria-live="polite">
    <div class="line-wrap" id="exprWrap"><span class="line primary" id="exprLine">0</span></div>
    <div class="line-wrap" id="resWrap"><span class="line accent" id="resLine"></span></div>
  </div>

  <div class="keypad" id="keypad" aria-label="Calculator keypad">
    <button class="key fn" data-fn="ac">AC</button>
    <button class="key fn" data-fn="backspace" aria-label="Backspace" title="Backspace">⌫</button>
    <button class="key fn" data-fn="pct">%</button>
    <button class="key op" data-op="/">÷</button>

    <button class="key" data-digit="7">7</button>
    <button class="key" data-digit="8">8</button>
    <button class="key" data-digit="9">9</button>
    <button class="key op" data-op="*">×</button>

    <button class="key" data-digit="4">4</button>
    <button class="key" data-digit="5">5</button>
    <button class="key" data-digit="6">6</button>
    <button class="key op" data-op="-">−</button>

    <button class="key" data-digit="1">1</button>
    <button class="key" data-digit="2">2</button>
    <button class="key" data-digit="3">3</button>
    <button class="key op" data-op="+">+</button>

    <button class="key zero" data-digit="0">0</button>
    <button class="key" data-digit=".">.</button>
    <button class="key op" data-fn="eq">=</button>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Transaction breakdown">
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-head"><h2>Transaction Breakdown</h2><button class="close" id="closeBtn" aria-label="Close">✕</button></div>
    <div class="items" id="items"></div>
    <div class="sheet-foot">
      <div><div class="total-label">Grand Total</div><div class="total-value" id="modalTotal">₹0</div></div>
      <button class="clear-all" id="clearAll">Clear all</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const displayWrap = $('displayWrap');
  const exprWrap = $('exprWrap');
  const exprLine = $('exprLine');
  const resWrap  = $('resWrap');
  const resLine  = $('resLine');
  const addBtn = $('addBtn');
  const pillEl = $('pill');
  const pillCountEl = $('pillCount');
  const pillTotalEl = $('pillTotal');
  const modalEl = $('modal');
  const itemsEl = $('items');
  const modalTotalEl = $('modalTotal');
  const toastEl = $('toast');
  const themeBtn = $('themeBtn');

  const S = { expression:'', result:null, evaluated:false, transactions:[] };
  const formatter = new Intl.NumberFormat('en-IN',{maximumFractionDigits:6});
  const fmt = (n) => {
    if(!Number.isFinite(n)) return 'Error';
    const safe = Math.abs(n) < 1e-10 ? 0 : n;
    return formatter.format(Number(safe.toPrecision(12)));
  };
  const cleanNumber = (n) => {
    if(!Number.isFinite(n)) throw new Error('This calculation is not a valid number.');
    return Number(n.toPrecision(12));
  };
  const prettyExpression = (src) => src.replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\+/g,' + ').replace(/-/g,' − ').replace(/\s+/g,' ').trim();

  /* ─────────────────────────── Parser ─────────────────────────── */
  function tokenize(source){
    const tokens=[]; let i=0;
    while(i<source.length){
      const ch=source[i];
      if(/\s/.test(ch)){i++;continue;}
      if(/[0-9.]/.test(ch)){
        const start=i; let dots=0, digits=0;
        while(i<source.length && /[0-9.]/.test(source[i])){
          if(source[i]==='.') dots++; else digits++;
          if(dots>1) throw new Error('Check the decimal point in your equation.');
          i++;
        }
        if(!digits) throw new Error('Enter a number after the decimal point.');
        tokens.push({type:'number',value:Number(source.slice(start,i)),start,end:i});
        continue;
      }
      if('+-*/%()'.includes(ch)){tokens.push({type:ch,value:ch,start:i,end:i+1});i++;continue;}
      throw new Error('Unsupported character in the equation.');
    }
    tokens.push({type:'eof',start:source.length,end:source.length});
    return tokens;
  }

  function parseExpression(source){
    const tokens=tokenize(source); let p=0;
    const peek=()=>tokens[p];
    const take=()=>tokens[p++];
    function primary(){
      const t=take();
      if(t.type==='number') return {type:'number',value:t.value,start:t.start,end:t.end};
      if(t.type==='('){
        const inner=expression();
        if(peek().type!==')') throw new Error('Add a closing bracket to your equation.');
        const close=take();
        return {type:'group',child:inner,start:t.start,end:close.end};
      }
      throw new Error('Complete the equation before pressing equals.');
    }
    function postfix(){
      let node=primary();
      while(peek().type==='%'){const t=take();node={type:'percent',child:node,start:node.start,end:t.end};}
      return node;
    }
    function unary(){
      if(peek().type==='+'||peek().type==='-'){
        const t=take(),child=unary();
        return {type:'unary',op:t.type,child,start:t.start,end:child.end};
      }
      return postfix();
    }
    function term(){
      let node=unary();
      while(peek().type==='*'||peek().type==='/'){
        const t=take(),right=unary();
        node={type:'binary',op:t.type,left:node,right,start:node.start,end:right.end};
      }
      return node;
    }
    function expression(){
      let node=term();
      while(peek().type==='+'||peek().type==='-'){
        const t=take(),right=term();
        node={type:'binary',op:t.type,left:node,right,start:node.start,end:right.end};
      }
      return node;
    }
    if(!source.trim()) throw new Error('Enter an equation first.');
    const tree=expression();
    if(peek().type!=='eof') throw new Error('Check the equation and try again.');
    return tree;
  }

  function evaluate(node){
    switch(node.type){
      case 'number': return node.value;
      case 'group': return evaluate(node.child);
      case 'percent': return evaluate(node.child)/100;
      case 'unary': return node.op==='-' ? -evaluate(node.child) : evaluate(node.child);
      case 'binary': {
        const a=evaluate(node.left),b=evaluate(node.right);
        if(node.op==='+') return a+b;
        if(node.op==='-') return a-b;
        if(node.op==='*') return a*b;
        if(node.op==='/'){if(b===0) throw new Error('Cannot divide by zero.');return a/b;}
      }
    }
    throw new Error('Unable to calculate this equation.');
  }

  function getBreakdown(tree,source){
    const parts=[];
    function collect(node,sign){
      if(node.type==='binary'&&node.op==='+'){collect(node.left,sign);collect(node.right,sign);return;}
      if(node.type==='binary'&&node.op==='-'){collect(node.left,sign);collect(node.right,-sign);return;}
      const raw=source.slice(node.start,node.end);
      const amount=cleanNumber(sign*evaluate(node));
      parts.push({expression:sign<0?'− ('+prettyExpression(raw)+')':prettyExpression(raw),amount});
    }
    collect(tree,1);
    return parts;
  }

  /* ─────────────────── Live result (partial expressions) ───────── */
  function tryEval(src){
    try{
      const v = cleanNumber(evaluate(parseExpression(src)));
      return Number.isFinite(v) ? v : null;
    }catch(_){ return null; }
  }
  const balance = (src) => {
    const opens=(src.match(/\(/g)||[]).length;
    const closes=(src.match(/\)/g)||[]).length;
    return opens>closes ? src + ')'.repeat(opens-closes) : src;
  };
  function previewValue(){
    const raw = S.expression;
    if(!raw) return null;
    // A bare number needs no preview — it *is* the result.
    if(/^-?\d*\.?\d*$/.test(raw)) return null;

    let v = tryEval(balance(raw));
    if(v !== null) return v;

    // Expression is still incomplete (trailing operator, stray bracket, …).
    // Walk backwards until a prefix parses cleanly.
    let work = raw;
    for(let i=0; i<24 && work.length>1; i++){
      work = work.slice(0,-1);
      const candidate = balance(work);
      if(!candidate.trim()) break;
      v = tryEval(candidate);
      if(v !== null) return v;
    }
    return null;
  }

  /* ───────────────────── Auto-fitting text lines ───────────────── */
  /**
   * Shrinks `el` until it fits inside `wrap`, never below `minPx`.
   * If it still overflows at the floor size, the line scrolls so the
   * tail (the part you're actually typing) stays visible.
   */
  function fitLine(wrap, el, maxPx, minPx){
    el.style.fontSize = maxPx + 'px';
    const avail = wrap.clientWidth;
    if(avail <= 0) return;            // hidden line — size is parked for later
    const width = el.getBoundingClientRect().width;
    let size = maxPx;
    if(width > avail && width > 0){
      size = Math.max(minPx, maxPx * (avail / width) * 0.985);
    }
    el.style.fontSize = size.toFixed(1) + 'px';
    wrap.scrollLeft = wrap.scrollWidth;   // keep the right edge in view
  }
  function fitAll(){
    const w = displayWrap.clientWidth  || 320;
    const h = displayWrap.clientHeight || 170;
    const hasRes = resLine.textContent.trim().length > 0;

    const soloMax = Math.min(86, w * 0.22, h * 0.74);          // one big line only
    const eqMax   = hasRes ? Math.min(64, w * 0.185, h * 0.44) : soloMax;
    const resMax  = hasRes ? Math.min(50, w * 0.165, h * 0.36) : 16;

    if(S.evaluated){
      fitLine(exprWrap, exprLine, Math.min(20, Math.max(13, w * 0.05)), 11);
      fitLine(resWrap,  resLine,  soloMax, 26);
    }else{
      fitLine(exprWrap, exprLine, eqMax, 20);
      fitLine(resWrap,  resLine,  resMax, 14);
    }
  }

  /* ─────────────────────────── Render ─────────────────────────── */
  function render(){
    const evaluated = S.evaluated;

    if(evaluated){
      exprLine.textContent = prettyExpression(S.expression);
      exprLine.className   = 'line secondary';
      resLine.textContent  = fmt(S.result);
      resLine.className    = 'line primary';
    }else{
      exprLine.textContent = S.expression ? prettyExpression(S.expression) : '0';
      exprLine.className   = 'line primary';
      const pv = previewValue();
      resLine.textContent = (pv === null) ? '' : '= ' + fmt(pv);
      resLine.className    = 'line accent';
    }

    const hasRes = resLine.textContent.trim().length > 0;
    displayWrap.classList.toggle('no-result', !hasRes);
    fitAll();

    addBtn.disabled = !(evaluated && Number.isFinite(S.result));
    document.querySelectorAll('[data-op]').forEach((button)=>{
      const active = !evaluated && S.expression.endsWith(button.dataset.op);
      button.classList.toggle('active', active);
    });
    renderPill();
  }

  let toastTimer=null;
  function toast(message){
    toastEl.textContent=message;toastEl.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1900);
  }
  function shake(){displayWrap.classList.remove('shake');void displayWrap.offsetWidth;displayWrap.classList.add('shake');}

  /* ───────────────────────── Input handling ───────────────────── */
  function pressDigit(digit){
    if(S.evaluated){S.expression='';S.result=null;S.evaluated=false;}
    if(digit==='.'){
      const last=S.expression.match(/(?:^|[+*/(\-])(-?\d*\.?\d*)$/);
      const current=last?last[1]:'';
      if(current.includes('.')) return;
      if(!current) S.expression+='0';
    }
    if(/[)%]$/.test(S.expression)) S.expression+='*';
    S.expression+=digit;
    render();
  }
  function pressOperator(op){
    if(S.evaluated){S.expression=String(S.result);S.result=null;S.evaluated=false;}
    if(!S.expression){if(op==='-') S.expression='-';else return;}
    else if(/[+*/-]$/.test(S.expression)){
      const last=S.expression.slice(-1);
      if(op==='-'&&last!=='-') S.expression+='-';
      else S.expression=S.expression.slice(0,-1)+op;
    }else S.expression+=op;
    render();
  }
  function applyPercent(){
    if(S.evaluated){S.expression=String(S.result/100);S.result=null;S.evaluated=false;render();return;}
    if(/[0-9)]$/.test(S.expression)) S.expression+='%';
    render();
  }
  function pressParenthesis(char){
    if(S.evaluated){
      if(char==='(') S.expression='';
      else S.expression=String(S.result);
      S.result=null;S.evaluated=false;
    }
    if(char==='('){
      if(/[0-9)%]$/.test(S.expression)) S.expression+='*';
      S.expression+='(';
    }else{
      const opens=(S.expression.match(/\(/g)||[]).length;
      const closes=(S.expression.match(/\)/g)||[]).length;
      if(opens>closes&&/[0-9)%]$/.test(S.expression)) S.expression+=')';
    }
    render();
  }
  function backspace(){
    if(S.evaluated){S.evaluated=false;S.result=null;}
    S.expression=S.expression.slice(0,-1);render();
  }
  function reset(){S.expression='';S.result=null;S.evaluated=false;render();}
  function equals(){
    try{
      const tree=parseExpression(S.expression);
      S.result=cleanNumber(evaluate(tree));
      S.evaluated=true;render();
    }catch(error){shake();toast(error.message||'Check the equation and try again.');}
  }
  function addTransaction(){
    if(!S.evaluated){toast('Press = before adding this transaction.');return;}
    try{
      const tree=parseExpression(S.expression);
      const total=cleanNumber(evaluate(tree));
      const lines=getBreakdown(tree,S.expression);
      S.transactions.push({expression:S.expression,total,lines});
      S.expression='';S.result=null;S.evaluated=false;
      render();toast('Transaction '+S.transactions.length+' added');
    }catch(error){shake();toast(error.message||'Could not add this transaction.');}
  }

  /* ─────────────────────── Transactions UI ────────────────────── */
  function grandTotal(){return cleanNumber(S.transactions.reduce((sum,transaction)=>sum+transaction.total,0));}
  function renderPill(){
    const count=S.transactions.length;
    pillCountEl.textContent=count===0?'No transactions':(count===1?'1 transaction':count+' transactions');
    pillTotalEl.textContent='₹'+fmt(count?grandTotal():0);
  }
  function renderTransactions(){
    if(!S.transactions.length){
      itemsEl.innerHTML='<div class="empty">No transactions yet.<br>Enter an equation, press =, then tap Add.</div>';
      modalTotalEl.textContent='₹0';
      return;
    }
    itemsEl.innerHTML=S.transactions.map((transaction,index)=>{
      const subRows=transaction.lines.map((line,lineIndex)=>
        '<div class="subtransaction"><span class="sub-label">'+String.fromCharCode(97+lineIndex)+')</span>'+
        '<span class="sub-expression">'+escapeHTML(line.expression)+'</span><span class="sub-amount">₹'+fmt(line.amount)+'</span></div>'
      ).join('');
      /* Only the bifurcation is shown — the full equation is intentionally omitted. */
      return '<section class="transaction">'+
        '<div class="transaction-head">'+
          '<div class="item-idx">'+(index+1)+'</div>'+
          '<div class="transaction-amount">₹'+fmt(transaction.total)+'</div>'+
          '<button class="item-del" data-del="'+index+'" aria-label="Delete transaction '+(index+1)+'">✕</button>'+
        '</div>'+
        '<div class="subtransactions">'+subRows+'</div></section>';
    }).join('');
    modalTotalEl.textContent='₹'+fmt(grandTotal());
  }
  function escapeHTML(value){return String(value).replace(/[&<>"']/g,(ch)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
  function openModal(){renderTransactions();modalEl.classList.add('open');}
  function closeModal(){modalEl.classList.remove('open');}

  /* ─────────────────────────── Theme ──────────────────────────── */
  function applyTheme(theme){
    root.setAttribute('data-theme', theme);
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', theme==='light' ? '#e9edf5' : '#000000');
  }
  applyTheme(root.getAttribute('data-theme') || 'dark');
  themeBtn.addEventListener('click',()=>{
    const next = root.getAttribute('data-theme')==='light' ? 'dark' : 'light';
    applyTheme(next);
    try{ localStorage.setItem('mc-theme', next); }catch(_){}
    requestAnimationFrame(fitAll);
  });

  /* ─────────────────────────── Events ─────────────────────────── */
  $('keypad').addEventListener('click',(event)=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.digit!==undefined) pressDigit(button.dataset.digit);
    else if(button.dataset.op!==undefined) pressOperator(button.dataset.op);
    else if(button.dataset.fn==='ac') reset();
    else if(button.dataset.fn==='backspace') backspace();
    else if(button.dataset.fn==='pct') applyPercent();
    else if(button.dataset.fn==='eq') equals();
  });
  addBtn.addEventListener('click',()=>{addTransaction();});
  pillEl.addEventListener('click',openModal);
  $('closeBtn').addEventListener('click',closeModal);
  modalEl.addEventListener('click',(event)=>{if(event.target===modalEl)closeModal();});
  itemsEl.addEventListener('click',(event)=>{
    const button=event.target.closest('[data-del]');if(!button)return;
    S.transactions.splice(Number(button.dataset.del),1);renderTransactions();renderPill();
  });
  $('clearAll').addEventListener('click',()=>{
    if(!S.transactions.length)return;
    S.transactions=[];renderTransactions();renderPill();toast('All transactions cleared');
  });
  window.addEventListener('keydown',(event)=>{
    if(event.metaKey||event.ctrlKey||event.altKey)return;
    const key=event.key;
    if(/^[0-9]$/.test(key)){pressDigit(key);event.preventDefault();}
    else if(key==='.') {pressDigit('.');event.preventDefault();}
    else if(key==='+') pressOperator('+');
    else if(key==='-') pressOperator('-');
    else if(key==='*') pressOperator('*');
    else if(key==='/'){pressOperator('/');event.preventDefault();}
    else if(key==='%') applyPercent();
    else if(key==='('||key===')'){pressParenthesis(key);event.preventDefault();}
    else if(key==='Enter'||key==='='){equals();event.preventDefault();}
    else if(key==='Backspace'){backspace();event.preventDefault();}
    else if(key==='Escape')closeModal();
  });

  let resizeRaf=null;
  window.addEventListener('resize',()=>{
    if(resizeRaf) return;
    resizeRaf=requestAnimationFrame(()=>{resizeRaf=null;fitAll();});
  });
  window.addEventListener('orientationchange',()=>setTimeout(fitAll,280));

  render();renderTransactions();
})();
</script>
</body>
</html>
