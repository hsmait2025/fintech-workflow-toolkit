<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>Market Calculator</title>
<style>
  :root{
    --bg:#000;
    --num:#333333;
    --fn:#a5a5a5;
    --op:#ff9f0a;
    --green:#30d158;
    --gray:#8e8e93;
    --card:#1c1c1e;
    --line:#2c2c2e;
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Roboto,"Segoe UI",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    overscroll-behavior:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    user-select:none;-webkit-user-select:none;
  }
  @supports(height:100dvh){html,body{height:100dvh}}
  .app{
    --vh:100vh;--gap:clamp(7px,2.2vw,12px);--pad:clamp(11px,3.1vw,18px);
    --reserved:clamp(210px,30vh,275px);
    --btn:clamp(46px,min((100vw - 2 * var(--pad) - 3 * var(--gap))/4,(var(--vh) - var(--reserved) - 4 * var(--gap))/5),88px);
    width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;
    padding:calc(6px + env(safe-area-inset-top)) var(--pad) calc(8px + env(safe-area-inset-bottom));
    touch-action:manipulation;
  }
  @supports(height:100dvh){.app{--vh:100dvh}}
  .topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 6px}
  .pill,.add-btn{
    min-height:40px;border-radius:999px;font-family:inherit;cursor:pointer;touch-action:manipulation;
    transition:transform .12s cubic-bezier(.32,.72,0,1),background .15s,opacity .15s;
  }
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);color:#fff;
    padding:8px 15px;font-size:clamp(13px,3.6vw,15px);font-weight:500;letter-spacing:.1px}
  .pill:active,.add-btn:active{transform:scale(.955)}
  .pill-count{color:var(--gray);font-weight:400}
  .pill-dot{width:3px;height:3px;border-radius:50%;background:#48484a;flex:0 0 auto}
  .pill-total{color:var(--green);font-variant-numeric:tabular-nums;font-weight:600;min-width:28px;text-align:right}
  .add-btn{border:0;background:var(--green);color:#000;padding:8px 22px;font-size:15px;font-weight:700}
  .add-btn:disabled{opacity:.28;cursor:default;transform:none}
  .display{flex:1 1 auto;min-height:clamp(105px,20vh,190px);display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:4px 2px 15px;overflow:hidden}
  .expr{font-size:clamp(15px,4vw,19px);line-height:1.45;max-width:100%;width:100%;color:var(--gray);text-align:right;
    overflow-wrap:anywhere;letter-spacing:.1px;font-variant-numeric:tabular-nums;min-height:1.4em;padding-bottom:5px}
  .value{font-size:clamp(42px,19vw,82px);font-weight:200;letter-spacing:-.035em;line-height:1.06;white-space:nowrap;
    font-variant-numeric:tabular-nums;transform-origin:right bottom;max-width:100%}
  .display.shake{animation:shake .36s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .keypad{flex:0 0 auto;width:calc(4 * var(--btn) + 3 * var(--gap));margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
  .key{width:100%;aspect-ratio:1;border:0;border-radius:50%;background:var(--num);color:#fff;font-family:inherit;
    font-size:calc(var(--btn) * .40);font-weight:400;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;
    cursor:pointer;touch-action:manipulation;transition:transform .07s,filter .13s,opacity .18s;padding:0}
  .key:active{filter:brightness(1.55);transform:scale(.96)}
  .key.fn{background:var(--fn);color:#000;font-weight:500}
  .key.op{background:var(--op);color:#fff;font-size:calc(var(--btn) * .46)}
  .key.op.active{background:#fff;color:var(--op)}
  .key.zero{grid-column:span 2;aspect-ratio:auto;height:var(--btn);border-radius:999px;justify-content:flex-start;padding-left:calc(var(--btn) * .33)}

  /* Transaction breakdown sheet */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    display:flex;align-items:flex-end;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .26s ease}
  .modal.open{opacity:1;pointer-events:auto}
  .sheet{width:100%;max-width:440px;background:var(--card);border-radius:26px 26px 0 0;
    padding:10px clamp(16px,4.4vw,22px) calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);
    transition:transform .34s cubic-bezier(.32,.72,0,1);max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;border-top:1px solid #2c2c2e}
  .modal.open .sheet{transform:translateY(0)}
  .grabber{width:38px;height:5px;border-radius:3px;background:#3a3a3c;margin:0 auto 12px;flex:0 0 auto}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid #2c2c2e;flex:0 0 auto}
  .sheet-head h2{margin:0;font-size:clamp(17px,4.6vw,20px);font-weight:600;letter-spacing:-.02em}
  .close{width:32px;height:32px;border-radius:50%;background:#2c2c2e;border:0;color:#8e8e93;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .items{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0;min-height:70px;overscroll-behavior:contain}
  .empty{text-align:center;color:#636366;font-size:14px;line-height:1.6;padding:34px 12px}
  .transaction{padding:13px 0;border-bottom:1px solid #303033;animation:rowIn .26s cubic-bezier(.32,.72,0,1)}
  @keyframes rowIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
  .transaction:last-child{border-bottom:0}
  .transaction-head{display:flex;align-items:flex-start;gap:10px}
  .item-idx{flex:0 0 auto;width:25px;height:25px;border-radius:50%;background:#303033;color:#b0b0b5;font-size:11.5px;font-weight:650;display:flex;align-items:center;justify-content:center}
  .transaction-info{flex:1 1 auto;min-width:0}
  .transaction-title{font-size:14px;color:#a1a1a6;line-height:1.35;overflow-wrap:anywhere}
  .transaction-amount{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
  .item-del{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:transparent;border:0;color:#68686d;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .item-del:active{background:#3a1f1f;color:#ff453a}
  .subtransactions{margin:10px 0 0 35px;padding-left:11px;border-left:1px solid #3a3a3c;display:grid;gap:8px}
  .subtransaction{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:start;gap:7px;font-variant-numeric:tabular-nums}
  .sub-label{color:#77777d;font-size:12px;font-weight:600;padding-top:1px}
  .sub-expression{font-size:13px;color:#d5d5d8;line-height:1.35;overflow-wrap:anywhere}
  .sub-amount{font-size:13px;color:#a7a7ad;white-space:nowrap;text-align:right}
  .sheet-foot{flex:0 0 auto;border-top:1px solid #2c2c2e;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .total-label{font-size:13px;color:#8e8e93;font-weight:500;letter-spacing:.02em;text-transform:uppercase}
  .total-value{font-size:clamp(26px,7.2vw,32px);font-weight:300;letter-spacing:-.03em;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.1}
  .clear-all{background:transparent;border:1px solid #3a3a3c;color:#ff453a;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,22px);background:rgba(44,44,46,.94);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-size:13.5px;font-weight:500;padding:10px 18px;border-radius:999px;
    border:1px solid #3a3a3c;opacity:0;pointer-events:none;transition:opacity .22s,transform .28s cubic-bezier(.32,.72,0,1);z-index:200;
    max-width:88vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-height:560px) and (orientation:landscape){.app{--reserved:clamp(145px,27vh,195px);max-width:520px;overflow-y:auto;overscroll-behavior:contain}.display{min-height:72px}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="add-btn" id="addBtn" disabled>Add</button>
    <button class="pill" id="pill" aria-label="View transaction breakdown">
      <span class="pill-count" id="pillCount">No transactions</span><span class="pill-dot"></span><span class="pill-total" id="pillTotal">₹0</span>
    </button>
  </div>
  <div class="display" id="displayWrap" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="value" id="display">0</div>
  </div>
  <div class="keypad" id="keypad" aria-label="Calculator keypad">
    <button class="key fn" data-fn="ac">AC</button>
    <button class="key fn" data-fn="backspace" aria-label="Backspace" title="Backspace">⌫</button>
    <button class="key fn" data-fn="pct">%</button>
    <button class="key op" data-op="/">÷</button>

    <button class="key" data-digit="7">7</button>
    <button class="key" data-digit="8">8</button>
    <button class="key" data-digit="9">9</button>
    <button class="key op" data-op="*">×</button>

    <button class="key" data-digit="4">4</button>
    <button class="key" data-digit="5">5</button>
    <button class="key" data-digit="6">6</button>
    <button class="key op" data-op="-">−</button>

    <button class="key" data-digit="1">1</button>
    <button class="key" data-digit="2">2</button>
    <button class="key" data-digit="3">3</button>
    <button class="key op" data-op="+">+</button>

    <button class="key zero" data-digit="0">0</button>
    <button class="key" data-digit=".">.</button>
    <button class="key op" data-fn="eq">=</button>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Transaction breakdown">
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-head"><h2>Transaction Breakdown</h2><button class="close" id="closeBtn" aria-label="Close">✕</button></div>
    <div class="items" id="items"></div>
    <div class="sheet-foot">
      <div><div class="total-label">Grand Total</div><div class="total-value" id="modalTotal">₹0</div></div>
      <button class="clear-all" id="clearAll">Clear all</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  const displayEl = $('display');
  const displayWrap = $('displayWrap');
  const exprEl = $('expr');
  const addBtn = $('addBtn');
  const pillEl = $('pill');
  const pillCountEl = $('pillCount');
  const pillTotalEl = $('pillTotal');
  const modalEl = $('modal');
  const itemsEl = $('items');
  const modalTotalEl = $('modalTotal');
  const toastEl = $('toast');

  const S = { expression:'', result:null, evaluated:false, transactions:[] };
  const formatter = new Intl.NumberFormat('en-IN',{maximumFractionDigits:6});
  const fmt = (n) => {
    if(!Number.isFinite(n)) return 'Error';
    const safe = Math.abs(n) < 1e-10 ? 0 : n;
    return formatter.format(Number(safe.toPrecision(12)));
  };
  const cleanNumber = (n) => {
    if(!Number.isFinite(n)) throw new Error('This calculation is not a valid number.');
    return Number(n.toPrecision(12));
  };
  const prettyExpression = (src) => src.replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\+/g,' + ').replace(/-/g,' − ').replace(/\s+/g,' ').trim();

  function tokenize(source){
    const tokens=[]; let i=0;
    while(i<source.length){
      const ch=source[i];
      if(/\s/.test(ch)){i++;continue;}
      if(/[0-9.]/.test(ch)){
        const start=i; let dots=0, digits=0;
        while(i<source.length && /[0-9.]/.test(source[i])){
          if(source[i]==='.') dots++; else digits++;
          if(dots>1) throw new Error('Check the decimal point in your equation.');
          i++;
        }
        if(!digits) throw new Error('Enter a number after the decimal point.');
        tokens.push({type:'number',value:Number(source.slice(start,i)),start,end:i});
        continue;
      }
      if('+-*/%()'.includes(ch)){tokens.push({type:ch,value:ch,start:i,end:i+1});i++;continue;}
      throw new Error('Unsupported character in the equation.');
    }
    tokens.push({type:'eof',start:source.length,end:source.length});
    return tokens;
  }

  function parseExpression(source){
    const tokens=tokenize(source); let p=0;
    const peek=()=>tokens[p];
    const take=()=>tokens[p++];
    function primary(){
      const t=take();
      if(t.type==='number') return {type:'number',value:t.value,start:t.start,end:t.end};
      if(t.type==='('){
        const inner=expression();
        if(peek().type!==')') throw new Error('Add a closing bracket to your equation.');
        const close=take();
        return {type:'group',child:inner,start:t.start,end:close.end};
      }
      throw new Error('Complete the equation before pressing equals.');
    }
    function postfix(){
      let node=primary();
      while(peek().type==='%'){const t=take();node={type:'percent',child:node,start:node.start,end:t.end};}
      return node;
    }
    function unary(){
      if(peek().type==='+'||peek().type==='-'){
        const t=take(),child=unary();
        return {type:'unary',op:t.type,child,start:t.start,end:child.end};
      }
      return postfix();
    }
    function term(){
      let node=unary();
      while(peek().type==='*'||peek().type==='/'){
        const t=take(),right=unary();
        node={type:'binary',op:t.type,left:node,right,start:node.start,end:right.end};
      }
      return node;
    }
    function expression(){
      let node=term();
      while(peek().type==='+'||peek().type==='-'){
        const t=take(),right=term();
        node={type:'binary',op:t.type,left:node,right,start:node.start,end:right.end};
      }
      return node;
    }
    if(!source.trim()) throw new Error('Enter an equation first.');
    const tree=expression();
    if(peek().type!=='eof') throw new Error('Check the equation and try again.');
    return tree;
  }

  function evaluate(node){
    switch(node.type){
      case 'number': return node.value;
      case 'group': return evaluate(node.child);
      case 'percent': return evaluate(node.child)/100;
      case 'unary': return node.op==='-' ? -evaluate(node.child) : evaluate(node.child);
      case 'binary': {
        const a=evaluate(node.left),b=evaluate(node.right);
        if(node.op==='+') return a+b;
        if(node.op==='-') return a-b;
        if(node.op==='*') return a*b;
        if(node.op==='/'){if(b===0) throw new Error('Cannot divide by zero.');return a/b;}
      }
    }
    throw new Error('Unable to calculate this equation.');
  }

  function getBreakdown(tree,source){
    const parts=[];
    function collect(node,sign){
      if(node.type==='binary'&&node.op==='+'){collect(node.left,sign);collect(node.right,sign);return;}
      if(node.type==='binary'&&node.op==='-'){collect(node.left,sign);collect(node.right,-sign);return;}
      const raw=source.slice(node.start,node.end);
      const amount=cleanNumber(sign*evaluate(node));
      parts.push({expression:sign<0?'− ('+prettyExpression(raw)+')':prettyExpression(raw),amount});
    }
    collect(tree,1);
    return parts;
  }

  function fitDisplay(){
    const txt=displayEl.textContent||'0';
    const available=Math.max(displayWrap.clientWidth-8,110);
    let size=available/(Math.max(txt.length,1)*.56);
    size=Math.min(82,Math.max(30,size));
    displayEl.style.fontSize=size.toFixed(1)+'px';
  }
  function currentPreview(){
    if(!S.expression) return 0;
    try{return cleanNumber(evaluate(parseExpression(S.expression)));}
    catch(_){
      const match=S.expression.match(/(?:^|[+*/(\-])(-?\d*\.?\d+)$/);
      return match ? Number(match[1]) : 0;
    }
  }
  function render(){
    exprEl.textContent=S.expression?prettyExpression(S.expression):'';
    const shown=S.evaluated?S.result:currentPreview();
    displayEl.textContent=fmt(shown);
    addBtn.disabled=!(S.evaluated&&Number.isFinite(S.result));
    document.querySelectorAll('[data-op]').forEach((button)=>{
      const active=!S.evaluated&&S.expression.endsWith(button.dataset.op);
      button.classList.toggle('active',active);
    });
    renderPill();fitDisplay();
  }

  let toastTimer=null;
  function toast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1900);}
  function shake(){displayWrap.classList.remove('shake');void displayWrap.offsetWidth;displayWrap.classList.add('shake');}
  function buzz(ms){if(navigator.vibrate){try{navigator.vibrate(ms||8);}catch(_){}}}

  function pressDigit(digit){
    if(S.evaluated){S.expression='';S.result=null;S.evaluated=false;}
    if(digit==='.'){
      const last=S.expression.match(/(?:^|[+*/(\-])(-?\d*\.?\d*)$/);
      const current=last?last[1]:'';
      if(current.includes('.')) return;
      if(!current) S.expression+='0';
    }
    if(/[)%]$/.test(S.expression)) S.expression+='*';
    S.expression+=digit;
    render();
  }
  function pressOperator(op){
    if(S.evaluated){S.expression=String(S.result);S.result=null;S.evaluated=false;}
    if(!S.expression){if(op==='-') S.expression='-';else return;}
    else if(/[+*/-]$/.test(S.expression)){
      const last=S.expression.slice(-1);
      if(op==='-'&&last!=='-') S.expression+='-';
      else S.expression=S.expression.slice(0,-1)+op;
    }else S.expression+=op;
    render();
  }
  function toggleSign(){
    if(S.evaluated){S.expression=String(-S.result);S.result=null;S.evaluated=false;render();return;}
    const match=S.expression.match(/(\d*\.?\d+)(%?)$/);
    if(!match){if(!S.expression) S.expression='-';else if(/[+*/-]$/.test(S.expression)) S.expression+='-';render();return;}
    const start=match.index,numberStart=start;
    const before=S.expression.slice(0,numberStart);
    if(before.endsWith('-')){
      const beforeMinus=before.slice(0,-1);
      if(!beforeMinus||/[+*/(\-]$/.test(beforeMinus)) S.expression=beforeMinus+match[0];
      else S.expression=before+'-'+match[0];
    }else S.expression=before+'-'+match[0];
    render();
  }
  function applyPercent(){
    if(S.evaluated){S.expression=String(S.result/100);S.result=null;S.evaluated=false;render();return;}
    if(/[0-9)]$/.test(S.expression)) S.expression+='%';
    render();
  }
  function pressParenthesis(char){
    if(S.evaluated){
      if(char==='(') S.expression='';
      else S.expression=String(S.result);
      S.result=null;S.evaluated=false;
    }
    if(char==='('){
      if(/[0-9)%]$/.test(S.expression)) S.expression+='*';
      S.expression+='(';
    }else{
      const opens=(S.expression.match(/\(/g)||[]).length;
      const closes=(S.expression.match(/\)/g)||[]).length;
      if(opens>closes&&/[0-9)%]$/.test(S.expression)) S.expression+=')';
    }
    render();
  }
  function backspace(){
    if(S.evaluated){S.evaluated=false;S.result=null;}
    S.expression=S.expression.slice(0,-1);render();
  }
  function reset(){S.expression='';S.result=null;S.evaluated=false;render();}
  function equals(){
    try{
      const tree=parseExpression(S.expression);
      const result=cleanNumber(evaluate(tree));
      S.result=result;S.evaluated=true;render();buzz(12);
    }catch(error){shake();toast(error.message||'Check the equation and try again.');}
  }
  function addTransaction(){
    if(!S.evaluated){toast('Press = before adding this transaction.');return;}
    try{
      const tree=parseExpression(S.expression);
      const total=cleanNumber(evaluate(tree));
      const lines=getBreakdown(tree,S.expression);
      S.transactions.push({expression:S.expression,total,lines});
      S.expression='';S.result=null;S.evaluated=false;
      render();buzz(18);toast('Transaction '+S.transactions.length+' added');
    }catch(error){shake();toast(error.message||'Could not add this transaction.');}
  }

  function grandTotal(){return cleanNumber(S.transactions.reduce((sum,transaction)=>sum+transaction.total,0));}
  function renderPill(){
    const count=S.transactions.length;
    pillCountEl.textContent=count===0?'No transactions':(count===1?'1 transaction':count+' transactions');
    pillTotalEl.textContent='₹'+fmt(count?grandTotal():0);
  }
  function renderTransactions(){
    if(!S.transactions.length){itemsEl.innerHTML='<div class="empty">No transactions yet.<br>Enter an equation, press =, then tap Add.</div>';modalTotalEl.textContent='₹0';return;}
    itemsEl.innerHTML=S.transactions.map((transaction,index)=>{
      const subRows=transaction.lines.map((line,lineIndex)=>
        '<div class="subtransaction"><span class="sub-label">'+String.fromCharCode(97+lineIndex)+')</span>'+
        '<span class="sub-expression">'+escapeHTML(line.expression)+'</span><span class="sub-amount">₹'+fmt(line.amount)+'</span></div>'
      ).join('');
      return '<section class="transaction"><div class="transaction-head"><div class="item-idx">'+(index+1)+'</div>'+
        '<div class="transaction-info"><div class="transaction-title">'+escapeHTML(prettyExpression(transaction.expression))+'</div></div>'+
        '<div class="transaction-amount">₹'+fmt(transaction.total)+'</div>'+
        '<button class="item-del" data-del="'+index+'" aria-label="Delete transaction '+(index+1)+'">✕</button></div>'+
        '<div class="subtransactions">'+subRows+'</div></section>';
    }).join('');
    modalTotalEl.textContent='₹'+fmt(grandTotal());
  }
  function escapeHTML(value){return String(value).replace(/[&<>"']/g,(ch)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
  function openModal(){renderTransactions();modalEl.classList.add('open');buzz();}
  function closeModal(){modalEl.classList.remove('open');}

  $('keypad').addEventListener('click',(event)=>{
    const button=event.target.closest('button');if(!button)return;buzz();
    if(button.dataset.digit!==undefined) pressDigit(button.dataset.digit);
    else if(button.dataset.op!==undefined) pressOperator(button.dataset.op);
    else if(button.dataset.fn==='ac') reset();
    else if(button.dataset.fn==='backspace') backspace();
    else if(button.dataset.fn==='pct') applyPercent();
    else if(button.dataset.fn==='eq') equals();
  });
  addBtn.addEventListener('click',()=>{addTransaction();});
  pillEl.addEventListener('click',openModal);
  $('closeBtn').addEventListener('click',closeModal);
  modalEl.addEventListener('click',(event)=>{if(event.target===modalEl)closeModal();});
  itemsEl.addEventListener('click',(event)=>{
    const button=event.target.closest('[data-del]');if(!button)return;
    S.transactions.splice(Number(button.dataset.del),1);renderTransactions();renderPill();buzz();
  });
  $('clearAll').addEventListener('click',()=>{
    if(!S.transactions.length)return;S.transactions=[];renderTransactions();renderPill();toast('All transactions cleared');buzz();
  });
  window.addEventListener('keydown',(event)=>{
    if(event.metaKey||event.ctrlKey||event.altKey)return;
    const key=event.key;
    if(/^[0-9]$/.test(key)){pressDigit(key);event.preventDefault();}
    else if(key==='.') {pressDigit('.');event.preventDefault();}
    else if(key==='+') pressOperator('+');
    else if(key==='-') pressOperator('-');
    else if(key==='*') pressOperator('*');
    else if(key==='/'){pressOperator('/');event.preventDefault();}
    else if(key==='%') applyPercent();
    else if(key==='('||key===')'){pressParenthesis(key);event.preventDefault();}
    else if(key==='Enter'||key==='='){equals();event.preventDefault();}
    else if(key==='Backspace'){backspace();event.preventDefault();}
    else if(key==='Escape')closeModal();
  });
  window.addEventListener('resize',fitDisplay);
  window.addEventListener('orientationchange',()=>setTimeout(fitDisplay,260));
  render();renderTransactions();
})();
</script>
</body>
</html>
