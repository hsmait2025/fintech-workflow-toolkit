<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Grocery Calc POS</title>

  <!-- html2pdf.js CDN for Multi-Page PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --surface-3: #3a3a3c;
      --key-bg: #2c2c2e;
      --key-active: #48484a;

      --text: #ffffff;
      --muted: #8e8e93;

      --blue: #0a84ff;
      --blue-soft: #64d2ff;
      --green: #30d158;
      --orange: #ff9f0a;
      --red: #ff453a;
      --yellow: #ffd60a;
      --purple: #bf5af2;

      --border: #1c1c1e;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

      --page-pad: clamp(10px, 3vw, 16px);
      --key-gap: clamp(7px, 2.2vw, 10px);
      --key-min-height: 58px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
    }

    .view-container {
      width: 100%;
      height: 100dvh;
      height: 100svh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-right: var(--safe-right);
      padding-left: var(--safe-left);
      background: var(--bg);
    }

    /* VENDOR SWITCHER BAR - DROPDOWN */
    .vendor-switcher-bar {
      padding: 8px var(--page-pad);
      background: #121214;
      border-bottom: 1px solid #29292b;
    }

    .vendor-select-btn {
      width: 100%;
      min-height: 42px;
      padding: 6px 14px;
      border-radius: 12px;
      background: var(--surface-2);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      border: 1px solid var(--purple);
      appearance: none;
      -webkit-appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%23bf5af2" height="14" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 12px center;
      cursor: pointer;
      outline: none;
    }

    .vendor-select-btn option {
      background: #1c1c1e;
      color: #ffffff;
    }

    /* TOP BAR */
    .top-cart-bar {
      min-height: 52px;
      padding: 6px var(--page-pad);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid #29292b;
    }

    .vendor-mini {
      min-width: 0;
    }

    .vendor-quote-label {
      margin-bottom: 2px;
      color: var(--muted);
      font-size: clamp(0.72rem, 2.8vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 0.75px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .vendor-quote-price {
      color: var(--blue-soft);
      font-size: clamp(2rem, 5vw, 2.3rem);
      font-weight: 750;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .view-cart-btn {
      min-height: 44px;
      max-width: 62%;
      padding: 6px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      border-radius: 18px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      overflow: hidden;
    }

    .view-cart-btn:active {
      transform: scale(0.97);
      opacity: 0.88;
    }

    .cart-btn-title {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(0.9rem, 3.4vw, 1.05rem);
      font-weight: 700;
      line-height: 1.15;
    }

    .cart-btn-sub {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(0.75rem, 2.6vw, 0.85rem);
      font-weight: 600;
      line-height: 1.15;
      opacity: 0.9;
    }

    /* HOME INFORMATION PANEL */
    .top-window-60 {
      min-height: 0;
      padding: clamp(8px, 2.5vw, 14px) var(--page-pad) 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface);
      border-bottom: 1px solid #29292b;
      scrollbar-width: none;
    }

    .top-window-60::-webkit-scrollbar,
    .cart-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .display-section {
      flex: 1 1 auto;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .section-label {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: clamp(0.7rem, 2.6vw, 0.8rem);
      font-weight: 700;
      letter-spacing: 0.8px;
      line-height: 1.15;
      text-transform: uppercase;
    }

    .main-display {
      min-width: 0;
      text-align: right;
    }

    .price-display {
      width: 100%;
      overflow: hidden;
      color: var(--text);
      font-size: clamp(2.6rem, 11vw, 4.2rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 0.98;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .price-display.has-input {
      color: var(--blue-soft);
    }

    .display-meta {
      margin-top: 6px;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .formula-display {
      color: var(--yellow);
      font-size: clamp(0.8rem, 3.2vw, 1rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.2px;
    }

    .selection-area {
      flex: 0 0 auto;
    }

    .selector-group + .selector-group {
      margin-top: 10px;
    }

    .base-weight-row-updated,
    .target-weight-row-custom {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .weight-btn,
    .base-dropdown-select,
    .chip-dropdown-select {
      min-width: 0;
      min-height: 44px;
      padding: 6px 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #363638;
      border-radius: 12px;
      background: #222224;
      color: #ffffff;
      font-size: clamp(0.82rem, 3.2vw, 0.98rem);
      font-weight: 700;
      line-height: 1;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .base-dropdown-select,
    .chip-dropdown-select {
      width: 100%;
      text-align-last: center;
      appearance: none;
      -webkit-appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%238e8e93" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 8px center;
      padding-right: 18px;
    }

    .base-dropdown-select option,
    .chip-dropdown-select option {
      background: #1c1c1e;
      color: #fff;
    }

    .weight-btn:active {
      transform: scale(0.96);
    }

    .weight-btn.base-selected,
    .base-dropdown-select.base-selected {
      border-color: var(--blue);
      background-color: rgba(10, 132, 255, 0.28);
      color: #fff;
    }

    .target-btn:active {
      background: rgba(48, 209, 88, 0.34);
      border-color: var(--green);
      color: #fff;
    }

    .custom-inline-btn {
      border-color: rgba(255, 159, 10, 0.7);
      background: rgba(255, 159, 10, 0.2);
      color: #ffb340;
    }

    /* KEYPAD */
    .bottom-numpad-40 {
      width: 100%;
      height: clamp(280px, 41dvh, 370px);
      min-height: 280px;
      flex-shrink: 0;
      padding: 8px var(--page-pad) max(10px, var(--safe-bottom));
      display: flex;
      overflow: hidden;
      background: var(--bg);
    }

    .keypad-container {
      width: min(100%, 410px);
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(var(--key-min-height), 1fr));
      gap: var(--key-gap);
    }

    .key {
      min-width: 0;
      min-height: var(--key-min-height);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: clamp(18px, 6vw, 30px);
      background: var(--key-bg);
      color: var(--text);
      font-size: clamp(1.55rem, 7vw, 2.15rem);
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }

    .key:active {
      background: var(--key-active);
      transform: scale(0.965);
    }

    .key.action-clear-all {
      background: #a5a5a5;
      color: #000;
      font-weight: 600;
    }

    .key.action-clear-all:active {
      background: #c5c5c5;
    }

    .key.action-backspace {
      background: var(--orange);
      color: #000;
      font-size: clamp(1.35rem, 6vw, 1.9rem);
      font-weight: 600;
    }

    .key.action-backspace:active {
      background: #ffb340;
    }

    /* CUSTOM WEIGHT SCREEN */
    #customWeightView {
      display: none;
      grid-template-rows: minmax(0, 1fr) auto;
      background: var(--bg);
    }

    .custom-top-60 {
      min-height: 0;
      padding: 18px var(--page-pad) 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface);
      border-bottom: 1px solid #29292b;
    }

    .custom-display-group {
      flex: 1 1 auto;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .custom-title {
      margin-bottom: 8px;
      color: var(--purple);
      font-size: clamp(0.8rem, 3.2vw, 0.95rem);
      font-weight: 750;
      letter-spacing: 1px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .custom-display {
      overflow: hidden;
      color: var(--yellow);
      font-size: clamp(2.8rem, 13vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .custom-subdisplay {
      margin-top: 8px;
      color: var(--purple);
      font-size: clamp(1rem, 3.8vw, 1.2rem);
      font-weight: 600;
    }

    .custom-action-row {
      width: min(100%, 360px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 9px;
      flex-shrink: 0;
    }

    .btn-cancel,
    .btn-add-cart {
      min-height: 48px;
      border-radius: 14px;
      cursor: pointer;
      font-size: clamp(0.9rem, 3.6vw, 1.05rem);
    }

    .btn-cancel {
      background: var(--surface-3);
      color: #fff;
      font-weight: 600;
    }

    .btn-add-cart {
      background: var(--green);
      color: #000;
      font-weight: 750;
      text-transform: uppercase;
    }

    .btn-cancel:active,
    .btn-add-cart:active {
      transform: scale(0.97);
    }

    /* MODAL BASE */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      padding:
        max(14px, var(--safe-top))
        max(14px, var(--safe-right))
        max(14px, var(--safe-bottom))
        max(14px, var(--safe-left));
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal-content {
      width: min(100%, 460px);
      max-height: min(90dvh, 720px);
      min-height: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      border: 1px solid #38383a;
      border-radius: 22px;
      background: #1c1c1e;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow-y: auto;
    }

    /* NAME PROMPT MODAL STYLES */
    .name-input-field {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      padding: 0 14px;
      border: 1px solid #3a3a3c;
      border-radius: 12px;
      background: #2c2c2e;
      color: #ffffff;
      font-size: 1.05rem;
      outline: none;
    }

    .name-input-field:focus {
      border-color: var(--blue);
    }

    .quick-chips-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .chip-btn {
      min-height: 40px;
      padding: 6px 10px;
      border: 1px solid #3a3a3c;
      border-radius: 12px;
      background: #2c2c2e;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chip-btn:active {
      background: var(--blue);
    }

    .chip-dropdown-select {
      min-height: 40px;
      border-radius: 12px;
      font-size: 0.9rem;
    }

    .modal-action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    /* CART MODAL & DASHBOARD */
    .cart-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .cart-title {
      margin: 0;
      font-size: clamp(1.15rem, 4.2vw, 1.3rem);
      font-weight: 700;
    }

    .cart-count {
      color: var(--muted);
      font-size: clamp(0.82rem, 3vw, 0.92rem);
      font-weight: 600;
    }

    .cart-scroll-container {
      min-height: 0;
      margin-top: 10px;
      overflow: auto;
      border-radius: 10px;
    }

    /* DASHBOARD TABLE */
    .dashboard-container {
      margin-bottom: 16px;
      padding: 10px;
      border: 1px solid #3a3a3c;
      border-radius: 14px;
      background: #252528;
    }

    .dashboard-title {
      margin-bottom: 8px;
      color: var(--yellow);
      font-size: 0.85rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dashboard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .dashboard-table th {
      color: var(--muted);
      text-align: left;
      padding: 4px;
      border-bottom: 1px solid #38383a;
    }

    .dashboard-table td {
      padding: 6px 4px;
      border-bottom: 1px solid #2c2c2e;
    }

    .dashboard-table tr.total-row {
      font-weight: 700;
      color: var(--green);
    }

    /* CART ITEMS TABLE */
    .vendor-section-header {
      padding: 8px 6px;
      background: #2a2a2d;
      color: var(--purple);
      font-weight: 700;
      font-size: 0.88rem;
      border-radius: 6px;
      margin-top: 10px;
    }

    .cart-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .cart-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #1c1c1e;
      color: var(--muted);
      font-size: clamp(0.75rem, 2.8vw, 0.85rem);
      font-weight: 700;
      text-transform: uppercase;
    }

    .cart-table th,
    .cart-table td {
      padding: 10px 4px;
      border-bottom: 1px solid #29292b;
      text-align: center;
      font-size: clamp(0.82rem, 3.2vw, 0.95rem);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .cart-table th:nth-child(1),
    .cart-table td:nth-child(1) {
      width: 25%;
      text-align: left;
      padding-left: 6px;
    }

    .cart-table th:nth-child(2),
    .cart-table td:nth-child(2) {
      width: 18%;
    }

    .cart-table th:nth-child(3),
    .cart-table td:nth-child(3) {
      width: 23%;
    }

    .cart-table th:nth-child(4),
    .cart-table td:nth-child(4) {
      width: 22%;
    }

    .cart-table th:nth-child(5),
    .cart-table td:nth-child(5) {
      width: 12%;
    }

    .remove-item-btn {
      min-width: 32px;
      min-height: 32px;
      border-radius: 16px;
      background: transparent;
      color: var(--red);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .remove-item-btn:active {
      background: rgba(255, 69, 58, 0.16);
    }

    .cart-empty {
      padding: 24px 8px;
      color: var(--muted);
      text-align: center;
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
    }

    .cart-modal-actions {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px;
      flex-shrink: 0;
    }

    .btn-clear-cart,
    .btn-share-cart,
    .close-modal-btn {
      min-height: 48px;
      border-radius: 13px;
      cursor: pointer;
      font-size: clamp(0.88rem, 3.4vw, 1rem);
      font-weight: 650;
    }

    .btn-clear-cart {
      background: var(--red);
      color: #fff;
    }

    .btn-share-cart {
      background: var(--blue);
      color: #fff;
    }

    .close-modal-btn {
      background: var(--surface-2);
      color: #fff;
    }

    .btn-clear-cart:active,
    .btn-share-cart:active,
    .close-modal-btn:active {
      transform: scale(0.97);
    }

    @media (max-height: 650px) {
      :root {
        --key-min-height: 50px;
      }

      .bottom-numpad-40 {
        height: 260px;
        min-height: 260px;
      }

      .top-window-60 {
        padding-top: 6px;
        padding-bottom: 6px;
        gap: 6px;
      }

      .display-section {
        min-height: 75px;
      }

      .price-display {
        font-size: clamp(2.4rem, 10vw, 3.6rem);
      }

      .weight-btn,
      .base-dropdown-select,
      .chip-dropdown-select {
        min-height: 38px;
        padding-top: 4px;
        padding-bottom: 4px;
      }

      .selector-group + .selector-group {
        margin-top: 4px;
      }
    }

    @media (min-width: 500px) {
      .top-window-60,
      .bottom-numpad-40 {
        padding-left: max(20px, var(--page-pad));
        padding-right: max(20px, var(--page-pad));
      }
    }
  </style>
</head>

<body>

  <!-- VIEW 1: HOME MAIN POS SCREEN -->
  <div class="view-container" id="homeView">

    <!-- VENDOR SWITCHER DROPDOWN BAR -->
    <nav class="vendor-switcher-bar">
      <select class="vendor-select-btn" id="vendorSelectDropdown" aria-label="Select Vendor">
        <option value="1" selected>Vendor 1</option>
        <option value="2">Vendor 2</option>
        <option value="3">Vendor 3</option>
        <option value="4">Vendor 4</option>
        <option value="5">Vendor 5</option>
        <option value="6">Vendor 6</option>
      </select>
    </nav>

    <header class="top-cart-bar" id="topHeader">
      <div class="vendor-mini">
        <div class="vendor-quote-label" id="vendorQuoteLabel">Vendor 1 Price</div>
        <div class="vendor-quote-price" id="headerVendorQuote">₹0</div>
      </div>

      <button class="view-cart-btn" id="openCartBtn" type="button" aria-label="Open shopping cart">
        <span class="cart-btn-title" id="cartBtnTitle">Vendor 1 (0) · ₹0.00</span>
        <span class="cart-btn-sub" id="cartBtnSub">Total: 0.00 Kg</span>
      </button>
    </header>

    <main class="top-window-60" id="homeDisplayContainer">

      <section class="display-section">
        <div class="section-label">Price</div>

        <div class="main-display">
          <div class="price-display" id="displayCurrentItemPrice">₹0</div>

          <div class="display-meta">
            <div class="formula-display" id="displayMathFormula">Equation: --</div>
          </div>
        </div>
      </section>

      <section class="selection-area">

        <div class="selector-group">
          <div class="section-label">Quote Base Weight</div>

          <div class="base-weight-row-updated" id="baseWeightRow">
            <div class="weight-btn base-btn base-selected" data-weight="0.25">250g</div>

  <!-- VIEW 2: CUSTOM WEIGHT SCREEN -->
  <div class="view-container" id="customWeightView">

    <section class="custom-top-60" id="customDisplayContainer">

  <!-- CART & VENDOR DASHBOARD MODAL -->
  <div class="modal" id="cartModal" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <div class="modal-content">

      <div class="cart-title-row">
        <h3 class="cart-title" id="cartTitle">Purchase Dashboard</h3>
        <span class="cart-count" id="cartCountLabel">0 items</span>
      </div>

      <div class="cart-scroll-container">

        <!-- DASHBOARD SUMMARY TABLE -->
        <div class="dashboard-container">
          <div class="dashboard-title">Vendor Summary Dashboard</div>
          <table class="dashboard-table">
            <thead>
              <tr>
                <th>Vendor</th>
                <th style="text-align: center;">Items</th>
                <th style="text-align: center;">Total Wt</th>
                <th style="text-align: right;">Total Price</th>
              </tr>
            </thead>
            <tbody id="dashboardTableBody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>

        <!-- ITEMIZED LIST TABLE GROUPED BY VENDOR -->
        <div id="vendorCartList">
          <!-- Dynamically populated -->
        </div>

          Your cart is empty.
        </div>

        <button class="btn-clear-cart" id="clearAllCartBtn" type="button">Clear Cart</button>

        <button class="close-modal-btn" id="closeCartBtn" type="button">Back</button>

  <script>
    /* STORAGE KEYS */
    const STORAGE_KEY = "grocery_calc_pos_data_v1";

    /* CORE STATE */
    let activeVendor = 1;
    let priceInput = "";
    let customWeightInput = "";
    let baseWeight = 0.25;
    let pendingTargetWeight = null;
    let itemCounter = 1;
    let cart = []; // Each item: { id, vendorId, name, weight, quote, price }

    /* DOM REFERENCES */
    const homeView = document.getElementById("homeView");
    const customWeightView = document.getElementById("customWeightView");
    const displayCurrentItemPrice = document.getElementById("displayCurrentItemPrice");
    const displayMathFormula = document.getElementById("displayMathFormula");
    const headerVendorQuote = document.getElementById("headerVendorQuote");
    const vendorQuoteLabel = document.getElementById("vendorQuoteLabel");
    const vendorSelectDropdown = document.getElementById("vendorSelectDropdown");

    const homeKeypad = document.getElementById("homeKeypad");
    const homeBackspaceBtn = document.getElementById("homeBackspaceBtn");
    const homeClearEntryBtn = document.getElementById("homeClearEntryBtn");

    const openCustomWtBtn = document.getElementById("openCustomWtBtn");
    const baseWeightRow = document.getElementById("baseWeightRow");
    const baseWeightDropdown = document.getElementById("baseWeightDropdown");
    const targetWeightRow = document.getElementById("targetWeightRow");

    const customDisplay = document.getElementById("customDisplay");
    const customSubDisplay = document.getElementById("customSubDisplay");
    const customKeypad = document.getElementById("customKeypad");
    const customBackspaceBtn = document.getElementById("customBackspaceBtn");
    const cancelCustomBtn = document.getElementById("cancelCustomBtn");
    const addCustomToCartBtn = document.getElementById("addCustomToCartBtn");

    const cartBtnTitle = document.getElementById("cartBtnTitle");
    const cartBtnSub = document.getElementById("cartBtnSub");
    const cartCountLabel = document.getElementById("cartCountLabel");
    const openCartBtn = document.getElementById("openCartBtn");
    const cartModal = document.getElementById("cartModal");
    const closeCartBtn = document.getElementById("closeCartBtn");
    const clearAllCartBtn = document.getElementById("clearAllCartBtn");
    const shareDashboardBtn = document.getElementById("shareDashboardBtn");
    const cartEmptyMessage = document.getElementById("cartEmptyMessage");
    const dashboardTableBody = document.getElementById("dashboardTableBody");
    const vendorCartList = document.getElementById("vendorCartList");

    const itemNameModal = document.getElementById("itemNameModal");
    const itemNameInput = document.getElementById("itemNameInput");
    const quickChipsContainer = document.getElementById("quickChipsContainer");
    const moreItemsDropdown = document.getElementById("moreItemsDropdown");
    const skipItemNameBtn = document.getElementById("skipItemNameBtn");
    const confirmItemNameBtn = document.getElementById("confirmItemNameBtn");

    /* PERSISTENCE HELPERS */
    function saveStateToStorage() {
      try {
        const payload = {
          cart,
          itemCounter,
          activeVendor,
          baseWeight,
          priceInput
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {
        console.error("Failed to save state to localStorage:", e);
      }
    }

    function loadStateFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;

        const data = JSON.parse(raw);
        if (Array.isArray(data.cart)) cart = data.cart;
        if (typeof data.itemCounter === "number") itemCounter = data.itemCounter;
        if (typeof data.activeVendor === "number") activeVendor = data.activeVendor;
        if (typeof data.baseWeight === "number") baseWeight = data.baseWeight;
        if (typeof data.priceInput === "string") priceInput = data.priceInput;

        // Sync Vendor Dropdown
        if (vendorSelectDropdown) {
          vendorSelectDropdown.value = activeVendor.toString();
        }

        // Sync Base Weight UI
        syncBaseWeightUI();

      } catch (e) {
        console.error("Failed to restore state from localStorage:", e);
      }
    }

    function syncBaseWeightUI() {
      document.querySelectorAll(".base-btn").forEach((b) => {
        b.classList.remove("base-selected");
        if (parseFloat(b.dataset.weight) === baseWeight) {
          b.classList.add("base-selected");
        }
      });

      let foundInDropdown = false;
      Array.from(baseWeightDropdown.options).forEach((opt) => {
        if (parseFloat(opt.value) === baseWeight) {
          foundInDropdown = true;
        }
      });

      if (foundInDropdown) {
        baseWeightDropdown.value = baseWeight.toString();
        baseWeightDropdown.classList.add("base-selected");
      } else {
        baseWeightDropdown.selectedIndex = 0;
        baseWeightDropdown.classList.remove("base-selected");
      }
    }

    /* DISPLAY HELPERS */
    function formatWeight(weightKg) {
      if (weightKg < 1) {
        return `${Math.round(weightKg * 1000)}g`;
      }
      return `${weightKg.toFixed(2)}Kg`;
    }

    function formatBaseWeight(weightKg) {
      return weightKg >= 1
        ? `${weightKg}Kg`
        : `${Math.round(weightKg * 1000)}g`;
    }

    /* VENDOR SWITCHING VIA DROPDOWN */
    vendorSelectDropdown.addEventListener("change", (e) => {
      activeVendor = parseInt(e.target.value, 10);
      vendorQuoteLabel.textContent = `Vendor ${activeVendor} Price`;
      
      // Clear input state when changing vendor
      priceInput = "";
      displayCurrentItemPrice.textContent = "₹0";
      displayCurrentItemPrice.classList.remove("has-input");

      updateHomeDisplay();
      renderCart();
      saveStateToStorage();
      
      showTemporaryMessage(`Switched to Vendor ${activeVendor}`);
    });

    function updateHomeDisplay() {
      vendorQuoteLabel.textContent = `Vendor ${activeVendor} Price`;
      headerVendorQuote.textContent = priceInput ? `₹${priceInput}` : "₹0";

      if (priceInput && parseFloat(priceInput) > 0) {
        const val = parseFloat(priceInput);
        const bLabel = formatBaseWeight(baseWeight);
        displayCurrentItemPrice.textContent = `₹${val}`;
        displayCurrentItemPrice.classList.add("has-input");
        displayMathFormula.textContent = `(₹${val} ÷ ${bLabel}) × Target Wt`;
      } else if (!displayCurrentItemPrice.classList.contains("has-input")) {
        displayMathFormula.textContent = `Equation: (Price ÷ ${formatBaseWeight(baseWeight)}) × Wt`;
      }
    }

    /* MAIN KEYPAD */
    homeKeypad.addEventListener("click", (e) => {
      const key = e.target.closest(".num-key");
      if (!key || !homeKeypad.contains(key)) return;

      const val = key.textContent.trim();
      if (priceInput === "0" && val === "0") return;
      if (priceInput === "0" && val !== "0") {
        priceInput = val;
        updateHomeDisplay();
        saveStateToStorage();
        return;
      }
      if (priceInput.length >= 6) return;

      priceInput += val;
      updateHomeDisplay();
      saveStateToStorage();
    });

    homeBackspaceBtn.addEventListener("click", () => {
      priceInput = priceInput.slice(0, -1);
      if (!priceInput) {
        displayCurrentItemPrice.textContent = "₹0";
        displayCurrentItemPrice.classList.remove("has-input");
      }
      updateHomeDisplay();
      saveStateToStorage();
    });

    homeClearEntryBtn.addEventListener("click", () => {
      priceInput = "";
      displayCurrentItemPrice.textContent = "₹0";
      displayCurrentItemPrice.classList.remove("has-input");
      updateHomeDisplay();
      saveStateToStorage();
    });

    /* BASE WEIGHT SELECTOR */
    baseWeightRow.addEventListener("click", (e) => {
      const button = e.target.closest(".base-btn");
      if (!button || !baseWeightRow.contains(button)) return;

      document.querySelectorAll(".base-btn").forEach((b) => b.classList.remove("base-selected"));
      baseWeightDropdown.classList.remove("base-selected");
      baseWeightDropdown.selectedIndex = 0;

      button.classList.add("base-selected");
      baseWeight = parseFloat(button.dataset.weight);
      updateHomeDisplay();
      saveStateToStorage();
    });

    baseWeightDropdown.addEventListener("change", (e) => {
      const selectedVal = parseFloat(e.target.value);
      if (isNaN(selectedVal)) return;

      document.querySelectorAll(".base-btn").forEach((b) => b.classList.remove("base-selected"));
      baseWeightDropdown.classList.add("base-selected");
      baseWeight = selectedVal;
      updateHomeDisplay();
      saveStateToStorage();
    });

    /* TARGET WEIGHT & PROMPT INTERCEPT */
    targetWeightRow.addEventListener("click", (e) => {
      const button = e.target.closest(".target-btn");
      if (!button || !targetWeightRow.contains(button)) return;

      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        showTemporaryMessage("Enter a price first.");
        return;
      }

      pendingTargetWeight = parseFloat(button.dataset.weight);
      promptItemName();
    });

    /* NAME PROMPT MODAL LOGIC */
    function promptItemName() {
      itemNameInput.value = "";
      itemNameInput.readOnly = true;
      moreItemsDropdown.selectedIndex = 0;
      itemNameModal.style.display = "flex";
    }

    itemNameInput.addEventListener("focus", () => {
      itemNameInput.readOnly = false;
    });

    itemNameInput.addEventListener("touchstart", () => {
      itemNameInput.readOnly = false;
    }, { passive: true });

    quickChipsContainer.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip-btn");
      if (!chip) return;
      itemNameInput.readOnly = true;
      itemNameInput.value = chip.dataset.name;
    });

    moreItemsDropdown.addEventListener("change", (e) => {
      if (e.target.value) {
        itemNameInput.readOnly = true;
        itemNameInput.value = e.target.value;
      }
    });

    skipItemNameBtn.addEventListener("click", () => {
      finalizeAddToCart("");
    });

    confirmItemNameBtn.addEventListener("click", () => {
      finalizeAddToCart(itemNameInput.value.trim());
    });

    itemNameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        finalizeAddToCart(itemNameInput.value.trim());
      }
    });

    function finalizeAddToCart(nameVal) {
      itemNameModal.style.display = "none";
      if (pendingTargetWeight !== null) {
        processAddToCart(pendingTargetWeight, nameVal);
        pendingTargetWeight = null;
      }
    }

    /* CUSTOM WEIGHT SCREEN */
    openCustomWtBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        showTemporaryMessage("Enter a price first.");
        return;
      }

      customWeightInput = "";
      updateCustomDisplay();
      homeView.style.display = "none";
      customWeightView.style.display = "grid";
    });

    cancelCustomBtn.addEventListener("click", () => {
      customWeightView.style.display = "none";
      homeView.style.display = "grid";
    });

    customKeypad.addEventListener("click", (e) => {
      const key = e.target.closest(".c-num-key");
      if (!key || !customKeypad.contains(key)) return;

      const val = key.textContent.trim();
      if (val === ".") {
        if (customWeightInput.includes(".")) return;
        if (customWeightInput === "") customWeightInput = "0";
        customWeightInput += ".";
        updateCustomDisplay();
        return;
      }

      if (customWeightInput === "0" && val === "0") return;
      if (customWeightInput === "0" && val !== "0") {
        customWeightInput = val;
        updateCustomDisplay();
        return;
      }

      if (customWeightInput.length >= 6) return;

      customWeightInput += val;
      updateCustomDisplay();
    });

    customBackspaceBtn.addEventListener("click", () => {
      customWeightInput = customWeightInput.slice(0, -1);
      updateCustomDisplay();
    });

    function updateCustomDisplay() {
      if (!customWeightInput) {
        customDisplay.textContent = "0 Kg";
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      if (customWeightInput === ".") {
        customDisplay.textContent = "0. Kg";
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      customDisplay.textContent = `${customWeightInput} Kg`;
      const numericVal = parseFloat(customWeightInput);

      if (isNaN(numericVal)) {
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      const calculatedGrams = Math.round(numericVal * 1000);
      customSubDisplay.textContent = `Equivalent: ${calculatedGrams}g`;
    }

    addCustomToCartBtn.addEventListener("click", () => {
      const finalWeightInKg = parseFloat(customWeightInput);
      if (isNaN(finalWeightInKg) || finalWeightInKg <= 0) {
        showTemporaryMessage("Type a valid weight.");
        return;
      }

      pendingTargetWeight = finalWeightInKg;
      customWeightView.style.display = "none";
      homeView.style.display = "grid";
      promptItemName();
    });

    /* CART CALCULATION */
    function processAddToCart(targetWeight, customName = "") {
      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        showTemporaryMessage("Enter a price first.");
        return false;
      }

      const calculatedPrice = ((priceVal / baseWeight) * targetWeight).toFixed(2);
      const baseLabel = formatBaseWeight(baseWeight);
      const targetLabel = formatWeight(targetWeight);

      const newItem = {
        id: itemCounter++,
        vendorId: activeVendor,
        name: customName || `Item #${itemCounter - 1}`,
        weight: targetWeight,
        quote: `₹${priceVal}/${baseLabel}`,
        price: parseFloat(calculatedPrice)
      };

      cart.push(newItem);

      displayCurrentItemPrice.textContent = `₹${newItem.price.toFixed(2)}`;
      displayCurrentItemPrice.classList.add("has-input");

      displayMathFormula.textContent =
        `(₹${priceVal} ÷ ${baseLabel}) × ${targetLabel} = ₹${newItem.price.toFixed(2)}`;

      renderCart();

      priceInput = "";
      headerVendorQuote.textContent = "₹0";

      saveStateToStorage();
      return true;
    }

    /* CART & DASHBOARD RENDERING */
    function renderCart() {
      dashboardTableBody.innerHTML = "";
      vendorCartList.innerHTML = "";

      let overallPrice = 0;
      let overallWeight = 0;

      // Group totals per vendor (1 through 6)
      const vendorStats = {};
      for (let v = 1; v <= 6; v++) {
        vendorStats[v] = { items: [], totalWeight: 0, totalPrice: 0 };
      }

      cart.forEach((item) => {
        overallPrice += item.price;
        overallWeight += item.weight;
        vendorStats[item.vendorId].items.push(item);
        vendorStats[item.vendorId].totalWeight += item.weight;
        vendorStats[item.vendorId].totalPrice += item.price;
      });

      // 1. Render Dashboard Table Rows (All Vendors)
      for (let v = 1; v <= 6; v++) {
        const stats = vendorStats[v];
        if (stats.items.length > 0) {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>Vendor ${v}</td>
            <td style="text-align: center;">${stats.items.length}</td>
            <td style="text-align: center;">${stats.totalWeight.toFixed(2)} Kg</td>
            <td style="text-align: right;">₹${stats.totalPrice.toFixed(2)}</td>
          `;
          dashboardTableBody.appendChild(row);
        }
      }

      // Add Grand Total row to Dashboard
      if (cart.length > 0) {
        const totalRow = document.createElement("tr");
        totalRow.className = "total-row";
        totalRow.innerHTML = `
          <td>TOTAL</td>
          <td style="text-align: center;">${cart.length}</td>
          <td style="text-align: center;">${overallWeight.toFixed(2)} Kg</td>
          <td style="text-align: right;">₹${overallPrice.toFixed(2)}</td>
        `;
        dashboardTableBody.appendChild(totalRow);
      }

      // 2. Render Itemized Tables Grouped by Vendor
      for (let v = 1; v <= 6; v++) {
        const stats = vendorStats[v];
        if (stats.items.length > 0) {
          const sectionHeader = document.createElement("div");
          sectionHeader.className = "vendor-section-header";
          sectionHeader.textContent = `Vendor ${v} (${stats.items.length} items · ₹${stats.totalPrice.toFixed(2)})`;
          vendorCartList.appendChild(sectionHeader);

          const table = document.createElement("table");
          table.className = "cart-table";
          table.innerHTML = `
            <thead>
              <tr>
                <th>Item</th>
                <th>Weight</th>
                <th>Quote</th>
                <th>Price</th>
                <th class="no-pdf"></th>
              </tr>
            </thead>
            <tbody></tbody>
          `;

          const tbody = table.querySelector("tbody");

          stats.items.forEach((item) => {
            const row = tbody.insertRow();
            row.innerHTML = `
              <td>${item.name}</td>
              <td>${formatWeight(item.weight)}</td>
              <td>${item.quote}</td>
              <td>₹${item.price.toFixed(2)}</td>
              <td class="no-pdf">
                <button class="remove-item-btn" type="button" data-id="${item.id}" aria-label="Remove item">×</button>
              </td>
            `;
          });

          vendorCartList.appendChild(table);
        }
      }

      // Update Top Header Cart Info for ACTIVE VENDOR ONLY
      const activeStats = vendorStats[activeVendor];
      cartBtnTitle.textContent = `Vendor ${activeVendor} (${activeStats.items.length}) · ₹${activeStats.totalPrice.toFixed(2)}`;
      cartBtnSub.textContent = `Total: ${activeStats.totalWeight.toFixed(2)} Kg`;

      // Update Modal Stats
      cartCountLabel.textContent = `${cart.length} ${cart.length === 1 ? "item" : "items"}`;
      cartEmptyMessage.style.display = cart.length === 0 ? "block" : "none";

      if (cart.length === 0 && !priceInput) {
        displayCurrentItemPrice.textContent = "₹0";
        displayCurrentItemPrice.classList.remove("has-input");
        updateHomeDisplay();
      }
    }

    /* CART ITEM DELETION */
    vendorCartList.addEventListener("click", (e) => {
      const button = e.target.closest(".remove-item-btn");
      if (!button) return;

      const itemId = parseInt(button.dataset.id, 10);
      if (Number.isNaN(itemId)) return;

      removeItemById(itemId);
    });

    function removeItemById(id) {
      cart = cart.filter(item => item.id !== id);
      renderCart();
      saveStateToStorage();
    }

    /* CLEAR CART */
    clearAllCartBtn.addEventListener("click", () => {
      if (cart.length === 0) return;

      if (window.confirm("Clear all items across all vendors?")) {
        cart = [];
        itemCounter = 1;
        priceInput = "";

        displayCurrentItemPrice.textContent = "₹0";
        displayCurrentItemPrice.classList.remove("has-input");

        updateHomeDisplay();
        renderCart();

        localStorage.removeItem(STORAGE_KEY);
        cartModal.style.display = "none";
      }
    });

    /* SHARE DASHBOARD FUNCTIONALITY (MULTI-PAGE COMPLETE PDF FIX) */
    shareDashboardBtn.addEventListener("click", async () => {
      if (cart.length === 0) {
        showTemporaryMessage("Cart is empty.");
        return;
      }

      showTemporaryMessage("Generating PDF...");

      const scrollContainer = document.querySelector(".cart-scroll-container");
      if (!scrollContainer) return;

      // 1. Create print container explicitly styled with fixed widths & explicit text colors
      const captureWrapper = document.createElement("div");
      Object.assign(captureWrapper.style, {
        padding: "20px",
        background: "#1c1c1e",
        color: "#ffffff",
        width: "700px",             // Fixed width ensures proper A4 grid mapping
        position: "absolute",
        left: "-9999px",
        top: "0px",
        boxSizing: "border-box",
        fontFamily: "Arial, sans-serif"
      });

      // 2. Add Header
      const now = new Date();
      const dateStamp = now.toLocaleString("en-IN", {
        dateStyle: "medium",
        timeStyle: "short"
      });

      const headerEl = document.createElement("div");
      headerEl.style.marginBottom = "16px";
      headerEl.style.fontSize = "18px";
      headerEl.style.fontWeight = "bold";
      headerEl.style.color = "#bf5af2";
      headerEl.style.borderBottom = "1px solid #38383a";
      headerEl.style.paddingBottom = "8px";
      headerEl.textContent = "Complete Purchase Summary";
      captureWrapper.appendChild(headerEl);

      // 3. Clone cart content and remove hidden/action elements
      const clone = scrollContainer.cloneNode(true);
      
      // Expand container so all scrollable content renders visible
      clone.style.overflow = "visible";
      clone.style.maxHeight = "none";
      clone.style.height = "auto";

      // Remove interactive buttons from output
      clone.querySelectorAll(".no-pdf").forEach(el => el.remove());

      // Force high-contrast explicit text colors on tables to prevent blank text rendering
      clone.querySelectorAll("th, td, div, span, h3").forEach(el => {
        const style = window.getComputedStyle(el);
        if (style.color === "rgba(0, 0, 0, 0)" || !el.style.color) {
          el.style.color = "#ffffff";
        }
      });

      captureWrapper.appendChild(clone);

      // 4. Add Footer
      const timestampEl = document.createElement("div");
      timestampEl.style.marginTop = "20px";
      timestampEl.style.fontSize = "12px";
      timestampEl.style.color = "#8e8e93";
      timestampEl.style.textAlign = "right";
      timestampEl.textContent = `Generated: ${dateStamp}`;
      captureWrapper.appendChild(timestampEl);

      document.body.appendChild(captureWrapper);

      const filename = `purchase-summary-${Date.now()}.pdf`;

      // 5. PDF Render Options tuned for dark-mode capture
      const options = {
        margin: [10, 10, 10, 10],
        filename: filename,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: {
          scale: 2,
          backgroundColor: '#1c1c1e',
          useCORS: true,
          scrollY: 0,
          windowWidth: 800
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      try {
        const pdfWorker = html2pdf().set(options).from(captureWrapper);

        // Native Web Share API handling
        if (navigator.canShare) {
          const pdfBlob = await pdfWorker.output('blob');
          const file = new File([pdfBlob], filename, { type: "application/pdf" });

          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              title: "Purchase Dashboard",
              text: `Full Purchase Summary Report - ${dateStamp}`,
              files: [file]
            });
            return;
          }
        }

        // Direct Download Fallback
        await pdfWorker.save();
        showTemporaryMessage("PDF downloaded.");

      } catch (error) {
        if (error.name !== "AbortError") {
          console.error("PDF generation failed:", error);
          showTemporaryMessage("Failed to generate PDF.");
        }
      } finally {
        if (document.body.contains(captureWrapper)) {
          document.body.removeChild(captureWrapper);
        }
      }
    });

    /* CART MODAL SHOW/HIDE */
    openCartBtn.addEventListener("click", () => {
      renderCart();
      cartModal.style.display = "flex";
    });

    closeCartBtn.addEventListener("click", () => {
      cartModal.style.display = "none";
    });

    cartModal.addEventListener("click", (e) => {
      if (e.target === cartModal) cartModal.style.display = "none";
    });

    /* NON-BLOCKING FEEDBACK TOAST */
    let messageTimer = null;
    function showTemporaryMessage(message) {
      let toast = document.getElementById("appToast");

      if (!toast) {
        toast = document.createElement("div");
        toast.id = "appToast";

        Object.assign(toast.style, {
          position: "fixed",
          left: "50%",
          bottom: "calc(41dvh + 14px)",
          transform: "translateX(-50%)",
          zIndex: "3000",
          maxWidth: "calc(100vw - 32px)",
          padding: "10px 15px",
          borderRadius: "16px",
          background: "rgba(44,44,46,0.96)",
          color: "#fff",
          fontSize: "0.88rem",
          fontWeight: "650",
          textAlign: "center",
          boxShadow: "0 8px 30px rgba(0,0,0,.35)",
          pointerEvents: "none",
          transition: "opacity .18s ease, transform .18s ease"
        });

        document.body.appendChild(toast);
      }

      toast.textContent = message;
      toast.style.opacity = "1";
      toast.style.transform = "translateX(-50%) translateY(0)";

      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(-50%) translateY(6px)";
      }, 1600);
    }

    /* INITIALIZATION */
    loadStateFromStorage();
    updateHomeDisplay();
    renderCart();
  </script>

</body>
</html>
