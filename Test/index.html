<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#0b0f14" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="ScanLex — capture a page, select the word, get its definition." />
<title>ScanLex — Visual Scan Dictionary</title>

<style>
/* ==========================================================================
   1. TOKENS
   ========================================================================== */
:root {
  --bg: #0b0f14;
  --surface: #111a23;
  --surface-2: #16212c;
  --surface-3: #1d2b38;
  --line: #24323f;
  --text: #e9f0f7;
  --muted: #90a4b6;
  --accent: #4cc9f0;
  --accent-soft: rgba(76, 201, 240, 0.14);
  --accent-line: rgba(76, 201, 240, 0.32);
  --danger: #ff6b6b;
  --danger-soft: rgba(255, 107, 107, 0.14);
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --shadow-sheet: 0 -18px 60px rgba(0, 0, 0, 0.65);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* ==========================================================================
   2. RESET
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   3. APP SHELL
   ========================================================================== */
.app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  padding-left: var(--safe-left); padding-right: var(--safe-right);
}
.app-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: calc(var(--safe-top) + 12px) 16px 12px; flex: 0 0 auto;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft);
}
.brand h1 {
  margin: 0; font-size: 1.05rem; font-weight: 650;
  letter-spacing: -0.01em; white-space: nowrap;
}
.app-actions { display: flex; gap: 8px; }
.icon-btn {
  display: grid; place-items: center;
  width: 44px; height: 44px; border-radius: 14px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  transition: background 0.18s var(--ease-out), transform 0.12s var(--ease-out);
}
.icon-btn:active { transform: scale(0.94); background: var(--surface-3); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.is-on {
  background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent);
}

/* ==========================================================================
   4. OFFLINE
   ========================================================================== */
.offline-banner {
  margin: 0 16px 10px; padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--danger-soft); border: 1px solid rgba(255, 107, 107, 0.32);
  color: #ffc9c9; font-size: 0.85rem; text-align: center;
}

/* ==========================================================================
   5. STAGE + VIEWS
   ========================================================================== */
.stage {
  flex: 1 1 auto; display: flex; flex-direction: column;
  min-height: 0; padding: 0 12px calc(var(--safe-bottom) + 12px); gap: 12px;
}

/* ---- Camera view ------------------------------------------------------- */
.camera-view {
  position: relative; flex: 1 1 auto; min-height: 0;
  border-radius: var(--radius-lg); overflow: hidden;
  background: #000; border: 1px solid var(--line);
  isolation: isolate; touch-action: none;
}
.video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: block; background: #000;
  transition: transform 0.22s var(--ease-out);
  transform-origin: center center;
}

/* Zoom bar (top-right pill) */
.zoom-bar {
  position: absolute; top: 12px; right: 12px; z-index: 6;
  display: flex; align-items: center; gap: 6px;
  background: rgba(8, 14, 20, 0.72);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 999px; padding: 4px;
}
.zoom-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 1.35rem; font-weight: 400; line-height: 1;
  color: var(--text); background: transparent;
  transition: background 0.15s;
}
.zoom-btn:active { background: rgba(255, 255, 255, 0.12); }
.zoom-btn:disabled { opacity: 0.35; }
.zoom-value {
  min-width: 42px; text-align: center;
  font-size: 0.82rem; font-weight: 650; letter-spacing: 0.02em;
  color: var(--text); font-variant-numeric: tabular-nums;
}

/* Tap-to-focus pulse */
.focus-ring {
  position: absolute; width: 64px; height: 64px;
  border: 2px solid var(--accent); border-radius: 50%;
  transform: translate(-50%, -50%) scale(0.4); opacity: 0;
  pointer-events: none; z-index: 5;
}
.focus-ring.is-active { animation: focus-pulse 0.7s var(--ease-out) forwards; }
@keyframes focus-pulse {
  0%   { opacity: 0.9; transform: translate(-50%, -50%) scale(0.4); }
  100% { opacity: 0;   transform: translate(-50%, -50%) scale(1.5); }
}

/* Busy overlay */
.ocr-overlay {
  position: absolute; inset: 0; z-index: 3;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px;
  background: rgba(6, 10, 14, 0.72);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  animation: fade-in 0.18s var(--ease-out);
}
.ocr-overlay p { margin: 0; font-size: 0.9rem; }
.spinner {
  width: 46px; height: 46px; border-radius: 50%;
  border: 3px solid rgba(76, 201, 240, 0.18); border-top-color: var(--accent);
  animation: spin 0.85s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

/* Camera error */
.camera-error {
  position: absolute; inset: 0; z-index: 4;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px; padding: 28px 22px; text-align: center;
  background: linear-gradient(160deg, #101a24 0%, #0b1219 100%);
}
.camera-error h2 { margin: 0; font-size: 1.1rem; }
.camera-error p { margin: 0; color: var(--muted); font-size: 0.9rem; max-width: 34ch; }
.camera-error .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px; }

/* ---- Selection view ---------------------------------------------------- */
.selection-view {
  flex: 1 1 auto; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-lg);
  background: #000;
  border: 1px solid var(--line);
  overflow: hidden;
  padding: 0;
}
.frozen-wrap {
  position: relative;
  overflow: hidden;
}
.frozen-canvas {
  width: 100%; height: 100%; display: block;
  user-select: none; -webkit-user-select: none;
  pointer-events: none;
}
.selection-rect {
  position: absolute;
  border: 2px dashed var(--accent);
  background: rgba(76, 201, 240, 0.08);
  box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.45);
  cursor: move;
  touch-action: none;
  will-change: left, top, width, height;
}
.selection-rect::after {
  content: ''; position: absolute;
  left: 12%; right: 12%; top: 50%; height: 1px;
  background: rgba(76, 201, 240, 0.4);
  transform: translateY(-50%);
  pointer-events: none;
}
.handle {
  position: absolute; width: 36px; height: 36px;
  background: transparent; touch-action: none; cursor: pointer;
}
.handle::after {
  content: ''; position: absolute; inset: 9px;
  border-radius: 50%; background: var(--accent);
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
}
.handle.h-tl { top: -18px; left: -18px; cursor: nwse-resize; }
.handle.h-tr { top: -18px; right: -18px; cursor: nesw-resize; }
.handle.h-bl { bottom: -18px; left: -18px; cursor: nesw-resize; }
.handle.h-br { bottom: -18px; right: -18px; cursor: nwse-resize; }

/* ==========================================================================
   6. CONTROLS
   ========================================================================== */
.controls {
  flex: 0 0 auto; display: flex; flex-direction: column;
  align-items: center; gap: 10px;
}
.capture-btn {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: 100%; max-width: 440px; height: 62px; border-radius: 31px;
  font-size: 1rem; font-weight: 640; letter-spacing: 0.01em; color: #04121a;
  background: linear-gradient(135deg, #6ee7ff 0%, #4cc9f0 45%, #3aa8d8 100%);
  box-shadow: 0 10px 30px rgba(76, 201, 240, 0.28);
  transition: transform 0.12s var(--ease-out), box-shadow 0.2s var(--ease-out), opacity 0.2s;
}
.capture-btn:active:not(:disabled) { transform: scale(0.975); }
.capture-btn:disabled { opacity: 0.5; box-shadow: none; cursor: not-allowed; }
.capture-ring {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2.5px solid currentColor;
  box-shadow: 0 0 0 3px rgba(4, 18, 26, 0.16);
}
.selection-actions {
  display: flex; gap: 10px; width: 100%; max-width: 440px;
}
.selection-actions .btn { flex: 1 1 0; height: 56px; border-radius: 28px; font-size: 0.98rem; }
.status-hint {
  margin: 0; font-size: 0.82rem; color: var(--muted);
  text-align: center; min-height: 1.2em; max-width: 44ch;
}

/* ==========================================================================
   7. BUTTONS
   ========================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 20px; border-radius: 14px;
  font-size: 0.94rem; font-weight: 600;
  transition: transform 0.12s var(--ease-out), background 0.18s, opacity 0.18s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(135deg, #6ee7ff 0%, #4cc9f0 100%); color: #04121a; }
.btn-ghost { background: var(--surface-3); border: 1px solid var(--line); color: var(--text); }
.btn-block { width: 100%; }

/* ==========================================================================
   8. SCRIM + SHEETS
   ========================================================================== */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(3, 7, 11, 0.66);
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s var(--ease-out), visibility 0s linear 0.3s;
}
.scrim.is-open {
  opacity: 1; visibility: visible;
  transition: opacity 0.3s var(--ease-out), visibility 0s;
}
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  max-height: 84vh; max-height: 84dvh; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 10px calc(20px + var(--safe-right)) calc(24px + var(--safe-bottom))
           calc(20px + var(--safe-left));
  background: var(--surface);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  border-top: 1px solid var(--line);
  box-shadow: var(--shadow-sheet);
  transform: translateY(110%); visibility: hidden;
  transition: transform 0.36s var(--ease-out), visibility 0s linear 0.36s;
}
.sheet.is-open {
  transform: translateY(0); visibility: visible;
  transition: transform 0.36s var(--ease-out), visibility 0s;
}
.sheet-handle {
  width: 44px; height: 4px; border-radius: 2px;
  background: var(--line); margin: 4px auto 14px;
}
.sheet-close {
  position: absolute; top: 14px; right: 14px;
  width: 40px; height: 40px; display: grid; place-items: center;
  border-radius: 50%; background: var(--surface-3); color: var(--muted);
  font-size: 1.35rem; line-height: 1;
}
.sheet-close:active { background: var(--line); }
.sheet-title { margin: 0 44px 6px 0; font-size: 1.15rem; letter-spacing: -0.01em; }
.sheet-sub { margin: 0 0 16px; color: var(--muted); font-size: 0.88rem; }

.text-input {
  width: 100%; height: 54px; padding: 0 16px; border-radius: 14px;
  background: var(--surface-2); border: 1.5px solid var(--line);
  color: var(--text); font-size: 1rem; transition: border-color 0.18s;
}
.text-input::placeholder { color: #62788b; }
.text-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.text-input[aria-invalid="true"] { border-color: var(--danger); }
.input-error { margin: 8px 2px 12px; color: var(--danger); font-size: 0.84rem; }
#manualForm .btn { margin-top: 14px; }

/* ==========================================================================
   9. RESULT
   ========================================================================== */
.result-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; padding-right: 44px; margin-bottom: 6px;
}
.result-word {
  margin: 0; font-size: 1.85rem; font-weight: 700;
  letter-spacing: -0.025em; line-height: 1.15; word-break: break-word;
}
.result-phonetic { margin: 6px 0 0; color: var(--accent); font-size: 0.98rem; }
.audio-btn {
  flex: 0 0 auto; width: 44px; height: 44px; display: grid; place-items: center;
  border-radius: 50%; background: var(--accent-soft);
  border: 1px solid var(--accent-line); color: var(--accent);
  transition: transform 0.12s var(--ease-out), background 0.18s;
}
.audio-btn:active { transform: scale(0.92); background: rgba(76, 201, 240, 0.24); }
.meaning { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.pos-badge {
  display: inline-block; padding: 5px 11px; border-radius: 999px;
  background: var(--accent-soft); border: 1px solid var(--accent-line);
  color: var(--accent); font-size: 0.7rem; font-weight: 650;
  letter-spacing: 0.09em; text-transform: uppercase;
}
.def-list { margin: 12px 0 0; padding-left: 20px; list-style: decimal; }
.def-list li { margin-bottom: 12px; line-height: 1.55; font-size: 0.96rem; padding-left: 4px; }
.def-list li::marker { color: var(--accent); font-weight: 600; }
.example {
  display: block; margin-top: 6px; padding-left: 10px;
  border-left: 2px solid var(--line); color: var(--muted);
  font-size: 0.89rem; font-style: italic;
}
.result-empty { margin: 20px 0 0; color: var(--muted); font-size: 0.92rem; }
.result-actions { display: flex; gap: 10px; margin-top: 26px; }
.result-actions .btn { flex: 1 1 0; }

/* ==========================================================================
   10. MODAL
   ========================================================================== */
.modal {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
  padding: 24px; background: rgba(3, 7, 11, 0.72);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  animation: fade-in 0.2s var(--ease-out);
}
.modal-card {
  width: 100%; max-width: 380px; padding: 26px 22px 20px;
  border-radius: var(--radius-lg); background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.7);
  text-align: center; animation: pop-in 0.24s var(--ease-out);
}
@keyframes pop-in {
  from { opacity: 0; transform: translateY(10px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}
.modal-icon {
  width: 52px; height: 52px; margin: 0 auto 14px;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--danger-soft); border: 1px solid rgba(255, 107, 107, 0.3);
  color: var(--danger); font-size: 1.5rem; font-weight: 700;
}
.modal-title { margin: 0 0 8px; font-size: 1.08rem; }
.modal-text { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; line-height: 1.55; }
.modal-actions { display: flex; flex-direction: column; gap: 10px; }

/* ==========================================================================
   11. TOAST
   ========================================================================== */
.toast {
  position: fixed; left: 50%; bottom: calc(28px + var(--safe-bottom));
  transform: translate(-50%, 20px); z-index: 80;
  max-width: min(90vw, 420px); padding: 12px 20px; border-radius: 14px;
  background: var(--surface-3); border: 1px solid var(--line); color: var(--text);
  font-size: 0.87rem; text-align: center; opacity: 0; visibility: hidden;
  transition: opacity 0.24s var(--ease-out), transform 0.24s var(--ease-out),
    visibility 0s linear 0.24s;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
}
.toast.is-visible {
  opacity: 1; transform: translate(-50%, 0); visibility: visible;
  transition: opacity 0.24s var(--ease-out), transform 0.24s var(--ease-out), visibility 0s;
}

/* ==========================================================================
   12. RESPONSIVE
   ========================================================================== */
@media (min-width: 720px) {
  .stage { padding: 0 24px calc(var(--safe-bottom) + 20px); }
  .app-bar { padding-left: 24px; padding-right: 24px; }
  .sheet {
    left: 50%; right: auto; width: min(560px, 100%);
    transform: translate(-50%, 110%);
  }
  .sheet.is-open { transform: translate(-50%, 0); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
</style>
</head>

<body>
<div class="app">
  <header class="app-bar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <h1>ScanLex</h1>
    </div>
    <div class="app-actions">
      <button id="btnTorch" class="icon-btn" type="button" aria-label="Toggle torch" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
      </button>
      <button id="btnSwitch" class="icon-btn" type="button" aria-label="Switch camera" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12a8 8 0 0 1-13.7 5.6L3 14" />
          <path d="M4 12a8 8 0 0 1 13.7-5.6L21 10" />
          <path d="M21 4v6h-6" />
          <path d="M3 20v-6h6" />
        </svg>
      </button>
      <button id="btnManual" class="icon-btn" type="button" aria-label="Type a word">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="6" width="19" height="12" rx="2.5" />
          <path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8" />
        </svg>
      </button>
    </div>
  </header>

  <div class="offline-banner" id="offlineBanner" role="status" hidden>
    You're offline — definitions can't be loaded right now.
  </div>

  <main class="stage">
    <!-- ============ CAMERA VIEW ============ -->
    <section class="camera-view" id="cameraView" aria-label="Camera viewfinder">
      <video id="video" class="video" playsinline autoplay muted
             aria-label="Live camera preview"></video>

      <div class="zoom-bar" id="zoomBar" hidden>
        <button id="btnZoomOut" class="zoom-btn" type="button" aria-label="Zoom out">−</button>
        <span class="zoom-value" id="zoomValue">1.0×</span>
        <button id="btnZoomIn" class="zoom-btn" type="button" aria-label="Zoom in">+</button>
      </div>

      <div class="focus-ring" id="focusRing" aria-hidden="true"></div>

      <div class="ocr-overlay" id="ocrOverlay" hidden>
        <div class="spinner" role="progressbar" aria-label="Processing"></div>
        <p id="ocrLabel">Reading…</p>
      </div>

      <div class="camera-error" id="cameraError" hidden>
        <h2>Camera unavailable</h2>
        <p id="cameraErrorText">We couldn't start your camera.</p>
        <div class="row">
          <button id="btnCameraRetry" class="btn btn-ghost" type="button">Try again</button>
          <button id="btnCameraManual" class="btn btn-primary" type="button">Type a word</button>
        </div>
      </div>

      <canvas id="cropCanvas" hidden aria-hidden="true"></canvas>
    </section>

    <!-- ============ SELECTION VIEW ============ -->
    <section class="selection-view" id="selectionView" hidden aria-label="Select text region">
      <div class="frozen-wrap" id="frozenWrap">
        <canvas id="frozenCanvas" class="frozen-canvas"></canvas>
        <div class="selection-rect" id="selectionRect">
          <div class="handle h-tl" data-handle="tl"></div>
          <div class="handle h-tr" data-handle="tr"></div>
          <div class="handle h-bl" data-handle="bl"></div>
          <div class="handle h-br" data-handle="br"></div>
        </div>
      </div>
    </section>

    <!-- ============ CONTROLS: CAMERA ============ -->
    <div class="controls" id="cameraControls">
      <button id="btnCapture" class="capture-btn" type="button">
        <span class="capture-ring" aria-hidden="true"></span>
        Capture
      </button>
      <p class="status-hint" id="statusHint" role="status" aria-live="polite">
        Starting camera…
      </p>
    </div>

    <!-- ============ CONTROLS: SELECTION ============ -->
    <div class="controls" id="selectionControls" hidden>
      <div class="selection-actions">
        <button id="btnRetake" class="btn btn-ghost" type="button">Retake</button>
        <button id="btnLookUp" class="btn btn-primary" type="button">Look Up</button>
      </div>
      <p class="status-hint">Drag the box to fit the word or line, then tap Look Up</p>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" aria-hidden="true"></div>

<section class="sheet" id="resultSheet" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
  <div class="sheet-handle" aria-hidden="true"></div>
  <button class="sheet-close" id="btnResultClose" type="button" aria-label="Close">×</button>
  <div class="result-body" id="resultBody"></div>
</section>

<section class="sheet" id="manualSheet" role="dialog" aria-modal="true" aria-labelledby="manualTitle">
  <div class="sheet-handle" aria-hidden="true"></div>
  <button class="sheet-close" id="btnManualClose" type="button" aria-label="Close">×</button>
  <h2 class="sheet-title" id="manualTitle">Type a word</h2>
  <p class="sheet-sub">Camera not available? Enter the word manually.</p>
  <form id="manualForm" novalidate>
    <label class="sr-only" for="manualInput">Word to look up</label>
    <input id="manualInput" class="text-input" type="text" inputmode="text"
           autocomplete="off" autocapitalize="none" spellcheck="false"
           maxlength="45" placeholder="e.g. serendipity" data-autofocus />
    <p class="input-error" id="manualError" role="alert" hidden></p>
    <button class="btn btn-primary btn-block" type="submit" id="btnManualSubmit">
      Look up definition
    </button>
  </form>
</section>

<div class="modal" id="errorModal" role="alertdialog" aria-modal="true"
     aria-labelledby="errorTitle" aria-describedby="errorText" hidden>
  <div class="modal-card">
    <div class="modal-icon" aria-hidden="true">!</div>
    <h2 class="modal-title" id="errorTitle">Something went wrong</h2>
    <p class="modal-text" id="errorText"></p>
    <div class="modal-actions">
      <button class="btn btn-primary btn-block" type="button" id="errorRetry" hidden>Retry</button>
      <button class="btn btn-ghost btn-block" type="button" id="errorDismiss">Dismiss</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* ==========================================================================
 * ScanLex — Visual Scan Dictionary
 * --------------------------------------------------------------------------
 * Flow:
 *   Camera  →  Capture full frame  →  Select region  →  OCR  →  Lookup
 * ========================================================================== */

/* ==========================================================================
 * 1. CONFIG
 * ========================================================================== */
const CONFIG = Object.freeze({
  API: Object.freeze({
    PRIMARY_URL: 'https://api.dictionaryapi.dev/api/v2/entries/en',
    FALLBACK_URL: 'https://api.datamuse.com/words',
    TIMEOUT_MS: 10000,
    HEADERS: Object.freeze({ Accept: 'application/json' })
  }),

  CAMERA: Object.freeze({
    IDEAL_WIDTH: 1920,
    IDEAL_HEIGHT: 1080,
    DEFAULT_FACING: 'environment',
    ALTERNATE_FACING: 'user',
    FOCUS_SETTLE_MS: 550,
    ZOOM_STEP_FRACTION: 0.15   // 15 % of range per button tap
  }),

  OCR: Object.freeze({
    CDN_URL: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    LANGUAGE: 'eng',
    OEM: 1,
    DEFAULT_PSM: '6',
    PSM_LINE: '7',
    PSM_BLOCK: '6',
    MIN_WORD_LENGTH: 2,
    MAX_WORD_LENGTH: 45,
    MIN_CONFIDENCE_EARLY: 70
  }),

  UI: Object.freeze({
    MAX_MEANINGS: 3,
    MAX_DEFINITIONS_PER_MEANING: 3,
    MAX_SYNONYMS: 4,
    TOAST_MS: 2600
  }),

  SELECTORS: Object.freeze({
    cameraView:     '#cameraView',
    selectionView:  '#selectionView',
    video:          '#video',
    focusRing:      '#focusRing',
    zoomBar:        '#zoomBar',
    zoomValue:      '#zoomValue',
    btnZoomIn:      '#btnZoomIn',
    btnZoomOut:     '#btnZoomOut',
    frozenCanvas:   '#frozenCanvas',
    frozenWrap:     '#frozenWrap',
    selectionRect:  '#selectionRect',
    cropCanvas:     '#cropCanvas',
    ocrOverlay:     '#ocrOverlay',
    ocrLabel:       '#ocrLabel',
    cameraError:    '#cameraError',
    cameraErrorText:'#cameraErrorText',
    btnCameraRetry: '#btnCameraRetry',
    btnCameraManual:'#btnCameraManual',
    btnCapture:     '#btnCapture',
    btnRetake:      '#btnRetake',
    btnLookUp:      '#btnLookUp',
    cameraControls: '#cameraControls',
    selectionCtrls: '#selectionControls',
    btnSwitch:      '#btnSwitch',
    btnTorch:       '#btnTorch',
    btnManual:      '#btnManual',
    statusHint:     '#statusHint',
    scrim:          '#scrim',
    resultSheet:    '#resultSheet',
    resultBody:     '#resultBody',
    btnResultClose: '#btnResultClose',
    manualSheet:    '#manualSheet',
    manualForm:     '#manualForm',
    manualInput:    '#manualInput',
    manualError:    '#manualError',
    btnManualClose: '#btnManualClose',
    errorModal:     '#errorModal',
    errorTitle:     '#errorTitle',
    errorText:      '#errorText',
    errorRetry:     '#errorRetry',
    errorDismiss:   '#errorDismiss',
    toast:          '#toast',
    offlineBanner:  '#offlineBanner'
  })
});

/* ==========================================================================
 * 2. ERRORS
 * ========================================================================== */
class AppError extends Error {
  constructor(code, message, options = {}) {
    super(message);
    this.name = 'AppError';
    this.code = code;
    this.retryable = Boolean(options.retryable);
    this.cause = options.cause;
  }
}

const MESSAGES = Object.freeze({
  CAMERA_INSECURE:  'Camera access requires a secure (HTTPS) connection.',
  CAMERA_UNSUPPORTED: 'This browser does not support camera capture.',
  CAMERA_DENIED:    'Camera permission was denied. You can still type a word manually.',
  CAMERA_NOT_FOUND: 'No camera was found on this device.',
  CAMERA_BUSY:      'The camera is being used by another app. Close it and try again.',
  CAMERA_FAILED:    'The camera could not be started.',
  CAMERA_NOT_READY: 'The camera is still warming up. Give it a moment and try again.',
  OCR_LIB:          'The text-recognition engine could not be loaded. Check your connection.',
  OCR_FAILED:       'Text recognition failed. Try again with steadier lighting.',
  OCR_EMPTY:        'No readable text in the selected area. Try zooming in closer on the ' +
                    'camera, or selecting a tighter area with more of the word visible.',
  OFFLINE:          'You appear to be offline. Reconnect to look up definitions.',
  TIMEOUT:          'The dictionary request timed out. Please try again.',
  NETWORK:          'A network error occurred while contacting the dictionary.',
  NOT_FOUND:        'No definition was found for that word.',
  HTTP_ERROR:       'The dictionary service returned an unexpected response.',
  BAD_WORD:         'Please enter a single word using letters only.'
});

/* ==========================================================================
 * 3. UTILITIES
 * ========================================================================== */
const clamp = (v, min, max) => Math.min(Math.max(v, min), max);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function h(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = String(value);
    else if (key === 'dataset') Object.assign(node.dataset, value);
    else if (key.startsWith('on') && typeof value === 'function') {
      node.addEventListener(key.slice(2).toLowerCase(), value);
    } else node.setAttribute(key, value === true ? '' : String(value));
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

const ICONS = Object.freeze({
  speaker:
    '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>' +
    '<path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>'
});

const DOM = {};
function cacheDom() {
  for (const [key, selector] of Object.entries(CONFIG.SELECTORS)) {
    const node = document.querySelector(selector);
    if (!node) throw new Error(`[ScanLex] Missing DOM node "${key}" (${selector})`);
    DOM[key] = node;
  }
  Object.freeze(DOM);
}

/* ==========================================================================
 * 4. UI
 * ========================================================================== */
const UI = (() => {
  let toastTimer = null;
  let lastFocused = null;
  let retryHandler = null;
  let focusRingTimer = null;

  function setStatus(text) { DOM.statusHint.textContent = text; }

  function setBusy(isBusy, label) {
    DOM.ocrOverlay.hidden = !isBusy;
    if (label) DOM.ocrLabel.textContent = label;
    DOM.btnCapture.disabled = isBusy;
  }

  function isOverlayOpen() {
    return DOM.resultSheet.classList.contains('is-open') ||
           DOM.manualSheet.classList.contains('is-open') ||
           !DOM.errorModal.hidden;
  }

  function updateScrim() {
    const open = DOM.resultSheet.classList.contains('is-open') ||
                 DOM.manualSheet.classList.contains('is-open');
    DOM.scrim.classList.toggle('is-open', open);
  }

  function openSheet(sheet) {
    lastFocused = document.activeElement;
    sheet.classList.add('is-open');
    updateScrim();
    const focusTarget = sheet.querySelector('[data-autofocus]') || sheet.querySelector('.sheet-close');
    requestAnimationFrame(() => focusTarget?.focus({ preventScroll: true }));
  }

  function closeSheet(sheet) {
    sheet.classList.remove('is-open');
    updateScrim();
    if (lastFocused?.focus) { lastFocused.focus({ preventScroll: true }); lastFocused = null; }
  }

  function closeAllSheets() {
    [DOM.resultSheet, DOM.manualSheet].forEach((s) => {
      if (s.classList.contains('is-open')) closeSheet(s);
    });
  }

  function toast(message) {
    if (!message) return;
    DOM.toast.textContent = message;
    DOM.toast.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => DOM.toast.classList.remove('is-visible'), CONFIG.UI.TOAST_MS);
  }

  function showError({ title, message, retryLabel, onRetry }) {
    DOM.errorTitle.textContent = title;
    DOM.errorText.textContent = message;
    retryHandler = typeof onRetry === 'function' ? onRetry : null;
    DOM.errorRetry.hidden = !retryHandler;
    if (retryHandler) DOM.errorRetry.textContent = retryLabel || 'Retry';
    DOM.errorModal.hidden = false;
    updateScrim();
    requestAnimationFrame(() => {
      (retryHandler ? DOM.errorRetry : DOM.errorDismiss).focus({ preventScroll: true });
    });
  }

  function hideError() { DOM.errorModal.hidden = true; retryHandler = null; updateScrim(); }
  function triggerRetry() { const fn = retryHandler; hideError(); if (fn) fn(); }

  function showCameraError(message) { DOM.cameraErrorText.textContent = message; DOM.cameraError.hidden = false; }
  function hideCameraError() { DOM.cameraError.hidden = true; }
  function setOffline(v) { DOM.offlineBanner.hidden = !v; }

  function showInputError(message) {
    DOM.manualError.textContent = message;
    DOM.manualError.hidden = false;
    DOM.manualInput.setAttribute('aria-invalid', 'true');
    DOM.manualInput.focus({ preventScroll: true });
  }
  function clearInputError() {
    DOM.manualError.hidden = true;
    DOM.manualError.textContent = '';
    DOM.manualInput.removeAttribute('aria-invalid');
  }

  function showFocusRing(clientX, clientY) {
    const rect = DOM.cameraView.getBoundingClientRect();
    DOM.focusRing.style.left = (clientX - rect.left) + 'px';
    DOM.focusRing.style.top = (clientY - rect.top) + 'px';
    DOM.focusRing.classList.remove('is-active');
    void DOM.focusRing.offsetWidth;
    DOM.focusRing.classList.add('is-active');
    clearTimeout(focusRingTimer);
    focusRingTimer = setTimeout(() => DOM.focusRing.classList.remove('is-active'), 750);
  }

  function setTorchUI(on, available) {
    DOM.btnTorch.hidden = !available;
    DOM.btnTorch.classList.toggle('is-on', Boolean(on));
    DOM.btnTorch.setAttribute('aria-pressed', String(Boolean(on)));
  }

  function setZoomUI(current, min, max, available) {
    DOM.zoomBar.hidden = !available;
    if (!available) return;
    DOM.zoomValue.textContent = current.toFixed(1) + '×';
    DOM.btnZoomOut.disabled = current <= min + 0.001;
    DOM.btnZoomIn.disabled = current >= max - 0.001;
  }

  /* ---- View switching ---------------------------------------------------- */
  function showCameraView() {
    DOM.cameraView.hidden = false;
    DOM.selectionView.hidden = true;
    DOM.cameraControls.hidden = false;
    DOM.selectionCtrls.hidden = true;
  }

  function showSelectionView() {
    DOM.cameraView.hidden = true;
    DOM.selectionView.hidden = false;
    DOM.cameraControls.hidden = true;
    DOM.selectionCtrls.hidden = false;
  }

  /* ---- Result rendering -------------------------------------------------- */
  function playAudio(url) {
    try {
      const audio = new Audio(url);
      const p = audio.play();
      if (p?.catch) p.catch(() => toast('Pronunciation is unavailable right now.'));
    } catch { toast('Pronunciation is unavailable right now.'); }
  }

  function renderResult(entry, actions) {
    const nodes = [];
    const headText = h('div', {},
      h('h2', { class: 'result-word', id: 'resultTitle', text: entry.word }),
      entry.phonetic ? h('p', { class: 'result-phonetic', text: entry.phonetic }) : null
    );
    const head = h('div', { class: 'result-head' }, headText);
    if (entry.audio) {
      const audioBtn = h('button', {
        class: 'audio-btn', type: 'button',
        'aria-label': `Play pronunciation of ${entry.word}`,
        onClick: () => playAudio(entry.audio)
      });
      audioBtn.innerHTML = ICONS.speaker;
      head.append(audioBtn);
    }
    nodes.push(head);

    if (!entry.meanings.length) {
      nodes.push(h('p', { class: 'result-empty', text: 'No definitions were returned for this word.' }));
    }
    for (const meaning of entry.meanings) {
      nodes.push(
        h('section', { class: 'meaning' },
          h('span', { class: 'pos-badge', text: meaning.partOfSpeech || 'definition' }),
          h('ol', { class: 'def-list' },
            ...meaning.definitions.map((def) =>
              h('li', {},
                h('span', { text: def.definition }),
                def.example ? h('em', { class: 'example', text: `“${def.example}”` }) : null
              )
            )
          )
        )
      );
    }
    nodes.push(
      h('div', { class: 'result-actions' },
        h('button', {
          class: 'btn btn-ghost', type: 'button', text: 'Scan another',
          onClick: actions.onScanAnother
        }),
        h('button', {
          class: 'btn btn-ghost', type: 'button', text: 'Type a word',
          onClick: actions.onTypeWord
        })
      )
    );
    DOM.resultBody.replaceChildren(...nodes);
  }

  /* ---- Bindings ---------------------------------------------------------- */
  function bindEvents(handlers) {
    DOM.btnCapture.addEventListener('click', handlers.onCapture);
    DOM.btnRetake.addEventListener('click', handlers.onRetake);
    DOM.btnLookUp.addEventListener('click', handlers.onLookUp);
    DOM.btnManual.addEventListener('click', handlers.onManualRequest);
    DOM.btnCameraManual.addEventListener('click', handlers.onManualRequest);
    DOM.btnCameraRetry.addEventListener('click', handlers.onCameraRetry);
    DOM.btnSwitch.addEventListener('click', handlers.onSwitchCamera);
    DOM.btnTorch.addEventListener('click', handlers.onTorchToggle);
    DOM.btnZoomIn.addEventListener('click', handlers.onZoomIn);
    DOM.btnZoomOut.addEventListener('click', handlers.onZoomOut);

    DOM.btnResultClose.addEventListener('click', handlers.onCloseResult);
    DOM.btnManualClose.addEventListener('click', handlers.onCloseManual);
    DOM.scrim.addEventListener('click', handlers.onScrimClick);
    DOM.manualForm.addEventListener('submit', handlers.onManualSubmit);
    DOM.manualInput.addEventListener('input', clearInputError);
    DOM.errorRetry.addEventListener('click', triggerRetry);
    DOM.errorDismiss.addEventListener('click', () => {
      hideError();
      handlers.onErrorDismissed?.();
    });

    // Camera view: pointer interactions (tap-to-focus + pinch-to-zoom).
    const pointerMap = new Map();
    let pinch = null;  // { startDist, startZoom }
    let tapCandidate = null;  // { x, y, t }

    DOM.cameraView.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      DOM.cameraView.setPointerCapture?.(e.pointerId);
      pointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointerMap.size === 2) {
        const [a, b] = [...pointerMap.values()];
        pinch = {
          startDist: Math.hypot(a.x - b.x, a.y - b.y),
          startZoom: handlers.getZoom()
        };
        tapCandidate = null;
      } else if (pointerMap.size === 1) {
        tapCandidate = { x: e.clientX, y: e.clientY, t: performance.now() };
      }
    });

    DOM.cameraView.addEventListener('pointermove', (e) => {
      if (!pointerMap.has(e.pointerId)) return;
      pointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pinch && pointerMap.size === 2) {
        const [a, b] = [...pointerMap.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        const ratio = dist / pinch.startDist;
        handlers.setZoom(pinch.startZoom * ratio);
        tapCandidate = null;
      }
    });

    const endPointer = (e) => {
      pointerMap.delete(e.pointerId);
      if (pointerMap.size < 2) pinch = null;
      if (pointerMap.size === 0 && tapCandidate) {
        const dx = Math.abs(e.clientX - tapCandidate.x);
        const dy = Math.abs(e.clientY - tapCandidate.y);
        const dt = performance.now() - tapCandidate.t;
        if (dx < 12 && dy < 12 && dt < 350) {
          handlers.onViewfinderTap?.(e.clientX, e.clientY);
        }
        tapCandidate = null;
      }
    };
    DOM.cameraView.addEventListener('pointerup', endPointer);
    DOM.cameraView.addEventListener('pointercancel', endPointer);

    // Escape key closes open dialogs.
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!DOM.errorModal.hidden) { hideError(); handlers.onErrorDismissed?.(); }
      else if (DOM.manualSheet.classList.contains('is-open')) handlers.onCloseManual();
      else if (DOM.resultSheet.classList.contains('is-open')) handlers.onCloseResult();
    });
  }

  return {
    setStatus, setBusy, isOverlayOpen,
    openSheet, closeSheet, closeAllSheets,
    toast, showError, hideError,
    showCameraError, hideCameraError, setOffline,
    showInputError, clearInputError,
    showFocusRing, setTorchUI, setZoomUI,
    showCameraView, showSelectionView,
    renderResult, bindEvents
  };
})();

/* ==========================================================================
 * 5. CAMERA SERVICE
 * ========================================================================== */
const CameraService = (() => {
  let stream = null;
  let videoEl = null;
  let facingMode = CONFIG.CAMERA.DEFAULT_FACING;
  let paused = false;
  let torchOn = false;

  /** { min, max, step, native } — native: true when hardware zoom is supported. */
  let zoomInfo = { min: 1, max: 1, step: 0.1, native: false };
  let currentZoom = 1;
  /** Digital zoom via CSS when native zoom is not available. */
  let digitalZoom = 1;

  function translateError(error) {
    const name = error?.name;
    switch (name) {
      case 'NotAllowedError':
      case 'PermissionDeniedError':
      case 'SecurityError':
        return new AppError('CAMERA_DENIED', MESSAGES.CAMERA_DENIED, { cause: error });
      case 'NotFoundError':
      case 'DevicesNotFoundError':
      case 'OverconstrainedError':
        return new AppError('CAMERA_NOT_FOUND', MESSAGES.CAMERA_NOT_FOUND, { cause: error });
      case 'NotReadableError':
      case 'TrackStartError':
      case 'AbortError':
        return new AppError('CAMERA_BUSY', MESSAGES.CAMERA_BUSY, { cause: error });
      default:
        return new AppError('CAMERA_FAILED', MESSAGES.CAMERA_FAILED, { cause: error });
    }
  }

  function waitForMetadata(video) {
    if (video.readyState >= 1 && video.videoWidth > 0) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        cleanup();
        reject(new AppError('CAMERA_NOT_READY', MESSAGES.CAMERA_NOT_READY));
      }, 10000);
      function onLoaded() { cleanup(); resolve(); }
      function cleanup() {
        clearTimeout(timeout);
        video.removeEventListener('loadedmetadata', onLoaded);
        video.removeEventListener('error', onError);
      }
      function onError() { cleanup(); reject(new AppError('CAMERA_FAILED', MESSAGES.CAMERA_FAILED)); }
      video.addEventListener('loadedmetadata', onLoaded, { once: true });
      video.addEventListener('error', onError, { once: true });
    });
  }

  function getTrack() {
    const track = stream?.getVideoTracks()[0];
    return track && track.readyState === 'live' ? track : null;
  }

  function getCaps() {
    const track = getTrack();
    if (!track) return {};
    try { return track.getCapabilities?.() || {}; } catch { return {}; }
  }

  /* ---- Focus ------------------------------------------------------------- */
  async function applyContinuousFocus() {
    const track = getTrack();
    if (!track) return;
    const caps = getCaps();
    if (!Array.isArray(caps.focusMode)) return;
    if (!caps.focusMode.includes('continuous')) return;
    try {
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    } catch { /* ignore */ }
  }

  async function triggerAutofocus() {
    const track = getTrack();
    if (!track) { await sleep(CONFIG.CAMERA.FOCUS_SETTLE_MS); return; }
    const caps = getCaps();
    if (Array.isArray(caps.focusMode) && caps.focusMode.includes('single-shot')) {
      try {
        await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
        await sleep(CONFIG.CAMERA.FOCUS_SETTLE_MS);
        if (caps.focusMode.includes('continuous')) {
          try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch {}
        }
        return;
      } catch { /* fall through */ }
    }
    await sleep(CONFIG.CAMERA.FOCUS_SETTLE_MS);
  }

  async function tapToFocus(clientX, clientY) {
    const track = getTrack();
    if (!track || !videoEl) return;
    const caps = getCaps();
    if (!Array.isArray(caps.pointsOfInterest)) return;

    const rect = videoEl.getBoundingClientRect();
    const x = clamp((clientX - rect.left) / rect.width, 0, 1);
    const y = clamp((clientY - rect.top) / rect.height, 0, 1);
    const px = facingMode === CONFIG.CAMERA.ALTERNATE_FACING ? 1 - x : x;

    const advanced = [{ pointsOfInterest: [{ x: px, y }] }];
    if (Array.isArray(caps.focusMode) && caps.focusMode.includes('single-shot')) {
      advanced.push({ focusMode: 'single-shot' });
    }
    try {
      await track.applyConstraints({ advanced });
      if (caps.focusMode?.includes('continuous')) {
        setTimeout(() => applyContinuousFocus(), 800);
      }
    } catch { /* ignore */ }
  }

  /* ---- Zoom -------------------------------------------------------------- */
  function refreshZoomInfo() {
    const caps = getCaps();
    if (caps.zoom && typeof caps.zoom.max === 'number' && caps.zoom.max > caps.zoom.min) {
      zoomInfo = {
        min: caps.zoom.min ?? 1,
        max: caps.zoom.max,
        step: caps.zoom.step ?? 0.1,
        native: true
      };
    } else {
      // Digital zoom fallback range (CSS transform).
      zoomInfo = { min: 1, max: 4, step: 0.1, native: false };
    }
    currentZoom = zoomInfo.min;
    digitalZoom = 1;
    applyDigitalZoomCSS(1);
  }

  function applyDigitalZoomCSS(scale) {
    if (!videoEl) return;
    if (zoomInfo.native) {
      videoEl.style.transform = '';
    } else {
      videoEl.style.transform = `scale(${scale})`;
    }
  }

  async function setZoom(value) {
    const track = getTrack();
    if (!track) return;
    const target = clamp(value, zoomInfo.min, zoomInfo.max);

    if (zoomInfo.native) {
      try {
        await track.applyConstraints({ advanced: [{ zoom: target }] });
        currentZoom = target;
      } catch { /* ignore */ }
    } else {
      digitalZoom = target;
      currentZoom = target;
      applyDigitalZoomCSS(digitalZoom);
    }
    // Re-assert focus — some devices unfocus on zoom changes.
    applyContinuousFocus();
  }

  function getZoom() { return currentZoom; }
  function getZoomInfo() { return { ...zoomInfo }; }

  /* ---- Torch ------------------------------------------------------------- */
  function hasTorch() { return getCaps().torch === true; }
  function isTorchOn() { return torchOn; }

  async function setTorch(on) {
    const track = getTrack();
    if (!track || !hasTorch()) return false;
    try {
      await track.applyConstraints({ advanced: [{ torch: Boolean(on) }] });
      torchOn = Boolean(on);
      return true;
    } catch { return false; }
  }

  /* ---- Capture ----------------------------------------------------------- */
  /**
   * Draws the current visible viewfinder content to a canvas.
   * Handles object-fit: cover and digital zoom scaling.
   */
  function captureFrame(targetCanvas) {
    if (!videoEl) throw new AppError('CAMERA_NOT_READY', MESSAGES.CAMERA_NOT_READY);
    const vw = videoEl.videoWidth;
    const vh = videoEl.videoHeight;
    if (!vw || !vh) throw new AppError('CAMERA_NOT_READY', MESSAGES.CAMERA_NOT_READY);

    const rect = videoEl.getBoundingClientRect();
    const dw = rect.width;
    const dh = rect.height;
    if (!dw || !dh) throw new AppError('CAMERA_NOT_READY', MESSAGES.CAMERA_NOT_READY);

    // object-fit: cover mapping.
    const coverScale = Math.max(dw / vw, dh / vh);
    const scaledW = vw * coverScale;
    const scaledH = vh * coverScale;

    // Digital zoom crops further inside the visible region.
    const dz = zoomInfo.native ? 1 : digitalZoom;
    const visibleW = dw / dz;
    const visibleH = dh / dz;
    const offsetX = (scaledW - visibleW) / 2;
    const offsetY = (scaledH - visibleH) / 2;

    const sx = offsetX / coverScale;
    const sy = offsetY / coverScale;
    const sw = visibleW / coverScale;
    const sh = visibleH / coverScale;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    targetCanvas.width = Math.round(dw * dpr);
    targetCanvas.height = Math.round(dh * dpr);
    const ctx = targetCanvas.getContext('2d');
    if (!ctx) throw new AppError('CAMERA_FAILED', MESSAGES.CAMERA_FAILED);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(videoEl, sx, sy, sw, sh, 0, 0, targetCanvas.width, targetCanvas.height);
    return targetCanvas;
  }

  /* ---- Lifecycle --------------------------------------------------------- */
  async function start(video) {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new AppError(
        window.isSecureContext ? 'CAMERA_UNSUPPORTED' : 'CAMERA_INSECURE',
        window.isSecureContext ? MESSAGES.CAMERA_UNSUPPORTED : MESSAGES.CAMERA_INSECURE
      );
    }

    videoEl = video;
    await stop();

    const constraints = {
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: CONFIG.CAMERA.IDEAL_WIDTH },
        height: { ideal: CONFIG.CAMERA.IDEAL_HEIGHT },
        advanced: [{ focusMode: 'continuous' }]
      }
    };

    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (error) {
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true }); }
      catch { throw translateError(error); }
    }

    videoEl.srcObject = stream;
    videoEl.setAttribute('playsinline', '');
    videoEl.muted = true;
    try { await videoEl.play(); } catch {}

    await waitForMetadata(videoEl);

    // Give the driver a beat, then explicitly force continuous AF.
    await sleep(150);
    await applyContinuousFocus();

    refreshZoomInfo();
    paused = false;
    torchOn = false;

    stream.getVideoTracks().forEach((track) => {
      track.enabled = true;
      track.addEventListener('ended', () => {
        if (stream && stream.getVideoTracks().every((t) => t.readyState === 'ended')) stream = null;
      });
    });

    return stream;
  }

  async function stop() {
    if (stream) {
      stream.getTracks().forEach((t) => { try { t.stop(); } catch {} });
      stream = null;
    }
    if (videoEl) { videoEl.pause(); videoEl.srcObject = null; }
    paused = false;
    torchOn = false;
  }

  function pause() {
    if (!stream || paused) return;
    stream.getVideoTracks().forEach((t) => { t.enabled = false; });
    if (videoEl) videoEl.pause();
    paused = true;
  }

  async function resume() {
    if (!stream || !paused) return;
    stream.getVideoTracks().forEach((t) => { t.enabled = true; });
    if (videoEl) {
      try { await videoEl.play(); } catch {}
    }
    paused = false;
    // Re-assert focus on resume.
    applyContinuousFocus();
  }

  async function switchCamera() {
    if (!videoEl) return;
    const wasTorch = torchOn;
    facingMode = facingMode === CONFIG.CAMERA.DEFAULT_FACING
      ? CONFIG.CAMERA.ALTERNATE_FACING
      : CONFIG.CAMERA.DEFAULT_FACING;
    await start(videoEl);
    if (wasTorch && hasTorch()) await setTorch(true);
  }

  function isActive() {
    return Boolean(stream && stream.getVideoTracks().some((t) => t.readyState === 'live'));
  }

  async function countCameras() {
    try {
      if (!navigator.mediaDevices?.enumerateDevices) return 0;
      const devices = await navigator.mediaDevices.enumerateDevices();
      return devices.filter((d) => d.kind === 'videoinput').length;
    } catch { return 0; }
  }

  return {
    start, stop, pause, resume, switchCamera, isActive, countCameras,
    triggerAutofocus, tapToFocus,
    hasTorch, setTorch, isTorchOn,
    setZoom, getZoom, getZoomInfo,
    captureFrame
  };
})();

/* ==========================================================================
 * 6. SELECTION SERVICE
 * ========================================================================== */
const SelectionService = (() => {
  let rect = { x: 0, y: 0, w: 0, h: 0 };
  let dragMode = null;
  let dragStart = null;
  const MIN_SIZE = 40;
  let imageCanvasRef = null;

  /* ---- Fit the frozen image inside the stage --------------------------- */
  function layoutFrozenImage() {
    const stage = DOM.selectionView.getBoundingClientRect();
    const canvas = DOM.frozenCanvas;
    const aspect = canvas.width / canvas.height;
    const stageAspect = stage.width / stage.height;

    let w, h;
    if (aspect > stageAspect) {
      w = stage.width; h = stage.width / aspect;
    } else {
      h = stage.height; w = stage.height * aspect;
    }
    DOM.frozenWrap.style.width = w + 'px';
    DOM.frozenWrap.style.height = h + 'px';
  }

  /* ---- Set the frozen image and default selection ---------------------- */
  function setImage(canvas) {
    imageCanvasRef = canvas;
    DOM.frozenCanvas.width = canvas.width;
    DOM.frozenCanvas.height = canvas.height;
    const ctx = DOM.frozenCanvas.getContext('2d');
    ctx.drawImage(canvas, 0, 0);

    requestAnimationFrame(() => {
      layoutFrozenImage();
      const wrap = DOM.frozenWrap.getBoundingClientRect();
      // Default: 80 % width, ~22 % height, centred.
      const w = wrap.width * 0.8;
      const h = Math.max(wrap.height * 0.22, 60);
      rect = { x: (wrap.width - w) / 2, y: (wrap.height - h) / 2, w, h };
      render();
    });
  }

  function render() {
    const s = DOM.selectionRect.style;
    s.left = rect.x + 'px';
    s.top = rect.y + 'px';
    s.width = rect.w + 'px';
    s.height = rect.h + 'px';
  }

  function getRect() { return { ...rect }; }

  /* ---- Pointer handlers ------------------------------------------------- */
  function onPointerDown(e) {
    const handleEl = e.target.closest('.handle');
    if (handleEl) {
      dragMode = 'resize-' + handleEl.dataset.handle;
    } else if (e.target === DOM.selectionRect) {
      dragMode = 'move';
    } else {
      return;
    }
    dragStart = { x: e.clientX, y: e.clientY, rect: { ...rect } };
    DOM.selectionRect.setPointerCapture(e.pointerId);
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!dragMode) return;
    const wrap = DOM.frozenWrap.getBoundingClientRect();
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    let { x, y, w, h } = dragStart.rect;

    if (dragMode === 'move') {
      x = clamp(x + dx, 0, wrap.width - w);
      y = clamp(y + dy, 0, wrap.height - h);
    } else if (dragMode === 'resize-br') {
      w = clamp(w + dx, MIN_SIZE, wrap.width - x);
      h = clamp(h + dy, MIN_SIZE, wrap.height - y);
    } else if (dragMode === 'resize-tl') {
      const nx = clamp(x + dx, 0, x + w - MIN_SIZE);
      const ny = clamp(y + dy, 0, y + h - MIN_SIZE);
      w = w - (nx - x);
      h = h - (ny - y);
      x = nx; y = ny;
    } else if (dragMode === 'resize-tr') {
      const ny = clamp(y + dy, 0, y + h - MIN_SIZE);
      w = clamp(w + dx, MIN_SIZE, wrap.width - x);
      h = h - (ny - y);
      y = ny;
    } else if (dragMode === 'resize-bl') {
      const nx = clamp(x + dx, 0, x + w - MIN_SIZE);
      w = w - (nx - x);
      x = nx;
      h = clamp(h + dy, MIN_SIZE, wrap.height - y);
    }

    rect = { x, y, w, h };
    render();
  }

  function onPointerUp() {
    dragMode = null;
    dragStart = null;
  }

  /* ---- Produce cropped canvas ------------------------------------------- */
  function cropSelection() {
    if (!imageCanvasRef) throw new AppError('OCR_FAILED', MESSAGES.OCR_FAILED);
    const wrap = DOM.frozenWrap.getBoundingClientRect();
    const scaleX = DOM.frozenCanvas.width / wrap.width;
    const scaleY = DOM.frozenCanvas.height / wrap.height;

    const sx = clamp(rect.x * scaleX, 0, DOM.frozenCanvas.width - 1);
    const sy = clamp(rect.y * scaleY, 0, DOM.frozenCanvas.height - 1);
    const sw = clamp(rect.w * scaleX, 1, DOM.frozenCanvas.width - sx);
    const sh = clamp(rect.h * scaleY, 1, DOM.frozenCanvas.height - sy);

    // Upscale small regions for OCR accuracy.
    const minTarget = 800;
    const upscale = clamp(minTarget / sw, 1, 4);
    const targetW = Math.min(Math.round(sw * upscale), 2200);
    const targetH = Math.max(1, Math.round((targetW / sw) * sh));

    const out = DOM.cropCanvas;
    out.width = targetW;
    out.height = targetH;
    const ctx = out.getContext('2d');
    if (!ctx) throw new AppError('OCR_FAILED', MESSAGES.OCR_FAILED);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(DOM.frozenCanvas, sx, sy, sw, sh, 0, 0, targetW, targetH);
    return out;
  }

  return {
    setImage, layoutFrozenImage, getRect, cropSelection,
    onPointerDown, onPointerMove, onPointerUp
  };
})();

/* ==========================================================================
 * 7. OCR SERVICE
 * ========================================================================== */
const OCRService = (() => {
  let workerPromise = null;
  let libraryPromise = null;

  function loadLibrary() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (libraryPromise) return libraryPromise;
    libraryPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = CONFIG.OCR.CDN_URL;
      script.async = true;
      script.crossOrigin = 'anonymous';
      script.onload = () => window.Tesseract
        ? resolve(window.Tesseract)
        : reject(new AppError('OCR_LIB', MESSAGES.OCR_LIB, { retryable: true }));
      script.onerror = () => {
        libraryPromise = null;
        reject(new AppError('OCR_LIB', MESSAGES.OCR_LIB, { retryable: true }));
      };
      document.head.appendChild(script);
    });
    return libraryPromise;
  }

  function getWorker() {
    if (workerPromise) return workerPromise;
    workerPromise = (async () => {
      const Tesseract = await loadLibrary();
      const worker = await Tesseract.createWorker(CONFIG.OCR.LANGUAGE, CONFIG.OCR.OEM, {
        logger: (msg) => {
          if (msg?.status === 'recognizing text') {
            UI.setStatus(`Reading… ${Math.round((msg.progress || 0) * 100)}%`);
          }
        },
        errorHandler: (err) => console.error('[ScanLex][OCR]', err)
      });
      try { await worker.setParameters({ tessedit_pageseg_mode: CONFIG.OCR.DEFAULT_PSM }); } catch {}
      return worker;
    })().catch((err) => {
      workerPromise = null;
      if (err instanceof AppError) throw err;
      throw new AppError('OCR_LIB', MESSAGES.OCR_LIB, { retryable: true, cause: err });
    });
    return workerPromise;
  }

  /* ---- Otsu binarisation --------------------------------------------- */
  function otsuThreshold(gray) {
    const hist = new Array(256).fill(0);
    for (let i = 0; i < gray.length; i++) hist[gray[i]]++;
    const total = gray.length;
    let sum = 0;
    for (let i = 0; i < 256; i++) sum += i * hist[i];
    let sumB = 0, wB = 0, maxVar = 0, threshold = 127;
    for (let i = 0; i < 256; i++) {
      wB += hist[i];
      if (wB === 0) continue;
      const wF = total - wB;
      if (wF === 0) break;
      sumB += i * hist[i];
      const mB = sumB / wB, mF = (sum - sumB) / wF;
      const between = wB * wF * (mB - mF) * (mB - mF);
      if (between > maxVar) { maxVar = between; threshold = i; }
    }
    return threshold;
  }

  function binarize(src) {
    const out = document.createElement('canvas');
    out.width = src.width; out.height = src.height;
    const ctx = out.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(src, 0, 0);
    const img = ctx.getImageData(0, 0, out.width, out.height);
    const data = img.data;
    const gray = new Uint8Array(data.length / 4);
    for (let i = 0, j = 0; i < data.length; i += 4, j++) {
      gray[j] = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) | 0;
    }
    const t = otsuThreshold(gray);
    for (let i = 0, j = 0; i < data.length; i += 4, j++) {
      const v = gray[j] > t ? 255 : 0;
      data[i] = v; data[i + 1] = v; data[i + 2] = v; data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return out;
  }

  function enhance(src) {
    const out = document.createElement('canvas');
    out.width = src.width; out.height = src.height;
    const ctx = out.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(src, 0, 0);
    try {
      const img = ctx.getImageData(0, 0, out.width, out.height);
      const data = img.data;
      const c = 1.35, b = 128 * (1 - c);
      for (let i = 0; i < data.length; i += 4) {
        const g = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        const v = clamp(g * c + b, 0, 255);
        data[i] = v; data[i + 1] = v; data[i + 2] = v;
      }
      ctx.putImageData(img, 0, 0);
    } catch {}
    return out;
  }

  async function recognizeRobust(canvas) {
    const worker = await getWorker();
    const passes = [
      { canvas: binarize(canvas), psm: CONFIG.OCR.PSM_LINE },
      { canvas: binarize(canvas), psm: CONFIG.OCR.PSM_BLOCK },
      { canvas: enhance(canvas),  psm: CONFIG.OCR.PSM_LINE }
    ];
    let best = { text: '', confidence: 0 };
    for (const p of passes) {
      try {
        await worker.setParameters({ tessedit_pageseg_mode: p.psm });
        const { data } = await worker.recognize(p.canvas);
        const text = typeof data?.text === 'string' ? data.text : '';
        const conf = typeof data?.confidence === 'number' ? data.confidence : 0;
        if (conf > best.confidence) best = { text, confidence: conf };
        if (conf >= CONFIG.OCR.MIN_CONFIDENCE_EARLY && text.replace(/\s/g, '').length >= 3) break;
      } catch {}
    }
    try { await worker.setParameters({ tessedit_pageseg_mode: CONFIG.OCR.DEFAULT_PSM }); } catch {}
    return best;
  }

  function tokenize(raw) {
    if (typeof raw !== 'string') return [];
    return raw.normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^a-z\s'-]+/g, ' ').replace(/\s+/g, ' ').trim()
      .split(' ').map((t) => t.replace(/^[-']+|[-']+$/g, ''))
      .filter((t) => {
        const l = t.replace(/[^a-z]/g, '');
        return l.length >= CONFIG.OCR.MIN_WORD_LENGTH && t.length <= CONFIG.OCR.MAX_WORD_LENGTH;
      });
  }

  function extractWord(raw) {
    const tokens = tokenize(raw);
    if (!tokens.length) return '';
    return tokens.slice().sort((a, b) => b.length - a.length)[0];
  }

  function sanitizeWord(raw) {
    const tokens = tokenize(raw);
    return tokens.length ? tokens[0] : '';
  }

  return { getWorker, recognizeRobust, extractWord, sanitizeWord };
})();

/* ==========================================================================
 * 8. DICTIONARY SERVICE
 * ========================================================================== */
const DictionaryService = (() => {
  const POS_MAP = Object.freeze({
    n: 'noun', v: 'verb', adj: 'adjective', adv: 'adverb',
    u: 'undefined', prop: 'proper noun', intj: 'interjection',
    conj: 'conjunction', pron: 'pronoun', prep: 'preposition',
    det: 'determiner', num: 'numeral'
  });

  function normalizePrimary(payload, query) {
    const entries = Array.isArray(payload) ? payload : [];
    const first = entries[0] || {};
    const phonetics = entries.flatMap((e) => Array.isArray(e.phonetics) ? e.phonetics : []);
    const phonetic = (typeof first.phonetic === 'string' && first.phonetic) ||
      (phonetics.find((p) => p?.text)?.text ?? '');
    const audio = phonetics.find((p) => p?.audio)?.audio ?? '';

    const groups = new Map();
    for (const entry of entries) {
      for (const meaning of Array.isArray(entry.meanings) ? entry.meanings : []) {
        const pos = (typeof meaning.partOfSpeech === 'string' && meaning.partOfSpeech) || 'definition';
        if (!groups.has(pos)) groups.set(pos, []);
        const bucket = groups.get(pos);
        for (const def of Array.isArray(meaning.definitions) ? meaning.definitions : []) {
          if (bucket.length >= CONFIG.UI.MAX_DEFINITIONS_PER_MEANING) break;
          const text = typeof def?.definition === 'string' ? def.definition.trim() : '';
          if (!text || bucket.some((x) => x.definition === text)) continue;
          bucket.push({
            definition: text,
            example: typeof def.example === 'string' ? def.example.trim() : '',
            synonyms: Array.isArray(def.synonyms)
              ? def.synonyms.slice(0, CONFIG.UI.MAX_SYNONYMS) : []
          });
        }
      }
    }
    const meanings = [...groups.entries()].filter(([, d]) => d.length > 0)
      .slice(0, CONFIG.UI.MAX_MEANINGS)
      .map(([partOfSpeech, definitions]) => ({ partOfSpeech, definitions }));

    return {
      word: typeof first.word === 'string' && first.word ? first.word : query,
      phonetic, audio, meanings
    };
  }

  async function fetchPrimary(word) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), CONFIG.API.TIMEOUT_MS);
    try {
      const url = `${CONFIG.API.PRIMARY_URL}/${encodeURIComponent(word)}`;
      const res = await fetch(url, { method: 'GET', headers: CONFIG.API.HEADERS, signal: controller.signal });
      if (res.status === 404) throw new AppError('NOT_FOUND', MESSAGES.NOT_FOUND);
      if (!res.ok) {
        throw new AppError('HTTP_ERROR', MESSAGES.HTTP_ERROR, {
          retryable: res.status >= 500 || res.status === 429
        });
      }
      let payload;
      try { payload = await res.json(); }
      catch (e) { throw new AppError('HTTP_ERROR', MESSAGES.HTTP_ERROR, { cause: e }); }
      const norm = normalizePrimary(payload, word);
      if (!norm.meanings.length) throw new AppError('NOT_FOUND', MESSAGES.NOT_FOUND);
      return norm;
    } catch (e) {
      if (e instanceof AppError) throw e;
      if (e?.name === 'AbortError') throw new AppError('TIMEOUT', MESSAGES.TIMEOUT, { retryable: true, cause: e });
      throw new AppError('NETWORK', MESSAGES.NETWORK, { retryable: true, cause: e });
    } finally { clearTimeout(timer); }
  }

  function normalizeFallback(payload, word) {
    if (!Array.isArray(payload) || !payload.length) return null;
    const lower = word.toLowerCase();
    const exact = payload.find((e) => e?.word?.toLowerCase() === lower &&
      Array.isArray(e.defs) && e.defs.length);
    const withDefs = payload.find((e) => Array.isArray(e?.defs) && e.defs.length);
    const match = exact || withDefs;
    if (!match) return null;

    const groups = new Map();
    for (const rawDef of match.defs) {
      if (typeof rawDef !== 'string') continue;
      const tabIdx = rawDef.indexOf('\t');
      let pos = 'definition';
      let text = rawDef;
      if (tabIdx >= 0) {
        const code = rawDef.slice(0, tabIdx).trim().toLowerCase();
        text = rawDef.slice(tabIdx + 1).trim();
        pos = POS_MAP[code] || 'definition';
      }
      if (!text) continue;
      if (!groups.has(pos)) groups.set(pos, []);
      const bucket = groups.get(pos);
      if (bucket.length >= CONFIG.UI.MAX_DEFINITIONS_PER_MEANING) continue;
      if (bucket.some((d) => d.definition === text)) continue;
      bucket.push({ definition: text, example: '', synonyms: [] });
    }
    const meanings = [...groups.entries()].filter(([, d]) => d.length > 0)
      .slice(0, CONFIG.UI.MAX_MEANINGS)
      .map(([partOfSpeech, definitions]) => ({ partOfSpeech, definitions }));
    if (!meanings.length) return null;

    return {
      word: typeof match.word === 'string' && match.word ? match.word : word,
      phonetic: '', audio: '', meanings
    };
  }

  async function fetchFallback(word) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), CONFIG.API.TIMEOUT_MS);
    try {
      const url = `${CONFIG.API.FALLBACK_URL}?sp=${encodeURIComponent(word)}&md=d&max=5`;
      const res = await fetch(url, { method: 'GET', signal: controller.signal });
      if (!res.ok) {
        throw new AppError('HTTP_ERROR', MESSAGES.HTTP_ERROR, {
          retryable: res.status >= 500 || res.status === 429
        });
      }
      let payload;
      try { payload = await res.json(); }
      catch (e) { throw new AppError('HTTP_ERROR', MESSAGES.HTTP_ERROR, { cause: e }); }
      const norm = normalizeFallback(payload, word);
      if (!norm) throw new AppError('NOT_FOUND', MESSAGES.NOT_FOUND);
      return norm;
    } catch (e) {
      if (e instanceof AppError) throw e;
      if (e?.name === 'AbortError') throw new AppError('TIMEOUT', MESSAGES.TIMEOUT, { retryable: true, cause: e });
      throw new AppError('NETWORK', MESSAGES.NETWORK, { retryable: true, cause: e });
    } finally { clearTimeout(timer); }
  }

  async function lookup(word) {
    if (!navigator.onLine) throw new AppError('OFFLINE', MESSAGES.OFFLINE, { retryable: true });
    let primaryError = null;
    try { return await fetchPrimary(word); }
    catch (e) {
      primaryError = e;
      const code = e instanceof AppError ? e.code : 'UNKNOWN';
      if (!['NOT_FOUND', 'TIMEOUT', 'NETWORK', 'HTTP_ERROR'].includes(code)) throw e;
    }
    try {
      const result = await fetchFallback(word);
      UI.toast('Primary dictionary was slow — loaded from backup source.');
      return result;
    } catch (fe) {
      if (fe instanceof AppError && fe.code === 'NOT_FOUND') throw fe;
      throw primaryError || fe;
    }
  }

  return { lookup };
})();

/* ==========================================================================
 * 9. APP CONTROLLER
 * ========================================================================== */
const App = (() => {
  const state = {
    busy: false,
    phase: 'camera',  // 'camera' | 'selecting' | 'processing'
    cameraReady: false,
    lastWord: '',
    ocrWarmedUp: false
  };

  /* ---- Camera lifecycle -------------------------------------------------- */
  async function startCamera() {
    try {
      await CameraService.start(DOM.video);
      state.cameraReady = true;
      UI.hideCameraError();
      UI.setStatus('Point at the page, zoom if needed, then tap Capture.');
      DOM.btnCapture.disabled = false;

      const count = await CameraService.countCameras();
      DOM.btnSwitch.hidden = count < 2;
      UI.setTorchUI(CameraService.isTorchOn(), CameraService.hasTorch());

      const zi = CameraService.getZoomInfo();
      UI.setZoomUI(CameraService.getZoom(), zi.min, zi.max, true);
      if (!zi.native && zi.max <= 1.01) DOM.zoomBar.hidden = true;

      warmUpOcr();
    } catch (error) {
      state.cameraReady = false;
      const msg = error instanceof AppError ? error.message : MESSAGES.CAMERA_FAILED;
      UI.showCameraError(msg);
      UI.setStatus('Camera unavailable — type a word instead.');
      DOM.btnCapture.disabled = true;
    }
  }

  function warmUpOcr() {
    if (state.ocrWarmedUp) return;
    state.ocrWarmedUp = true;
    const run = () => OCRService.getWorker().catch(() => { state.ocrWarmedUp = false; });
    if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout: 4000 });
    else setTimeout(run, 1200);
  }

  /* ---- Capture: freeze full frame → show selection --------------------- */
  async function onCapture() {
    if (state.busy || state.phase !== 'camera' || !state.cameraReady) {
      if (!state.cameraReady) openManualSheet(state.lastWord);
      return;
    }

    state.busy = true;
    DOM.btnCapture.disabled = true;
    UI.setStatus('Focusing…');

    try {
      await CameraService.triggerAutofocus();
      const frozen = CameraService.captureFrame(DOM.cropCanvas);
      CameraService.pause();

      // Copy frozen frame into the selection canvas and switch views.
      SelectionService.setImage(frozen);
      state.phase = 'selecting';
      UI.showSelectionView();
    } catch (error) {
      handleError(error);
    } finally {
      state.busy = false;
      DOM.btnCapture.disabled = false;
    }
  }

  /* ---- Retake: back to live camera ------------------------------------- */
  async function onRetake() {
    if (state.busy) return;
    state.phase = 'camera';
    UI.showCameraView();
    await CameraService.resume();
    UI.setStatus('Point at the page, zoom if needed, then tap Capture.');
  }

  /* ---- Confirm selection → crop → OCR → lookup ------------------------- */
  async function onLookUp() {
    if (state.busy || state.phase !== 'selecting') return;

    let crop;
    try {
      crop = SelectionService.cropSelection();
    } catch (error) {
      handleError(error);
      return;
    }

    state.phase = 'processing';
    state.busy = true;
    UI.setBusy(true, 'Reading…');
    UI.setStatus('Reading text from selection…');

    try {
      const { text, confidence } = await OCRService.recognizeRobust(crop);
      const word = OCRService.extractWord(text);
      if (!word) throw new AppError('OCR_EMPTY', MESSAGES.OCR_EMPTY, { retryable: true });
      if (word.length < 3 && confidence < 55) {
        throw new AppError('OCR_EMPTY', MESSAGES.OCR_EMPTY, { retryable: true });
      }
      await runLookup(word);
    } catch (error) {
      handleError(error);
    } finally {
      UI.setBusy(false);
      state.busy = false;
    }
  }

  /* ---- Lookup ------------------------------------------------------------ */
  async function runLookup(rawWord) {
    const word = OCRService.sanitizeWord(rawWord);
    if (!word) throw new AppError('BAD_WORD', MESSAGES.BAD_WORD);
    state.lastWord = word;

    UI.setBusy(true, 'Looking up…');

    try {
      const entry = await DictionaryService.lookup(word);
      UI.renderResult(entry, {
        onScanAnother: () => {
          UI.closeSheet(DOM.resultSheet);
          onRetake();
        },
        onTypeWord: () => {
          UI.closeSheet(DOM.resultSheet);
          openManualSheet('');
        }
      });
      UI.openSheet(DOM.resultSheet);
    } finally {
      UI.setBusy(false);
    }
  }

  /* ---- Error handling ---------------------------------------------------- */
  function describeError(error) {
    const code = error instanceof AppError ? error.code : 'UNKNOWN';
    const fallback = error instanceof AppError ? error.message : 'An unexpected error occurred.';

    switch (code) {
      case 'NOT_FOUND':
        return {
          title: 'Word not found',
          message: `We couldn't find a definition for “${state.lastWord}”. Try adjusting the selection or type a word.`,
          retryLabel: 'Adjust selection',
          onRetry: () => onLookUp()
        };
      case 'OFFLINE':
        return { title: "You're offline", message: MESSAGES.OFFLINE,
          retryLabel: 'Retry', onRetry: () => retryLastLookup() };
      case 'TIMEOUT':
        return { title: 'Request timed out', message: MESSAGES.TIMEOUT,
          retryLabel: 'Retry', onRetry: () => retryLastLookup() };
      case 'NETWORK':
        return { title: 'Connection problem', message: MESSAGES.NETWORK,
          retryLabel: 'Retry', onRetry: () => retryLastLookup() };
      case 'HTTP_ERROR':
        return { title: 'Dictionary unavailable', message: MESSAGES.HTTP_ERROR,
          retryLabel: 'Retry', onRetry: () => retryLastLookup() };
      case 'OCR_EMPTY':
      case 'OCR_FAILED':
        return {
          title: 'Could not read the text',
          message: MESSAGES.OCR_EMPTY,
          retryLabel: 'Adjust selection',
          onRetry: () => {
            state.phase = 'selecting';
            UI.showSelectionView();
          }
        };
      case 'OCR_LIB':
        return {
          title: 'Scanner unavailable',
          message: MESSAGES.OCR_LIB,
          retryLabel: 'Retry',
          onRetry: () => OCRService.getWorker().catch(() => UI.toast(MESSAGES.OCR_LIB))
        };
      case 'BAD_WORD':
        return { title: 'Invalid word', message: MESSAGES.BAD_WORD,
          retryLabel: 'Type a word', onRetry: () => openManualSheet('') };
      case 'CAMERA_NOT_READY':
        return { title: 'Camera not ready', message: MESSAGES.CAMERA_NOT_READY,
          retryLabel: 'Try again', onRetry: () => onCapture() };
      default:
        return { title: 'Something went wrong', message: fallback };
    }
  }

  function handleError(error) {
    console.error('[ScanLex]', error);
    UI.showError(describeError(error));
  }

  async function retryLastLookup() {
    if (!state.lastWord) { openManualSheet(''); return; }
    try { await runLookup(state.lastWord); }
    catch (error) { handleError(error); }
  }

  /* ---- Manual entry ------------------------------------------------------ */
  function openManualSheet(prefill = '') {
    UI.closeAllSheets();
    UI.clearInputError();
    DOM.manualInput.value = prefill || '';
    UI.openSheet(DOM.manualSheet);
  }

  async function onManualSubmit(event) {
    event.preventDefault();
    const word = OCRService.sanitizeWord(DOM.manualInput.value);
    if (!word) { UI.showInputError(MESSAGES.BAD_WORD); return; }
    UI.clearInputError();
    UI.closeSheet(DOM.manualSheet);
    try { await runLookup(word); }
    catch (error) { handleError(error); }
  }

  /* ---- Camera misc ------------------------------------------------------- */
  async function onSwitchCamera() {
    if (state.busy) return;
    try {
      await CameraService.switchCamera();
      UI.setTorchUI(CameraService.isTorchOn(), CameraService.hasTorch());
      const zi = CameraService.getZoomInfo();
      UI.setZoomUI(CameraService.getZoom(), zi.min, zi.max, true);
      UI.setStatus('Camera switched.');
    } catch (error) {
      const msg = error instanceof AppError ? error.message : MESSAGES.CAMERA_FAILED;
      UI.showCameraError(msg);
    }
  }

  async function onTorchToggle() {
    const next = !CameraService.isTorchOn();
    const ok = await CameraService.setTorch(next);
    if (ok) UI.setTorchUI(next, true);
    else { UI.setTorchUI(false, CameraService.hasTorch()); UI.toast('Torch unavailable.'); }
  }

  async function onZoomIn() {
    const zi = CameraService.getZoomInfo();
    const step = Math.max((zi.max - zi.min) * CONFIG.CAMERA.ZOOM_STEP_FRACTION, zi.step);
    await CameraService.setZoom(CameraService.getZoom() + step);
    UI.setZoomUI(CameraService.getZoom(), zi.min, zi.max, true);
  }

  async function onZoomOut() {
    const zi = CameraService.getZoomInfo();
    const step = Math.max((zi.max - zi.min) * CONFIG.CAMERA.ZOOM_STEP_FRACTION, zi.step);
    await CameraService.setZoom(CameraService.getZoom() - step);
    UI.setZoomUI(CameraService.getZoom(), zi.min, zi.max, true);
  }

  async function setZoomRaw(value) {
    const zi = CameraService.getZoomInfo();
    await CameraService.setZoom(value);
    UI.setZoomUI(CameraService.getZoom(), zi.min, zi.max, true);
  }

  async function onViewfinderTap(x, y) {
    if (state.phase !== 'camera' || !state.cameraReady) return;
    UI.showFocusRing(x, y);
    try { await CameraService.tapToFocus(x, y); } catch {}
  }

  /* ---- Network ----------------------------------------------------------- */
  function syncOnlineState() {
    const offline = !navigator.onLine;
    UI.setOffline(offline);
    if (offline) UI.setStatus('You are offline — reconnect to look up words.');
  }

  /* ---- Init -------------------------------------------------------------- */
  function init() {
    cacheDom();

    UI.bindEvents({
      onCapture,
      onRetake,
      onLookUp,
      onManualRequest: () => openManualSheet(state.lastWord),
      onCameraRetry: () => startCamera(),
      onSwitchCamera,
      onTorchToggle,
      onZoomIn,
      onZoomOut,
      getZoom: () => CameraService.getZoom(),
      setZoom: setZoomRaw,
      onViewfinderTap,
      onCloseResult: () => { UI.closeSheet(DOM.resultSheet); },
      onCloseManual: () => UI.closeSheet(DOM.manualSheet),
      onScrimClick: () => UI.closeAllSheets(),
      onManualSubmit
    });

    // Selection rect pointer handlers (attached once, live throughout).
    DOM.selectionRect.addEventListener('pointerdown', SelectionService.onPointerDown);
    DOM.selectionRect.addEventListener('pointermove', SelectionService.onPointerMove);
    DOM.selectionRect.addEventListener('pointerup', SelectionService.onPointerUp);
    DOM.selectionRect.addEventListener('pointercancel', SelectionService.onPointerUp);

    window.addEventListener('resize', () => {
      if (state.phase === 'selecting') {
        SelectionService.layoutFrozenImage();
        // Rescale selection rect proportionally (best effort).
      }
    });

    window.addEventListener('online', syncOnlineState);
    window.addEventListener('offline', syncOnlineState);
    syncOnlineState();

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) CameraService.pause();
      else if (state.phase === 'camera') CameraService.resume();
    });
    window.addEventListener('pagehide', () => { CameraService.stop(); });

    startCamera();
  }

  return { init, onCapture };
})();

/* ==========================================================================
 * 10. BOOTSTRAP
 * ========================================================================== */
try { App.init(); }
catch (error) {
  console.error('[ScanLex] Fatal initialisation error', error);
  document.body.textContent = 'ScanLex failed to start. Please reload the page.';
}
</script>
</body>
</html>
