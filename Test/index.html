<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Grocery Calc POS</title>

  <style>
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --surface-3: #3a3a3c;
      --key-bg: #2c2c2e;
      --key-active: #48484a;

      --text: #ffffff;
      --muted: #8e8e93;

      --blue: #0a84ff;
      --blue-soft: #64d2ff;
      --green: #30d158;
      --orange: #ff9f0a;
      --red: #ff453a;
      --yellow: #ffd60a;
      --purple: #bf5af2;

      --border: #1c1c1e;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

      --page-pad: clamp(10px, 3vw, 16px);
      --key-gap: clamp(7px, 2.2vw, 10px);
      --key-min-height: 58px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
    }

    .view-container {
      width: 100%;
      height: 100dvh;
      height: 100svh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-right: var(--safe-right);
      padding-left: var(--safe-left);
      background: var(--bg);
    }

    /* TOP BAR */
    .top-cart-bar {
      min-height: 56px;
      padding: 8px var(--page-pad);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid #29292b;
    }

    .vendor-mini {
      min-width: 0;
    }

    .vendor-quote-label {
      margin-bottom: 2px;
      color: var(--muted);
      font-size: clamp(0.72rem, 2.8vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 0.75px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .vendor-quote-price {
      color: var(--blue-soft);
      font-size: clamp(2.2rem, 5.5vw, 2.45rem);
      font-weight: 750;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .view-cart-btn {
      min-height: 44px;
      max-width: 62%;
      padding: 6px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      border-radius: 18px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      overflow: hidden;
    }

    .view-cart-btn:active {
      transform: scale(0.97);
      opacity: 0.88;
    }

    .cart-btn-title {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(0.935rem, 3.52vw, 1.08rem);
      font-weight: 700;
      line-height: 1.15;
    }

    .cart-btn-sub {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(0.77rem, 2.75vw, 0.88rem);
      font-weight: 600;
      line-height: 1.15;
      opacity: 0.9;
    }

    /* HOME INFORMATION PANEL */
    .top-window-60 {
      min-height: 0;
      padding: clamp(10px, 2.8vw, 16px) var(--page-pad) 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface);
      border-bottom: 1px solid #29292b;
      scrollbar-width: none;
    }

    .top-window-60::-webkit-scrollbar,
    .cart-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .display-section {
      flex: 1 1 auto;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .section-label {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: clamp(0.72rem, 2.8vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 0.8px;
      line-height: 1.15;
      text-transform: uppercase;
    }

    .main-display {
      min-width: 0;
      text-align: right;
    }

    .price-display {
      width: 100%;
      overflow: hidden;
      color: var(--text);
      font-size: clamp(2.9rem, 12vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 0.98;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .price-display.has-input {
      color: var(--blue-soft);
    }

    .display-meta {
      margin-top: 8px;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .formula-display {
      color: var(--yellow);
      font-size: clamp(0.85rem, 3.4vw, 1.05rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.2px;
    }

    .selection-area {
      flex: 0 0 auto;
    }

    .selector-group + .selector-group {
      margin-top: 12px;
    }

    .base-weight-row-updated {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .target-weight-row-custom {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .weight-btn,
    .base-dropdown-select,
    .chip-dropdown-select {
      min-width: 0;
      min-height: 48px;
      padding: 7px 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #363638;
      border-radius: 12px;
      background: #222224;
      color: #ffffff;
      font-size: clamp(0.85rem, 3.4vw, 1.02rem);
      font-weight: 700;
      line-height: 1;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .base-dropdown-select,
    .chip-dropdown-select {
      width: 100%;
      text-align-last: center;
      appearance: none;
      -webkit-appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%238e8e93" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 8px center;
      padding-right: 18px;
    }

    .base-dropdown-select option,
    .chip-dropdown-select option {
      background: #1c1c1e;
      color: #fff;
    }

    .weight-btn:active {
      transform: scale(0.96);
    }

    .weight-btn.base-selected,
    .base-dropdown-select.base-selected {
      border-color: var(--blue);
      background-color: rgba(10, 132, 255, 0.28);
      color: #fff;
    }

    .target-btn:active {
      background: rgba(48, 209, 88, 0.34);
      border-color: var(--green);
      color: #fff;
    }

    .custom-inline-btn {
      border-color: rgba(255, 159, 10, 0.7);
      background: rgba(255, 159, 10, 0.2);
      color: #ffb340;
    }

    /* KEYPAD */
    .bottom-numpad-40 {
      width: 100%;
      height: clamp(292px, 43dvh, 390px);
      min-height: 292px;
      flex-shrink: 0;
      padding: 8px var(--page-pad) max(10px, var(--safe-bottom));
      display: flex;
      overflow: hidden;
      background: var(--bg);
    }

    .keypad-container {
      width: min(100%, 410px);
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(var(--key-min-height), 1fr));
      gap: var(--key-gap);
    }

    .key {
      min-width: 0;
      min-height: var(--key-min-height);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: clamp(18px, 6vw, 30px);
      background: var(--key-bg);
      color: var(--text);
      font-size: clamp(1.55rem, 7vw, 2.15rem);
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      font-variant-numeric: tabular-nums;
    }

    .key:active {
      background: var(--key-active);
      transform: scale(0.965);
    }

    .key.action-clear-all {
      background: #a5a5a5;
      color: #000;
      font-weight: 600;
    }

    .key.action-clear-all:active {
      background: #c5c5c5;
    }

    .key.action-backspace {
      background: var(--orange);
      color: #000;
      font-size: clamp(1.35rem, 6vw, 1.9rem);
      font-weight: 600;
    }

    .key.action-backspace:active {
      background: #ffb340;
    }

    /* CUSTOM WEIGHT SCREEN */
    #customWeightView {
      display: none;
      grid-template-rows: minmax(0, 1fr) auto;
      background: var(--bg);
    }

    .custom-top-60 {
      min-height: 0;
      padding: 18px var(--page-pad) 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface);
      border-bottom: 1px solid #29292b;
    }

    .custom-display-group {
      flex: 1 1 auto;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .custom-title {
      margin-bottom: 8px;
      color: var(--purple);
      font-size: clamp(0.8rem, 3.2vw, 0.95rem);
      font-weight: 750;
      letter-spacing: 1px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .custom-display {
      overflow: hidden;
      color: var(--yellow);
      font-size: clamp(2.8rem, 13vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .custom-subdisplay {
      margin-top: 8px;
      color: var(--purple);
      font-size: clamp(1rem, 3.8vw, 1.2rem);
      font-weight: 600;
    }

    .custom-action-row {
      width: min(100%, 360px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 9px;
      flex-shrink: 0;
    }

    .btn-cancel,
    .btn-add-cart {
      min-height: 48px;
      border-radius: 14px;
      cursor: pointer;
      font-size: clamp(0.9rem, 3.6vw, 1.05rem);
    }

    .btn-cancel {
      background: var(--surface-3);
      color: #fff;
      font-weight: 600;
    }

    .btn-add-cart {
      background: var(--green);
      color: #000;
      font-weight: 750;
      text-transform: uppercase;
    }

    .btn-cancel:active,
    .btn-add-cart:active {
      transform: scale(0.97);
    }

    /* MODAL BASE */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      padding:
        max(14px, var(--safe-top))
        max(14px, var(--safe-right))
        max(14px, var(--safe-bottom))
        max(14px, var(--safe-left));
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal-content {
      width: min(100%, 420px);
      max-height: min(88dvh, 700px);
      min-height: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      border: 1px solid #38383a;
      border-radius: 22px;
      background: #1c1c1e;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* NAME PROMPT MODAL STYLES */
    .name-input-field {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      padding: 0 14px;
      border: 1px solid #3a3a3c;
      border-radius: 12px;
      background: #2c2c2e;
      color: #ffffff;
      font-size: 1.05rem;
      outline: none;
    }

    .name-input-field:focus {
      border-color: var(--blue);
    }

    .quick-chips-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .chip-btn {
      min-height: 40px;
      padding: 6px 10px;
      border: 1px solid #3a3a3c;
      border-radius: 12px;
      background: #2c2c2e;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chip-btn:active {
      background: var(--blue);
    }

    .chip-dropdown-select {
      min-height: 40px;
      border-radius: 12px;
      font-size: 0.9rem;
    }

    .modal-action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    /* CART MODAL */
    .cart-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .cart-title {
      margin: 0;
      font-size: clamp(1.15rem, 4.2vw, 1.3rem);
      font-weight: 700;
    }

    .cart-count {
      color: var(--muted);
      font-size: clamp(0.82rem, 3vw, 0.92rem);
      font-weight: 600;
    }

    .cart-scroll-container {
      min-height: 0;
      margin-top: 10px;
      overflow: auto;
      border-radius: 10px;
    }

    .cart-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .cart-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #1c1c1e;
      color: var(--muted);
      font-size: clamp(0.75rem, 2.8vw, 0.85rem);
      font-weight: 700;
      text-transform: uppercase;
    }

    .cart-table th,
    .cart-table td {
      padding: 10px 4px;
      border-bottom: 1px solid #29292b;
      text-align: center;
      font-size: clamp(0.82rem, 3.2vw, 0.95rem);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .cart-table th:nth-child(1),
    .cart-table td:nth-child(1) {
      width: 25%;
      text-align: left;
      padding-left: 6px;
    }

    .cart-table th:nth-child(2),
    .cart-table td:nth-child(2) {
      width: 18%;
    }

    .cart-table th:nth-child(3),
    .cart-table td:nth-child(3) {
      width: 23%;
    }

    .cart-table th:nth-child(4),
    .cart-table td:nth-child(4) {
      width: 22%;
    }

    .cart-table th:nth-child(5),
    .cart-table td:nth-child(5) {
      width: 12%;
    }

    .remove-item-btn {
      min-width: 32px;
      min-height: 32px;
      border-radius: 16px;
      background: transparent;
      color: var(--red);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .remove-item-btn:active {
      background: rgba(255, 69, 58, 0.16);
    }

    .cart-empty {
      padding: 24px 8px;
      color: var(--muted);
      text-align: center;
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
    }

    .cart-modal-actions {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      flex-shrink: 0;
    }

    .btn-clear-cart,
    .close-modal-btn {
      min-height: 48px;
      border-radius: 13px;
      cursor: pointer;
      font-size: clamp(0.88rem, 3.4vw, 1rem);
      font-weight: 650;
    }

    .btn-clear-cart {
      background: var(--red);
      color: #fff;
    }

    .close-modal-btn {
      background: var(--surface-2);
      color: #fff;
    }

    .btn-clear-cart:active,
    .close-modal-btn:active {
      transform: scale(0.97);
    }

    @media (max-height: 650px) {
      :root {
        --key-min-height: 52px;
      }

      .bottom-numpad-40 {
        height: 278px;
        min-height: 278px;
      }

      .top-window-60 {
        padding-top: 7px;
        padding-bottom: 6px;
        gap: 8px;
      }

      .display-section {
        min-height: 88px;
      }

      .price-display {
        font-size: clamp(2.8rem, 11.4vw, 3.9rem);
      }

      .weight-btn,
      .base-dropdown-select,
      .chip-dropdown-select {
        min-height: 40px;
        padding-top: 5px;
        padding-bottom: 5px;
      }

      .selector-group + .selector-group {
        margin-top: 6px;
      }
    }

    @media (min-width: 500px) {
      .top-window-60,
      .bottom-numpad-40 {
        padding-left: max(20px, var(--page-pad));
        padding-right: max(20px, var(--page-pad));
      }
    }
  </style>
</head>

<body>

  <!-- VIEW 1: HOME MAIN POS SCREEN -->
  <div class="view-container" id="homeView">

    <header class="top-cart-bar" id="topHeader">
      <div class="vendor-mini">
        <div class="vendor-quote-label">Vendor Price</div>
        <div class="vendor-quote-price" id="headerVendorQuote">₹0</div>
      </div>

      <button class="view-cart-btn" id="openCartBtn" type="button" aria-label="Open shopping cart">
        <span class="cart-btn-title" id="cartBtnTitle">Cart (0) · ₹0.00</span>
        <span class="cart-btn-sub" id="cartBtnSub">Total: 0.00 Kg</span>
      </button>
    </header>

    <main class="top-window-60" id="homeDisplayContainer">

      <section class="display-section">
        <div class="section-label">Price</div>

        <div class="main-display">
          <div class="price-display" id="displayCurrentItemPrice">₹0</div>

          <div class="display-meta">
            <div class="formula-display" id="displayMathFormula">Equation: --</div>
          </div>
        </div>
      </section>

      <section class="selection-area">

        <div class="selector-group">
          <div class="section-label">Quote Base Weight</div>

          <div class="base-weight-row-updated" id="baseWeightRow">
            <div class="weight-btn base-btn base-selected" data-weight="0.25">250g</div>
            <div class="weight-btn base-btn" data-weight="1">1Kg</div>
            <select class="base-dropdown-select" id="baseWeightDropdown" aria-label="Select alternate base weight">
              <option value="" disabled selected hidden>More...</option>
              <option value="0.1">100g</option>
              <option value="0.5">500g</option>
              <option value="0.75">750g</option>
            </select>
          </div>
        </div>

        <div class="selector-group">
          <div class="section-label">Buying Weight</div>

          <div class="target-weight-row-custom" id="targetWeightRow">
            <div class="weight-btn target-btn" data-weight="0.1">100g</div>
            <div class="weight-btn target-btn" data-weight="0.25">250g</div>
            <div class="weight-btn target-btn" data-weight="0.5">500g</div>
            <div class="weight-btn target-btn" data-weight="0.75">750g</div>
            <div class="weight-btn target-btn" data-weight="1">1Kg</div>
            <div class="weight-btn custom-inline-btn" id="openCustomWtBtn">Custom</div>
          </div>
        </div>

      </section>
    </main>

    <section class="bottom-numpad-40" aria-label="Number keypad">
      <div class="keypad-container" id="homeKeypad">
        <button class="key num-key" type="button">7</button>
        <button class="key num-key" type="button">8</button>
        <button class="key num-key" type="button">9</button>

        <button class="key num-key" type="button">4</button>
        <button class="key num-key" type="button">5</button>
        <button class="key num-key" type="button">6</button>

        <button class="key num-key" type="button">1</button>
        <button class="key num-key" type="button">2</button>
        <button class="key num-key" type="button">3</button>

        <button class="key action-clear-all" id="homeClearEntryBtn" type="button">C</button>
        <button class="key num-key" type="button">0</button>
        <button class="key action-backspace" id="homeBackspaceBtn" type="button" aria-label="Backspace">⌫</button>
      </div>
    </section>
  </div>


  <!-- VIEW 2: CUSTOM WEIGHT SCREEN -->
  <div class="view-container" id="customWeightView">

    <section class="custom-top-60" id="customDisplayContainer">

      <div class="custom-display-group">
        <div class="custom-title">Enter Custom Weight</div>
        <div class="custom-display" id="customDisplay">0 Kg</div>
        <div class="custom-subdisplay" id="customSubDisplay">Equivalent: 0g</div>
      </div>

      <div class="custom-action-row">
        <button class="btn-cancel" id="cancelCustomBtn" type="button">Cancel</button>
        <button class="btn-add-cart" id="addCustomToCartBtn" type="button">Add to Cart</button>
      </div>

    </section>

    <section class="bottom-numpad-40" aria-label="Custom weight keypad">
      <div class="keypad-container" id="customKeypad">
        <button class="key c-num-key" type="button">7</button>
        <button class="key c-num-key" type="button">8</button>
        <button class="key c-num-key" type="button">9</button>

        <button class="key c-num-key" type="button">4</button>
        <button class="key c-num-key" type="button">5</button>
        <button class="key c-num-key" type="button">6</button>

        <button class="key c-num-key" type="button">1</button>
        <button class="key c-num-key" type="button">2</button>
        <button class="key c-num-key" type="button">3</button>

        <button class="key c-num-key" type="button">.</button>
        <button class="key c-num-key" type="button">0</button>
        <button class="key action-backspace" id="customBackspaceBtn" type="button" aria-label="Backspace">⌫</button>
      </div>
    </section>
  </div>


  <!-- QUICK-NAME PROMPT MODAL -->
  <div class="modal" id="itemNameModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="cart-title">Item Name (Optional)</div>
      
      <input type="text" id="itemNameInput" class="name-input-field" placeholder="e.g. Tomato, Onion, Apple..." />

      <div class="quick-chips-row" id="quickChipsContainer">
        <button class="chip-btn" type="button" data-name="Tomato">Tomato</button>
        <button class="chip-btn" type="button" data-name="Potato">Potato</button>
        <button class="chip-btn" type="button" data-name="Onion">Onion</button>
        
        <select class="chip-dropdown-select" id="moreItemsDropdown" aria-label="More grocery items">
          <option value="" disabled selected hidden>More...</option>
          <option value="Garlic">Garlic</option>
          <option value="Green Garlic">Green Garlic</option>
          <option value="Green Onion">Green Onion</option>
          <option value="Gobhi">Gobhi</option>
          <option value="Cabbge">Cabbge</option>
          <option value="Palak">Palak</option>
          <option value="Saag">Saag</option>
          <option value="Carrot">Carrot</option>
          <option value="Bengan">Bengan</option>
          <option value="Bhindi">Bhindi</option>
          <option value="Ghiya">Ghiya</option>
          <option value="Tori">Tori</option>
          <option value="Carrot">Carrot</option>
          <option value="Radish">Radish</option>
          <option value="Kathal">Kathal</option>
          <option value="Beans">Beans</option>
          <option value="Green Chilli">Green Chilli</option>
          <option value="Lemon">Lemon</option>
          <option value="Apple">Apple</option>
          <option value="Papaya">Papaya</option>
          <option value="Amrud">Amrud</option>
          <option value="Anaar">Anaar</option>
        </select>
      </div>

      <div class="modal-action-row">
        <button class="btn-cancel" id="skipItemNameBtn" type="button">Skip</button>
        <button class="btn-add-cart" id="confirmItemNameBtn" type="button">Add</button>
      </div>
    </div>
  </div>


  <!-- CART MODAL -->
  <div class="modal" id="cartModal" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <div class="modal-content">

      <div class="cart-title-row">
        <h3 class="cart-title" id="cartTitle">Shopping Cart</h3>
        <span class="cart-count" id="cartCountLabel">0 items</span>
      </div>

      <div class="cart-scroll-container">
        <table class="cart-table" id="cartTable">
          <thead>
            <tr>
              <th>Item</th>
              <th>Weight</th>
              <th>Quote</th>
              <th>Price</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <div class="cart-empty" id="cartEmptyMessage">
          Your cart is empty.
        </div>
      </div>

      <div class="cart-modal-actions">
        <button class="btn-clear-cart" id="clearAllCartBtn" type="button">Clear Cart</button>
        <button class="close-modal-btn" id="closeCartBtn" type="button">Back</button>
      </div>

    </div>
  </div>


  <script>
    /* CORE STATE */
    let priceInput = "";
    let customWeightInput = "";
    let baseWeight = 0.25;
    let pendingTargetWeight = null;
    let itemCounter = 1;
    let cart = [];

    /* DOM REFERENCES */
    const homeView = document.getElementById("homeView");
    const customWeightView = document.getElementById("customWeightView");
    const displayCurrentItemPrice = document.getElementById("displayCurrentItemPrice");
    const displayMathFormula = document.getElementById("displayMathFormula");
    const headerVendorQuote = document.getElementById("headerVendorQuote");

    const homeKeypad = document.getElementById("homeKeypad");
    const homeBackspaceBtn = document.getElementById("homeBackspaceBtn");
    const homeClearEntryBtn = document.getElementById("homeClearEntryBtn");

    const openCustomWtBtn = document.getElementById("openCustomWtBtn");
    const baseWeightRow = document.getElementById("baseWeightRow");
    const baseWeightDropdown = document.getElementById("baseWeightDropdown");
    const targetWeightRow = document.getElementById("targetWeightRow");

    const customDisplay = document.getElementById("customDisplay");
    const customSubDisplay = document.getElementById("customSubDisplay");
    const customKeypad = document.getElementById("customKeypad");
    const customBackspaceBtn = document.getElementById("customBackspaceBtn");
    const cancelCustomBtn = document.getElementById("cancelCustomBtn");
    const addCustomToCartBtn = document.getElementById("addCustomToCartBtn");

    const cartBtnTitle = document.getElementById("cartBtnTitle");
    const cartBtnSub = document.getElementById("cartBtnSub");
    const cartCountLabel = document.getElementById("cartCountLabel");
    const openCartBtn = document.getElementById("openCartBtn");
    const cartModal = document.getElementById("cartModal");
    const closeCartBtn = document.getElementById("closeCartBtn");
    const clearAllCartBtn = document.getElementById("clearAllCartBtn");
    const cartTableBody = document.querySelector("#cartTable tbody");
    const cartEmptyMessage = document.getElementById("cartEmptyMessage");

    const itemNameModal = document.getElementById("itemNameModal");
    const itemNameInput = document.getElementById("itemNameInput");
    const quickChipsContainer = document.getElementById("quickChipsContainer");
    const moreItemsDropdown = document.getElementById("moreItemsDropdown");
    const skipItemNameBtn = document.getElementById("skipItemNameBtn");
    const confirmItemNameBtn = document.getElementById("confirmItemNameBtn");

    /* DISPLAY HELPERS */
    function formatWeight(weightKg) {
      if (weightKg < 1) {
        return `${Math.round(weightKg * 1000)}g`;
      }
      return `${weightKg.toFixed(2)}Kg`;
    }

    function formatBaseWeight(weightKg) {
      return weightKg >= 1
        ? `${weightKg}Kg`
        : `${Math.round(weightKg * 1000)}g`;
    }

    function updateHomeDisplay() {
      headerVendorQuote.textContent = priceInput ? `₹${priceInput}` : "₹0";

      if (priceInput && parseFloat(priceInput) > 0) {
        const val = parseFloat(priceInput);
        const bLabel = formatBaseWeight(baseWeight);
        displayMathFormula.textContent = `(₹${val} ÷ ${bLabel}) × Target Wt`;
      } else if (!displayCurrentItemPrice.classList.contains("has-input")) {
        displayMathFormula.textContent = `Equation: (Price ÷ ${formatBaseWeight(baseWeight)}) × Wt`;
      }
    }

    /* MAIN KEYPAD */
    homeKeypad.addEventListener("click", (e) => {
      const key = e.target.closest(".num-key");
      if (!key || !homeKeypad.contains(key)) return;

      const val = key.textContent.trim();
      if (priceInput === "0" && val === "0") return;
      if (priceInput === "0" && val !== "0") {
        priceInput = val;
        updateHomeDisplay();
        return;
      }
      if (priceInput.length >= 6) return;

      priceInput += val;
      updateHomeDisplay();
    });

    homeBackspaceBtn.addEventListener("click", () => {
      priceInput = priceInput.slice(0, -1);
      updateHomeDisplay();
    });

    homeClearEntryBtn.addEventListener("click", () => {
      priceInput = "";
      displayCurrentItemPrice.textContent = "₹0";
      displayCurrentItemPrice.classList.remove("has-input");
      updateHomeDisplay();
    });

    /* BASE WEIGHT SELECTOR */
    baseWeightRow.addEventListener("click", (e) => {
      const button = e.target.closest(".base-btn");
      if (!button || !baseWeightRow.contains(button)) return;

      document.querySelectorAll(".base-btn").forEach((b) => b.classList.remove("base-selected"));
      baseWeightDropdown.classList.remove("base-selected");
      baseWeightDropdown.selectedIndex = 0;

      button.classList.add("base-selected");
      baseWeight = parseFloat(button.dataset.weight);
      updateHomeDisplay();
    });

    baseWeightDropdown.addEventListener("change", (e) => {
      const selectedVal = parseFloat(e.target.value);
      if (isNaN(selectedVal)) return;

      document.querySelectorAll(".base-btn").forEach((b) => b.classList.remove("base-selected"));
      baseWeightDropdown.classList.add("base-selected");
      baseWeight = selectedVal;
      updateHomeDisplay();
    });

    /* TARGET WEIGHT & PROMPT INTERCEPT */
    targetWeightRow.addEventListener("click", (e) => {
      const button = e.target.closest(".target-btn");
      if (!button || !targetWeightRow.contains(button)) return;

      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        showTemporaryMessage("Enter a price first.");
        return;
      }

      pendingTargetWeight = parseFloat(button.dataset.weight);
      promptItemName();
    });

    /* NAME PROMPT MODAL LOGIC */
    function promptItemName() {
      itemNameInput.value = "";
      moreItemsDropdown.selectedIndex = 0;
      itemNameModal.style.display = "flex";
      itemNameInput.focus();
    }

    quickChipsContainer.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip-btn");
      if (!chip) return;
      itemNameInput.value = chip.dataset.name;
    });

    moreItemsDropdown.addEventListener("change", (e) => {
      if (e.target.value) {
        itemNameInput.value = e.target.value;
      }
    });

    skipItemNameBtn.addEventListener("click", () => {
      finalizeAddToCart("");
    });

    confirmItemNameBtn.addEventListener("click", () => {
      finalizeAddToCart(itemNameInput.value.trim());
    });

    itemNameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        finalizeAddToCart(itemNameInput.value.trim());
      }
    });

    function finalizeAddToCart(nameVal) {
      itemNameModal.style.display = "none";
      if (pendingTargetWeight !== null) {
        processAddToCart(pendingTargetWeight, nameVal);
        pendingTargetWeight = null;
      }
    }

    /* CUSTOM WEIGHT SCREEN */
    openCustomWtBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        showTemporaryMessage("Enter a vendor price first.");
        return;
      }

      customWeightInput = "";
      updateCustomDisplay();
      homeView.style.display = "none";
      customWeightView.style.display = "grid";
    });

    cancelCustomBtn.addEventListener("click", () => {
      customWeightView.style.display = "none";
      homeView.style.display = "grid";
    });

    customKeypad.addEventListener("click", (e) => {
      const key = e.target.closest(".c-num-key");
      if (!key || !customKeypad.contains(key)) return;

      const val = key.textContent.trim();
      if (val === ".") {
        if (customWeightInput.includes(".")) return;
        if (customWeightInput === "") customWeightInput = "0";
        customWeightInput += ".";
        updateCustomDisplay();
        return;
      }

      if (customWeightInput === "0" && val === "0") return;
      if (customWeightInput === "0" && val !== "0") {
        customWeightInput = val;
        updateCustomDisplay();
        return;
      }

      if (customWeightInput.length >= 6) return;

      customWeightInput += val;
      updateCustomDisplay();
    });

    customBackspaceBtn.addEventListener("click", () => {
      customWeightInput = customWeightInput.slice(0, -1);
      updateCustomDisplay();
    });

    function updateCustomDisplay() {
      if (!customWeightInput) {
        customDisplay.textContent = "0 Kg";
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      if (customWeightInput === ".") {
        customDisplay.textContent = "0. Kg";
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      customDisplay.textContent = `${customWeightInput} Kg`;
      const numericVal = parseFloat(customWeightInput);

      if (isNaN(numericVal)) {
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      const calculatedGrams = Math.round(numericVal * 1000);
      customSubDisplay.textContent = `Equivalent: ${calculatedGrams}g`;
    }

    addCustomToCartBtn.addEventListener("click", () => {
      const finalWeightInKg = parseFloat(customWeightInput);
      if (isNaN(finalWeightInKg) || finalWeightInKg <= 0) {
        showTemporaryMessage("Type a valid weight.");
        return;
      }

      pendingTargetWeight = finalWeightInKg;
      customWeightView.style.display = "none";
      homeView.style.display = "grid";
      promptItemName();
    });

    /* CART CALCULATION */
    function processAddToCart(targetWeight, customName = "") {
      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        showTemporaryMessage("Enter a price first.");
        return false;
      }

      const calculatedPrice = ((priceVal / baseWeight) * targetWeight).toFixed(2);
      const baseLabel = formatBaseWeight(baseWeight);
      const targetLabel = formatWeight(targetWeight);

      const newItem = {
        id: itemCounter++,
        name: customName || `Item #${itemCounter - 1}`,
        weight: targetWeight,
        quote: `₹${priceVal}/${baseLabel}`,
        price: parseFloat(calculatedPrice)
      };

      cart.push(newItem);

      displayCurrentItemPrice.textContent = `₹${newItem.price.toFixed(2)}`;
      displayCurrentItemPrice.classList.add("has-input");

      displayMathFormula.textContent =
        `(₹${priceVal} ÷ ${baseLabel}) × ${targetLabel} = ₹${newItem.price.toFixed(2)}`;

      renderCart();

      priceInput = "";
      headerVendorQuote.textContent = "₹0";
      return true;
    }

    /* CART RENDERING */
    function renderCart() {
      cartTableBody.innerHTML = "";
      let totalP = 0;
      let totalW = 0;

      cart.forEach((item, idx) => {
        totalP += item.price;
        totalW += item.weight;

        const row = cartTableBody.insertRow();
        row.innerHTML = `
          <td>${item.name}</td>
          <td>${formatWeight(item.weight)}</td>
          <td>${item.quote}</td>
          <td>₹${item.price.toFixed(2)}</td>
          <td>
            <button class="remove-item-btn" type="button" data-index="${idx}" aria-label="Remove item">×</button>
          </td>
        `;
      });

      cartBtnTitle.textContent = `Cart (${cart.length}) · ₹${totalP.toFixed(2)}`;
      cartBtnSub.textContent = `Total: ${totalW.toFixed(2)} Kg`;
      cartCountLabel.textContent = `${cart.length} ${cart.length === 1 ? "item" : "items"}`;
      cartEmptyMessage.style.display = cart.length === 0 ? "block" : "none";

      if (cart.length === 0) {
        displayCurrentItemPrice.textContent = "₹0";
        displayCurrentItemPrice.classList.remove("has-input");
        updateHomeDisplay();
      }
    }

    /* CART ITEM DELETION */
    cartTableBody.addEventListener("click", (e) => {
      const button = e.target.closest(".remove-item-btn");
      if (!button) return;

      const index = parseInt(button.dataset.index, 10);
      if (Number.isNaN(index)) return;

      removeItem(index);
    });

    window.removeItem = function(index) {
      if (index < 0 || index >= cart.length) return;
      cart.splice(index, 1);
      renderCart();
    };

    /* CLEAR CART */
    clearAllCartBtn.addEventListener("click", () => {
      if (cart.length === 0) return;

      if (window.confirm("Clear all items in cart?")) {
        cart = [];
        itemCounter = 1;
        priceInput = "";

        displayCurrentItemPrice.textContent = "₹0";
        displayCurrentItemPrice.classList.remove("has-input");

        updateHomeDisplay();
        renderCart();
        cartModal.style.display = "none";
      }
    });

    /* CART MODAL SHOW/HIDE */
    openCartBtn.addEventListener("click", () => {
      renderCart();
      cartModal.style.display = "flex";
    });

    closeCartBtn.addEventListener("click", () => {
      cartModal.style.display = "none";
    });

    cartModal.addEventListener("click", (e) => {
      if (e.target === cartModal) cartModal.style.display = "none";
    });

    /* NON-BLOCKING FEEDBACK TOAST */
    let messageTimer = null;
    function showTemporaryMessage(message) {
      let toast = document.getElementById("appToast");

      if (!toast) {
        toast = document.createElement("div");
        toast.id = "appToast";

        Object.assign(toast.style, {
          position: "fixed",
          left: "50%",
          bottom: "calc(43dvh + 14px)",
          transform: "translateX(-50%)",
          zIndex: "3000",
          maxWidth: "calc(100vw - 32px)",
          padding: "10px 15px",
          borderRadius: "16px",
          background: "rgba(44,44,46,0.96)",
          color: "#fff",
          fontSize: "0.88rem",
          fontWeight: "650",
          textAlign: "center",
          boxShadow: "0 8px 30px rgba(0,0,0,.35)",
          pointerEvents: "none",
          transition: "opacity .18s ease, transform .18s ease"
        });

        document.body.appendChild(toast);
      }

      toast.textContent = message;
      toast.style.opacity = "1";
      toast.style.transform = "translateX(-50%) translateY(0)";

      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(-50%) translateY(6px)";
      }, 1600);
    }

    /* INITIALIZATION */
    updateHomeDisplay();
    renderCart();
  </script>

</body>
</html>
