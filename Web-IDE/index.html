<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IDE & Validator</title>
    <!-- Prism.js Themes for VS Code Light & Dark Syntax Highlighting -->
    <link rel="stylesheet" id="prism-theme" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <style>
        :root {
            --bg-app: #ffffff;
            --bg-header: #f3f3f3;
            --border-color: #e5e5e5;
            --text-main: #333333;
            --text-muted: #767676;
            --bg-editor: #ffffff;
            --bg-line-num: #f3f3f3;
            --bg-tab-bar: #f3f3f3;
            --bg-tab: #ececec;
            --bg-tab-active: #ffffff;
            --text-tab: #616161;
            --text-tab-active: #007acc;
            --bg-console: #f8f8f8;
            --bg-minimap: #f3f3f3;
            --resizer-bg: #e5e5e5;
            --resizer-hover: #007acc;
        }

        [data-theme="dark"] {
            --bg-app: #1e1e1e;
            --bg-header: #252526;
            --border-color: #3c3c3c;
            --text-main: #d4d4d4;
            --text-muted: #858585;
            --bg-editor: #1e1e1e;
            --bg-line-num: #1e1e1e;
            --bg-tab-bar: #2d2d2d;
            --bg-tab: #2d2d2d;
            --bg-tab-active: #1e1e1e;
            --text-tab: #9cdcfe;
            --text-tab-active: #ffffff;
            --bg-console: #181818;
            --bg-minimap: #252526;
            --resizer-bg: #2d2d2d;
            --resizer-hover: #007acc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-app);
            color: var(--text-main);
            overflow: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Toolbar */
        header {
            height: 50px;
            background-color: var(--bg-header);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .logo {
            font-weight: 600;
            font-size: 16px;
            color: #007acc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover { background-color: #1177bb; }
        .btn-run { background-color: #28a745; }
        .btn-run:hover { background-color: #218838; }
        .btn-clear { background-color: #d9534f; }
        .btn-clear:hover { background-color: #c9302c; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }

        /* Layout Grid */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            position: relative;
            user-select: none;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 200px;
            height: 100%;
        }

        .tabs {
            display: flex;
            background-color: var(--bg-tab-bar);
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-tab);
            background-color: var(--bg-tab);
            border-right: 1px solid var(--border-color);
            user-select: none;
        }

        .tab.active {
            background-color: var(--bg-tab-active);
            color: var(--text-tab-active);
            border-top: 2px solid #007acc;
        }

        /* Editor Wrapper with Overlay Highlighting */
        .editor-wrapper {
            flex: 1;
            position: relative;
            display: none;
            background-color: var(--bg-editor);
            overflow: hidden;
        }

        .editor-wrapper.active {
            display: flex;
        }

        .line-numbers {
            width: 55px;
            background-color: var(--bg-line-num);
            color: var(--text-muted);
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
            padding: 16px 8px 16px 0;
            text-align: right;
            user-select: none;
            border-right: 1px solid var(--border-color);
            overflow: hidden;
        }

        .code-container {
            flex: 1;
            position: relative;
            height: 100%;
            overflow: hidden;
        }

        /* Syntax Highlighter Overlay */
        textarea, pre.highlight-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            padding: 16px;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre;
            tab-size: 2;
            border: none;
            outline: none;
            box-sizing: border-box;
            margin: 0;
        }

        textarea {
            color: transparent;
            background: transparent;
            caret-color: var(--text-main);
            resize: none;
            z-index: 2;
            overflow: scroll;
        }

        pre.highlight-layer {
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            background: transparent !important;
        }

        pre.highlight-layer code {
            font-family: inherit !important;
            font-size: inherit !important;
            line-height: inherit !important;
            padding: 0 !important;
            background: transparent !important;
        }

        /* Minimap */
        .minimap-container {
            width: 110px;
            background-color: var(--bg-minimap);
            border-left: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .minimap-content {
            font-family: "Consolas", "Courier New", monospace;
            font-size: 3px;
            line-height: 3.2px;
            color: var(--text-muted);
            padding: 4px;
            white-space: pre;
            pointer-events: none;
            word-wrap: break-word;
        }

        .minimap-slider {
            position: absolute;
            top: 0; left: 0; right: 0;
            background: rgba(0, 122, 204, 0.15);
            border: 1px solid rgba(0, 122, 204, 0.3);
            cursor: grab;
        }

        .minimap-slider:active { cursor: grabbing; }

        /* Resizer */
        .resizer {
            width: 6px;
            background-color: var(--resizer-bg);
            cursor: col-resize;
            transition: background-color 0.2s;
            z-index: 5;
        }

        .resizer:hover, .resizer.dragging { background-color: var(--resizer-hover); }

        /* Preview Pane */
        .preview-pane {
            width: 50%;
            min-width: 150px;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            position: relative;
        }

        .preview-header {
            height: 35px;
            background-color: var(--bg-header);
            color: var(--text-muted);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--border-color);
            user-select: none;
        }

        .iframe-overlay {
            position: absolute;
            top: 35px; left: 0; right: 0; bottom: 0;
            display: none;
        }

        .dragging .iframe-overlay { display: block; }

        iframe {
            width: 100%; height: 100%;
            border: none;
            background-color: #ffffff;
        }

        /* Console Panel */
        .console-panel {
            height: 120px;
            background-color: var(--bg-console);
            border-top: 1px solid var(--border-color);
            font-family: monospace;
            font-size: 12px;
            overflow-y: auto;
            padding: 8px 12px;
            user-select: text;
        }

        .console-entry { margin-bottom: 4px; word-break: break-all; }
        .console-entry.log { color: var(--text-main); }
        .console-entry.error { color: #f48771; }
        .console-entry.warn { color: #cca700; }
        .console-entry.info { color: #007acc; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ WebIDE</div>
        <div class="controls">
            <button id="themeToggleBtn" class="btn-secondary" title="Switch Theme">🌙 Dark Mode</button>
            <button id="runBtn" class="btn-run" title="Execute Code (Ctrl+Enter)">▶ Run Code</button>
            <button id="clearAppBtn" class="btn-clear" title="Reset all editors">🗑️ Clear All</button>
            <button id="clearConsoleBtn" class="btn-secondary">Clear Logs</button>
        </div>
    </header>

    <div class="main-container" id="mainContainer">
        <div class="editor-pane">
            <div class="tabs">
                <div class="tab active" data-target="wrapper-raw">RAW</div>
                <div class="tab" data-target="wrapper-html">HTML</div>
                <div class="tab" data-target="wrapper-css">CSS</div>
                <div class="tab" data-target="wrapper-js">JavaScript</div>
            </div>

            <!-- RAW Editor -->
            <div class="editor-wrapper active" id="wrapper-raw">
                <div class="line-numbers" id="num-raw">1</div>
                <div class="code-container">
                    <pre class="highlight-layer"><code class="language-html" id="hl-raw"></code></pre>
                    <textarea id="raw-code" spellcheck="false" placeholder="Paste complete single-file HTML source code here..."></textarea>
                </div>
                <div class="minimap-container" id="map-container-raw">
                    <div class="minimap-content" id="map-content-raw"></div>
                    <div class="minimap-slider" id="map-slider-raw"></div>
                </div>
            </div>

            <!-- HTML Editor -->
            <div class="editor-wrapper" id="wrapper-html">
                <div class="line-numbers" id="num-html">1</div>
                <div class="code-container">
                    <pre class="highlight-layer"><code class="language-html" id="hl-html"></code></pre>
                    <textarea id="html-code" spellcheck="false" placeholder="HTML structure..."></textarea>
                </div>
                <div class="minimap-container" id="map-container-html">
                    <div class="minimap-content" id="map-content-html"></div>
                    <div class="minimap-slider" id="map-slider-html"></div>
                </div>
            </div>

            <!-- CSS Editor -->
            <div class="editor-wrapper" id="wrapper-css">
                <div class="line-numbers" id="num-css">1</div>
                <div class="code-container">
                    <pre class="highlight-layer"><code class="language-css" id="hl-css"></code></pre>
                    <textarea id="css-code" spellcheck="false" placeholder="CSS rules..."></textarea>
                </div>
                <div class="minimap-container" id="map-container-css">
                    <div class="minimap-content" id="map-content-css"></div>
                    <div class="minimap-slider" id="map-slider-css"></div>
                </div>
            </div>

            <!-- JS Editor -->
            <div class="editor-wrapper" id="wrapper-js">
                <div class="line-numbers" id="num-js">1</div>
                <div class="code-container">
                    <pre class="highlight-layer"><code class="language-javascript" id="hl-js"></code></pre>
                    <textarea id="js-code" spellcheck="false" placeholder="JavaScript logic..."></textarea>
                </div>
                <div class="minimap-container" id="map-container-js">
                    <div class="minimap-content" id="map-content-js"></div>
                    <div class="minimap-slider" id="map-slider-js"></div>
                </div>
            </div>

            <div class="console-panel" id="console">
                <div class="console-entry info">[System] IDE Ready. Paste complete code into RAW tab and click 'Run Code'.</div>
            </div>
        </div>

        <div class="resizer" id="resizer"></div>

        <div class="preview-pane" id="previewPane">
            <div class="preview-header">
                <span>PREVIEW WINDOW</span>
                <span id="status-indicator">Manual Run Mode</span>
            </div>
            <div class="iframe-overlay"></div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <!-- Prism Syntax Highlighting Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <script>
        const defaultRAW = `<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body {\n      font-family: system-ui, sans-serif;\n      padding: 2rem;\n      background: #f4f7f6;\n      color: #333;\n    }\n    .container {\n      background: white;\n      padding: 2rem;\n      border-radius: 8px;\n      box-shadow: 0 4px 6px rgba(0,0,0,0.1);\n    }\n    h1 {\n      color: #007acc;\n      margin-bottom: 0.5rem;\n    }\n    button {\n      margin-top: 1rem;\n      padding: 10px 16px;\n      background: #007acc;\n      color: white;\n      border: none;\n      border-radius: 4px;\n      cursor: pointer;\n    }\n  </style>\n</head>\n<body>\n  <div class="container">\n    <h1>Web IDE Preview</h1>\n    <p>Click <b>Run Code</b> to execute and update this preview panel.</p>\n    <button id="demoBtn">Click Me</button>\n  </div>\n  <script>\n    document.getElementById('demoBtn').addEventListener('click', () => {\n      console.log('Button clicked inside preview!');\n      alert('Hello from the Preview!');\n    });\n  <\/script>\n</body>\n</html>`;

        const editors = {
            raw: { input: document.getElementById('raw-code'), hl: document.getElementById('hl-raw'), num: document.getElementById('num-raw'), mapContent: document.getElementById('map-content-raw'), mapSlider: document.getElementById('map-slider-raw'), mapContainer: document.getElementById('map-container-raw'), startLine: 1, lang: 'html' },
            html: { input: document.getElementById('html-code'), hl: document.getElementById('hl-html'), num: document.getElementById('num-html'), mapContent: document.getElementById('map-content-html'), mapSlider: document.getElementById('map-slider-html'), mapContainer: document.getElementById('map-container-html'), startLine: 1, lang: 'html' },
            css: { input: document.getElementById('css-code'), hl: document.getElementById('hl-css'), num: document.getElementById('num-css'), mapContent: document.getElementById('map-content-css'), mapSlider: document.getElementById('map-slider-css'), mapContainer: document.getElementById('map-container-css'), startLine: 1, lang: 'css' },
            js: { input: document.getElementById('js-code'), hl: document.getElementById('hl-js'), num: document.getElementById('num-js'), mapContent: document.getElementById('map-content-js'), mapSlider: document.getElementById('map-slider-js'), mapContainer: document.getElementById('map-container-js'), startLine: 1, lang: 'javascript' }
        };

        const consolePanel = document.getElementById('console');
        const runBtn = document.getElementById('runBtn');
        const clearAppBtn = document.getElementById('clearAppBtn');
        const clearConsoleBtn = document.getElementById('clearConsoleBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const prismTheme = document.getElementById('prism-theme');

        editors.raw.input.value = defaultRAW;

        // Theme Switcher (Light Mode Default)
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggleBtn.textContent = '☀️ Light Mode';
                prismTheme.href = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggleBtn.textContent = '🌙 Dark Mode';
                prismTheme.href = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css';
            }
        });

        // Tab Switcher
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.editor-wrapper').forEach(w => w.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
                syncAll();
            });
        });

        // Parse RAW code into separate tabs
        function parseRawCode() {
            const originalText = editors.raw.input.value;
            let text = originalText;
            let extractedCSS = [];
            let extractedJS = [];

            editors.html.startLine = 1;
            editors.css.startLine = 1;
            editors.js.startLine = 1;

            const styleMatch = originalText.match(/<style[\s\S]*?>/i);
            if (styleMatch) {
                const beforeStyle = originalText.substring(0, styleMatch.index);
                editors.css.startLine = beforeStyle.split('\n').length + 1;
            }

            text = text.replace(/<style[\s\S]*?>([\s\S]*?)<\/style>/gi, (_, cssContent) => {
                extractedCSS.push(cssContent.trim());
                return '';
            });

            const scriptMatch = originalText.match(/<script(?![^>]*\bsrc=)[\s\S]*?>/i);
            if (scriptMatch) {
                const beforeScript = originalText.substring(0, scriptMatch.index);
                editors.js.startLine = beforeScript.split('\n').length + 1;
            }

            text = text.replace(/<script(?![^>]*\bsrc=)[\s\S]*?>([\s\S]*?)<\/script>/gi, (_, jsContent) => {
                extractedJS.push(jsContent.trim());
                return '';
            });

            editors.html.input.value = text.trim();
            editors.css.input.value = extractedCSS.join('\n\n');
            editors.js.input.value = extractedJS.join('\n\n');

            syncAll();
        }

        editors.raw.input.addEventListener('paste', () => {
            setTimeout(() => {
                parseRawCode();
                logToConsole("Source code parsed from RAW tab into HTML, CSS, and JS tabs. Click 'Run Code' to preview.", "info");
            }, 50);
        });

        editors.raw.input.addEventListener('input', () => {
            parseRawCode();
        });

        // Editor Synchronizer & Syntax Highlighter
        function updateEditorDecorations(key) {
            const editor = editors[key];
            const codeText = editor.input.value;
            const lines = codeText.split('\n');
            const startLine = editor.startLine || 1;
            
            // Line numbers offset
            editor.num.innerHTML = Array.from({ length: lines.length }, (_, i) => i + startLine).join('<br>');
            
            // Syntax Highlighting
            editor.hl.textContent = codeText + (codeText.endsWith('\n') ? ' ' : '');
            Prism.highlightElement(editor.hl);

            // Sync scrolling between overlay and textarea
            editor.hl.parentElement.scrollTop = editor.input.scrollTop;
            editor.hl.parentElement.scrollLeft = editor.input.scrollLeft;

            // Minimap
            editor.mapContent.textContent = codeText;
            editor.num.scrollTop = editor.input.scrollTop;
            
            const scrollRatio = editor.input.scrollTop / (editor.input.scrollHeight - editor.input.clientHeight || 1);
            const sliderHeight = Math.max(20, (editor.input.clientHeight / editor.input.scrollHeight) * editor.mapContainer.clientHeight);
            const maxSliderTop = editor.mapContainer.clientHeight - sliderHeight;
            
            editor.mapSlider.style.height = `${sliderHeight}px`;
            editor.mapSlider.style.top = `${scrollRatio * maxSliderTop}px`;
        }

        function syncAll() {
            Object.keys(editors).forEach(updateEditorDecorations);
        }

        Object.keys(editors).forEach(key => {
            const ed = editors[key];
            ed.input.addEventListener('input', () => updateEditorDecorations(key));
            ed.input.addEventListener('scroll', () => updateEditorDecorations(key));

            let isDraggingSlider = false;
            let startY = 0;
            let startScrollTop = 0;

            ed.mapSlider.addEventListener('mousedown', (e) => {
                isDraggingSlider = true;
                startY = e.clientY;
                startScrollTop = ed.input.scrollTop;
                document.body.style.userSelect = 'none';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDraggingSlider) return;
                const deltaY = e.clientY - startY;
                const scrollableHeight = ed.input.scrollHeight - ed.input.clientHeight;
                const sliderMaxTop = ed.mapContainer.clientHeight - parseFloat(ed.mapSlider.style.height);
                const scrollAmount = (deltaY / sliderMaxTop) * scrollableHeight;
                ed.input.scrollTop = startScrollTop + scrollAmount;
            });

            window.addEventListener('mouseup', () => {
                isDraggingSlider = false;
                document.body.style.userSelect = '';
            });
        });

        // Execution Routine
        function executeCode() {
            const html = editors.html.input.value;
            const css = editors.css.input.value;
            const js = editors.js.input.value;

            const injectedJS = `
                <script>
                    (function() {
                        const _log = console.log, _error = console.error, _warn = console.warn;
                        console.log = (...args) => { window.parent.postMessage({ type: 'log', data: args.join(' ') }, '*'); _log.apply(console, args); };
                        console.error = (...args) => { window.parent.postMessage({ type: 'error', data: args.join(' ') }, '*'); _error.apply(console, args); };
                        console.warn = (...args) => { window.parent.postMessage({ type: 'warn', data: args.join(' ') }, '*'); _warn.apply(console, args); };
                        window.onerror = (msg, url, line) => { window.parent.postMessage({ type: 'error', data: 'Runtime Error: ' + msg + ' (Line ' + line + ')' }, '*'); return false; };
                    })();
                <\/script>
            `;

            const fullContent = `
                <!DOCTYPE html>
                <html>
                <head><style>${css}</style></head>
                <body>
                    ${html}
                    ${injectedJS}
                    <script>${js}<\/script>
                </body>
                </html>
            `;

            const oldFrame = document.getElementById('preview-frame');
            const newFrame = document.createElement('iframe');
            newFrame.id = 'preview-frame';
            oldFrame.parentNode.replaceChild(newFrame, oldFrame);

            const iframeDoc = newFrame.contentDocument || newFrame.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(fullContent);
            iframeDoc.close();

            logToConsole("Code executed successfully.", "info");
        }

        // Window Resizer Logic
        const resizer = document.getElementById('resizer');
        const mainContainer = document.getElementById('mainContainer');
        const previewPane = document.getElementById('previewPane');
        let isResizing = false;

        resizer.addEventListener('mousedown', () => {
            isResizing = true;
            resizer.classList.add('dragging');
            mainContainer.classList.add('dragging');
        });

        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerRect = mainContainer.getBoundingClientRect();
            const pointerRelativeX = e.clientX - containerRect.left;
            const newPreviewWidth = containerRect.width - pointerRelativeX;

            if (newPreviewWidth > 150 && pointerRelativeX > 200) {
                previewPane.style.width = `${newPreviewWidth}px`;
                previewPane.style.flex = 'none';
            }
        });

        window.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('dragging');
                mainContainer.classList.remove('dragging');
            }
        });

        function logToConsole(message, type = 'log') {
            const entry = document.createElement('div');
            entry.className = `console-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consolePanel.appendChild(entry);
            consolePanel.scrollTop = consolePanel.scrollHeight;
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type) {
                logToConsole(event.data.data, event.data.type);
            }
        });

        runBtn.addEventListener('click', executeCode);

        clearAppBtn.addEventListener('click', () => {
            Object.keys(editors).forEach(key => {
                editors[key].input.value = '';
                editors[key].startLine = 1;
            });

            const oldFrame = document.getElementById('preview-frame');
            const newFrame = document.createElement('iframe');
            newFrame.id = 'preview-frame';
            oldFrame.parentNode.replaceChild(newFrame, oldFrame);

            consolePanel.innerHTML = '';
            syncAll();
            logToConsole("Application state cleared.", "info");
        });

        clearConsoleBtn.addEventListener('click', () => {
            consolePanel.innerHTML = '';
        });

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                executeCode();
            }
        });

        parseRawCode();
