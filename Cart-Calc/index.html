<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grocery Calc POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121318" />
  <style>
    :root {
      --bg: #121318;
      --card: #1a1c23;
      --primary: #2563eb;
      --accent: #16a34a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --key-bg: #262933;
      --key-active: #3b82f6;
      --border: #2e323e;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; touch-action: manipulation; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* TOP HEADER */
    .top-cart-bar {
      background-color: var(--card);
      border-bottom: 2px solid var(--border);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex: 0 0 auto;
    }

    .current-item-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .current-item-price {
      font-size: 1.25rem;
      font-weight: 800;
      color: #38edf8;
    }

    .current-item-weight {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .view-cart-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      cursor: pointer;
    }

    .cart-btn-title {
      font-weight: 800;
      font-size: 0.85rem;
    }

    .cart-btn-sub {
      font-size: 0.7rem;
      opacity: 0.85;
      font-weight: 500;
    }

    /* MAIN POS VIEW */
    .view-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100%;
    }

    .display-container {
      background-color: var(--card);
      padding: 12px 16px;
      border-bottom: 2px solid var(--border);
      flex: 0 0 auto;
    }

    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .display-row {
      display: flex;
      align-items: baseline;
    }

    .price-display {
      font-size: 2.2rem;
      font-weight: 800;
      color: #38edf8;
    }

    .weight-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .weight-btn {
      background-color: var(--key-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
    }

    .weight-btn.base-selected {
      border-color: var(--primary);
      background-color: rgba(37, 99, 235, 0.2);
      color: #60a5fa;
    }

    .weight-btn.target-btn {
      background-color: #14532d;
      border-color: var(--accent);
      color: #4ade80;
    }

    /* Keypads - Standardized Layout Dimensions */
    .keypad-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
      flex: 1;
      background-color: var(--bg);
    }

    .key {
      background-color: var(--key-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.8rem;
      font-weight: 600;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .key:active {
      background-color: var(--key-active);
      color: white;
    }

    .key.action-clear {
      background-color: #7f1d1d;
      color: #fca5a5;
    }

    .key.custom-wt-btn {
      background-color: #1e3a8a;
      border-color: #3b82f6;
      color: #93c5fd;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* DEDICATED CUSTOM WEIGHT SCREEN */
    #customWeightView {
      display: none;
      background-color: var(--bg);
    }

    /* Custom Display Container sized identically to .display-container */
    .custom-display-container {
      background-color: #2e1065;
      border-bottom: 2px solid #581c87;
      padding: 12px 16px;
      flex: 0 0 auto;
    }

    .custom-title {
      color: #d8b4fe;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .custom-display {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fde047;
    }

    .custom-subdisplay {
      font-size: 0.85rem;
      color: #c084fc;
      margin-top: 4px;
      font-weight: 600;
    }

    .custom-action-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
      grid-column: span 3;
    }

    .btn-cancel {
      background-color: #3f3f46;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-add-cart {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.1rem;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* Modal Cart Sheet */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal-content {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      border: 1px solid var(--border);
    }

    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .cart-table th, .cart-table td {
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .close-modal-btn {
      width: 100%;
      background: var(--key-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <div class="top-cart-bar" id="topHeader">
    <div>
      <div class="current-item-label">Current Item</div>
      <div class="current-item-price" id="currentItemPrice">₹0.00</div>
      <div class="current-item-weight" id="currentItemWeight">Weight: --</div>
    </div>
    <button class="view-cart-btn" id="openCartBtn">
      <span class="cart-btn-title" id="cartBtnTitle">Cart (0) • ₹0.00</span>
      <span class="cart-btn-sub" id="cartBtnSub">Total: 0.00 Kg</span>
    </button>
  </div>

  <!-- VIEW 1: HOME MAIN POS SCREEN -->
  <div class="view-container" id="homeView">
    <div class="display-container" id="homeDisplayContainer">
      <div class="section-label">Vendor Price Quote</div>
      <div class="display-row">
        <div class="price-display" id="displayPrice">₹0</div>
      </div>

      <!-- Base Quote Selector -->
      <div class="section-label" style="margin-top: 8px;">Quote Base Weight</div>
      <div class="weight-row" id="baseWeightRow">
        <div class="weight-btn base-btn" data-weight="0.1">100g</div>
        <div class="weight-btn base-btn base-selected" data-weight="0.25">250g</div>
        <div class="weight-btn base-btn" data-weight="0.5">500g</div>
        <div class="weight-btn base-btn" data-weight="0.75">750g</div>
        <div class="weight-btn base-btn" data-weight="1">1Kg</div>
        <div class="weight-btn base-btn" data-weight="2">2Kg</div>
      </div>

      <!-- Target Purchase Selector -->
      <div class="section-label" style="margin-top: 8px;">Tap Target Weight to Add</div>
      <div class="weight-row" id="targetWeightRow">
        <div class="weight-btn target-btn" data-weight="0.25">250g</div>
        <div class="weight-btn target-btn" data-weight="0.5">500g</div>
        <div class="weight-btn target-btn" data-weight="0.75">750g</div>
        <div class="weight-btn target-btn" data-weight="1">1Kg</div>
        <div class="weight-btn target-btn" data-weight="1.5">1.5Kg</div>
        <div class="weight-btn target-btn" data-weight="2">2Kg</div>
      </div>
    </div>

    <!-- Main Home Numpad -->
    <div class="keypad-container" id="homeKeypad">
      <div class="key num-key">7</div>
      <div class="key num-key">8</div>
      <div class="key num-key">9</div>
      <div class="key num-key">4</div>
      <div class="key num-key">5</div>
      <div class="key num-key">6</div>
      <div class="key num-key">1</div>
      <div class="key num-key">2</div>
      <div class="key num-key">3</div>
      <div class="key action-clear" id="homeClearBtn">⌫</div>
      <div class="key num-key">0</div>
      <div class="key custom-wt-btn" id="openCustomWtBtn">Custom Wt</div>
    </div>
  </div>

  <!-- VIEW 2: DEDICATED CUSTOM WEIGHT SCREEN -->
  <div class="view-container" id="customWeightView">
    <div class="custom-display-container" id="customDisplayContainer">
      <div class="custom-title">Enter Custom Weight</div>
      <div class="custom-display" id="customDisplay">0 Kg</div>
      <div class="custom-subdisplay" id="customSubDisplay">Equivalent: 0g</div>
    </div>

    <!-- Dedicated Custom Weight Numpad -->
    <div class="keypad-container" id="customKeypad">
      <div class="key c-num-key">7</div>
      <div class="key c-num-key">8</div>
      <div class="key c-num-key">9</div>
      <div class="key c-num-key">4</div>
      <div class="key c-num-key">5</div>
      <div class="key c-num-key">6</div>
      <div class="key c-num-key">1</div>
      <div class="key c-num-key">2</div>
      <div class="key c-num-key">3</div>
      <div class="key action-clear" id="customClearBtn">⌫</div>
      <div class="key c-num-key">0</div>
      <div class="key c-num-key">.</div>

      <div class="custom-action-row">
        <button class="btn-cancel" id="cancelCustomBtn">Cancel</button>
        <button class="btn-add-cart" id="addCustomToCartBtn">Add to Cart</button>
      </div>
    </div>
  </div>

  <!-- Cart Modal Sheet -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <h3 style="margin-top:0;">🛒 Shopping Cart</h3>
      <table class="cart-table" id="cartTable">
        <thead>
          <tr><th>#</th><th>Weight</th><th>Quote</th><th>Price</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <button class="close-modal-btn" id="closeCartBtn">Back to Calculator</button>
    </div>
  </div>

  <script>
    let priceInput = "";
    let customWeightInput = "";
    let baseWeight = 0.25; // Default 250g
    let itemCounter = 1;
    let cart = [];

    // Views & Global Components
    const topHeader = document.getElementById("topHeader");
    const homeView = document.getElementById("homeView");
    const customWeightView = document.getElementById("customWeightView");

    // Display Containers
    const homeDisplayContainer = document.getElementById("homeDisplayContainer");
    const customDisplayContainer = document.getElementById("customDisplayContainer");

    // Home Elements
    const displayPrice = document.getElementById("displayPrice");
    const homeKeypad = document.getElementById("homeKeypad");
    const homeClearBtn = document.getElementById("homeClearBtn");
    const openCustomWtBtn = document.getElementById("openCustomWtBtn");
    const baseWeightRow = document.getElementById("baseWeightRow");
    const targetWeightRow = document.getElementById("targetWeightRow");

    // Custom Weight Elements
    const customDisplay = document.getElementById("customDisplay");
    const customSubDisplay = document.getElementById("customSubDisplay");
    const customKeypad = document.getElementById("customKeypad");
    const customClearBtn = document.getElementById("customClearBtn");
    const cancelCustomBtn = document.getElementById("cancelCustomBtn");
    const addCustomToCartBtn = document.getElementById("addCustomToCartBtn");

    // Top Header Elements
    const currentItemPrice = document.getElementById("currentItemPrice");
    const currentItemWeight = document.getElementById("currentItemWeight");
    const cartBtnTitle = document.getElementById("cartBtnTitle");
    const cartBtnSub = document.getElementById("cartBtnSub");
    
    // Modal Cart Elements
    const openCartBtn = document.getElementById("openCartBtn");
    const cartModal = document.getElementById("cartModal");
    const closeCartBtn = document.getElementById("closeCartBtn");
    const cartTableBody = document.querySelector("#cartTable tbody");

    // Home Numpad Logic
    homeKeypad.addEventListener("click", (e) => {
      if (!e.target.classList.contains("num-key")) return;
      if (priceInput.length >= 6) return;
      priceInput += e.target.textContent;
      updateHomeDisplay();
    });

    homeClearBtn.addEventListener("click", () => {
      priceInput = priceInput.slice(0, -1);
      updateHomeDisplay();
    });

    function updateHomeDisplay() {
      displayPrice.textContent = priceInput ? `₹${priceInput}` : "₹0";
    }

    // Base Weight Selection
    baseWeightRow.addEventListener("click", (e) => {
      if (!e.target.classList.contains("base-btn")) return;
      document.querySelectorAll(".base-btn").forEach(b => b.classList.remove("base-selected"));
      e.target.classList.add("base-selected");
      baseWeight = parseFloat(e.target.dataset.weight);
    });

    // Preset Target Weight Selection -> Auto Add
    targetWeightRow.addEventListener("click", (e) => {
      if (!e.target.classList.contains("target-btn")) return;
      const targetWeight = parseFloat(e.target.dataset.weight);
      processAddToCart(targetWeight);
    });

    // Switch to Custom Weight Screen
    openCustomWtBtn.addEventListener("click", () => {
      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        alert("Enter a vendor price first!");
        return;
      }
      
      // Sync layout heights perfectly with Home Screen Display Area
      const homeHeaderHeight = homeDisplayContainer.offsetHeight + topHeader.offsetHeight;
      customDisplayContainer.style.height = `${homeHeaderHeight}px`;

      customWeightInput = "";
      updateCustomDisplay();
      topHeader.style.display = "none";
      homeView.style.display = "none";
      customWeightView.style.display = "flex";
    });

    cancelCustomBtn.addEventListener("click", () => {
      customWeightView.style.display = "none";
      topHeader.style.display = "flex";
      homeView.style.display = "flex";
    });

    // Custom Weight Numpad Logic (Pure Standard Calculator Behavior)
    customKeypad.addEventListener("click", (e) => {
      if (!e.target.classList.contains("c-num-key")) return;
      const val = e.target.textContent;
      
      if (val === "." && customWeightInput.includes(".")) return;
      if (customWeightInput.length >= 6) return;

      customWeightInput += val;
      updateCustomDisplay();
    });

    customClearBtn.addEventListener("click", () => {
      customWeightInput = customWeightInput.slice(0, -1);
      updateCustomDisplay();
    });

    function updateCustomDisplay() {
      if (!customWeightInput || customWeightInput === ".") {
        customDisplay.textContent = customWeightInput === "." ? ". Kg" : "0 Kg";
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      const numericVal = parseFloat(customWeightInput);
      if (isNaN(numericVal)) {
        customDisplay.textContent = "0 Kg";
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      customDisplay.textContent = `${customWeightInput} Kg`;
      
      // Calculate direct metric equivalence (1 Kg = 1000g)
      const calculatedGrams = Math.round(numericVal * 1000);
      customSubDisplay.textContent = `Equivalent: ${calculatedGrams}g`;
    }

    addCustomToCartBtn.addEventListener("click", () => {
      const finalWeightInKg = parseFloat(customWeightInput);

      if (isNaN(finalWeightInKg) || finalWeightInKg <= 0) {
        alert("Type a valid weight!");
        return;
      }

      processAddToCart(finalWeightInKg);

      customWeightView.style.display = "none";
      topHeader.style.display = "flex";
      homeView.style.display = "flex";
    });

    // Add to Cart Logic & Header Updates
    function processAddToCart(targetWeight) {
      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        alert("Enter a price first!");
        return;
      }

      const calculatedPrice = ((priceVal / baseWeight) * targetWeight).toFixed(2);
      const baseLabel = baseWeight >= 1 ? `${baseWeight}Kg` : `${baseWeight * 1000}g`;

      const newItem = {
        id: itemCounter++,
        weight: targetWeight,
        quote: `₹${priceVal}/${baseLabel}`,
        price: parseFloat(calculatedPrice)
      };

      cart.push(newItem);

      // Update Left Header (Current Item Info)
      currentItemPrice.textContent = `₹${newItem.price.toFixed(2)}`;
      const formattedWt = newItem.weight < 1 ? `${Math.round(newItem.weight * 1000)}g` : `${newItem.weight.toFixed(2)}Kg`;
      currentItemWeight.textContent = `Weight: ${formattedWt}`;

      renderCart();

      // Clear Price Input for next item
      priceInput = "";
      updateHomeDisplay();
    }

    function renderCart() {
      cartTableBody.innerHTML = "";
      let totalP = 0, totalW = 0;

      cart.forEach((item, idx) => {
        totalP += item.price;
        totalW += item.weight;

        const row = cartTableBody.insertRow();
        row.innerHTML = `
          <td>Item #${item.id}</td>
          <td>${item.weight < 1 ? Math.round(item.weight * 1000) + 'g' : item.weight.toFixed(2) + 'Kg'}</td>
          <td>${item.quote}</td>
          <td>₹${item.price.toFixed(2)}</td>
          <td><button onclick="removeItem(${idx})" style="background:none;border:none;color:#ef4444;font-weight:bold;">🗑️</button></td>
        `;
      });

      // Update Right Header (Cart Total Info inside Button)
      cartBtnTitle.textContent = `Cart (${cart.length}) • ₹${totalP.toFixed(2)}`;
      cartBtnSub.textContent = `Total: ${totalW.toFixed(2)} Kg`;

      // Reset current item display if cart is completely emptied
      if (cart.length === 0) {
        currentItemPrice.textContent = "₹0.00";
        currentItemWeight.textContent = "Weight: --";
      }
    }

    window.removeItem = function(index) {
      cart.splice(index, 1);
      renderCart();
    };

    // Modal Drawer Controls
    openCartBtn.addEventListener("click", () => cartModal.style.display = "flex");
    closeCartBtn.addEventListener("click", () => cartModal.style.display = "none");
  </script>
</body>
</html>
