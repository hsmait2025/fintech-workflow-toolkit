<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" id="metaThemeColor" />
  <title>Grocery Calc POS</title>

  <!-- html2canvas CDN for High-Resolution PNG Snapshots -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* DARK THEME (DEFAULT) */
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --surface-3: #3a3a3c;
      --key-bg: #2c2c2e;
      --key-active: #48484a;

      --text: #ffffff;
      --muted: #8e8e93;

      --blue: #0a84ff;
      --blue-soft: #64d2ff;
      --green: #30d158;
      --orange: #ff9f0a;
      --red: #ff453a;
      --yellow: #ffd60a;
      --purple: #bf5af2;

      --border: #29292b;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

      --page-pad: clamp(10px, 3vw, 16px);
      --key-gap: clamp(7px, 2.2vw, 10px);
      --key-min-height: 58px;
    }

    /* LIGHT THEME OVERRIDES */
    body.light-theme {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --surface-2: #e5e5ea;
      --surface-3: #d1d1d6;
      --key-bg: #e5e5ea;
      --key-active: #d1d1d6;

      --text: #000000;
      --muted: #6c6c70;

      --blue: #007aff;
      --blue-soft: #0056b3;
      --green: #28a745;
      --orange: #ff9500;
      --red: #ff3b30;
      --yellow: #d3a000;
      --purple: #8e24aa;

      --border: #e5e5ea;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
    }

    .view-container {
      width: 100%;
      height: 100dvh;
      height: 100svh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-right: var(--safe-right);
      padding-left: var(--safe-left);
      background: var(--bg);
    }

    /* VENDOR SWITCHER BAR - DROPDOWN */
    .vendor-switcher-bar {
      padding: 8px var(--page-pad);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .vendor-select-btn {
      width: 100%;
      min-height: 42px;
      padding: 6px 14px;
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      border: 1px solid var(--purple);
      appearance: none;
      -webkit-appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%23bf5af2" height="14" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 12px center;
      cursor: pointer;
      outline: none;
    }

    .vendor-select-btn option {
      background: var(--surface);
      color: var(--text);
    }

    /* TOP BAR */
    .top-cart-bar {
      min-height: 52px;
      padding: 6px var(--page-pad);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .vendor-mini {
      min-width: 0;
    }

    .vendor-quote-label {
      margin-bottom: 2px;
      color: var(--muted);
      font-size: clamp(0.72rem, 2.8vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 0.75px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .vendor-quote-price {
      color: var(--blue-soft);
      font-size: clamp(2rem, 5vw, 2.3rem);
      font-weight: 750;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .view-cart-btn {
      min-height: 44px;
      max-width: 62%;
      padding: 6px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      border-radius: 18px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      overflow: hidden;
    }

    .view-cart-btn:active {
      transform: scale(0.97);
      opacity: 0.88;
    }

    .cart-btn-title {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(0.9rem, 3.4vw, 1.05rem);
      font-weight: 700;
      line-height: 1.15;
    }

    .cart-btn-sub {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(0.75rem, 2.6vw, 0.85rem);
      font-weight: 600;
      line-height: 1.15;
      opacity: 0.9;
    }

    /* HOME INFORMATION PANEL */
    .top-window-60 {
      min-height: 0;
      padding: clamp(8px, 2.5vw, 14px) var(--page-pad) 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }

    .top-window-60::-webkit-scrollbar,
    .cart-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .display-section {
      flex: 1 1 auto;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .section-label {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: clamp(0.7rem, 2.6vw, 0.8rem);
      font-weight: 700;
      letter-spacing: 0.8px;
      line-height: 1.15;
      text-transform: uppercase;
    }

    .main-display {
      min-width: 0;
      text-align: right;
    }

    .price-display {
      width: 100%;
      overflow: hidden;
      color: var(--text);
      font-size: clamp(2.6rem, 11vw, 4.2rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 0.98;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .price-display.has-input {
      color: var(--blue-soft);
    }

    .display-meta {
      margin-top: 6px;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .formula-display {
      color: var(--yellow);
      font-size: clamp(0.8rem, 3.2vw, 1rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.2px;
    }

    .selection-area {
      flex: 0 0 auto;
    }

    .selector-group + .selector-group {
      margin-top: 10px;
    }

    .base-weight-row-updated,
    .target-weight-row-custom {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .weight-btn,
    .base-dropdown-select,
    .chip-dropdown-select {
      min-width: 0;
      min-height: 44px;
      padding: 6px 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      font-size: clamp(0.82rem, 3.2vw, 0.98rem);
      font-weight: 700;
      line-height: 1;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .base-dropdown-select,
    .chip-dropdown-select {
      width: 100%;
      text-align-last: center;
      appearance: none;
      -webkit-appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%238e8e93" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 8px center;
      padding-right: 18px;
    }

    .base-dropdown-select option,
    .chip-dropdown-select option {
      background: var(--surface);
      color: var(--text);
    }

    .weight-btn:active {
      transform: scale(0.96);
    }

    .weight-btn.base-selected,
    .base-dropdown-select.base-selected {
      border-color: var(--blue);
      background-color: rgba(10, 132, 255, 0.28);
      color: var(--text);
    }

    .target-btn:active {
      background: rgba(48, 209, 88, 0.34);
      border-color: var(--green);
      color: var(--text);
    }

    .custom-inline-btn {
      border-color: rgba(255, 159, 10, 0.7);
      background: rgba(255, 159, 10, 0.2);
      color: var(--orange);
    }

    /* KEYPAD */
    .bottom-numpad-40 {
      width: 100%;
      height: clamp(280px, 41dvh, 370px);
      min-height: 280px;
      flex-shrink: 0;
      padding: 8px var(--page-pad) max(10px, var(--safe-bottom));
      display: flex;
      overflow: hidden;
      background: var(--bg);
    }

    .keypad-container {
      width: min(100%, 410px);
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(var(--key-min-height), 1fr));
      gap: var(--key-gap);
    }

    .key {
      min-width: 0;
      min-height: var(--key-min-height);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: clamp(18px, 6vw, 30px);
      background: var(--key-bg);
      color: var(--text);
      font-size: clamp(1.55rem, 7vw, 2.15rem);
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }

    .key:active {
      background: var(--key-active);
      transform: scale(0.965);
    }

    .key.action-clear-all {
      background: #a5a5a5;
      color: #000;
      font-weight: 600;
    }

    .key.action-clear-all:active {
      background: #c5c5c5;
    }

    .key.action-backspace {
      background: var(--orange);
      color: #000;
      font-size: clamp(1.35rem, 6vw, 1.9rem);
      font-weight: 600;
    }

    .key.action-backspace:active {
      background: #ffb340;
    }

    /* CUSTOM WEIGHT SCREEN */
    #customWeightView {
      display: none;
      grid-template-rows: minmax(0, 1fr) auto;
      background: var(--bg);
    }

    .custom-top-60 {
      min-height: 0;
      padding: 18px var(--page-pad) 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .custom-display-group {
      flex: 1 1 auto;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .custom-title {
      margin-bottom: 8px;
      color: var(--purple);
      font-size: clamp(0.8rem, 3.2vw, 0.95rem);
      font-weight: 750;
      letter-spacing: 1px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .custom-display {
      overflow: hidden;
      color: var(--yellow);
      font-size: clamp(2.8rem, 13vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .custom-subdisplay {
      margin-top: 8px;
      color: var(--purple);
      font-size: clamp(1rem, 3.8vw, 1.2rem);
      font-weight: 600;
    }

    .custom-action-row {
      width: min(100%, 360px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 9px;
      flex-shrink: 0;
    }

    .btn-cancel,
    .btn-add-cart {
      min-height: 48px;
      border-radius: 14px;
      cursor: pointer;
      font-size: clamp(0.9rem, 3.6vw, 1.05rem);
    }

    .btn-cancel {
      background: var(--surface-3);
      color: var(--text);
      font-weight: 600;
    }

    .btn-add-cart {
      background: var(--green);
      color: #000;
      font-weight: 750;
      text-transform: uppercase;
    }

    .btn-cancel:active,
    .btn-add-cart:active {
      transform: scale(0.97);
    }

    /* VIEW 3: ISOLATED CALCULATOR SCREEN */
    #calculatorView {
      display: none;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--bg);
    }

    .calc-top-bar {
      min-height: 52px;
      padding: 8px var(--page-pad);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .calc-back-btn {
      min-height: 38px;
      padding: 0 16px;
      border-radius: 10px;
      background: var(--surface-3);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .calc-back-btn:active {
      transform: scale(0.96);
    }

    .calc-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .calc-display-container {
      min-height: 0;
      padding: 18px var(--page-pad) 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      text-align: right;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .calc-history-display {
      min-height: 24px;
      color: var(--yellow);
      font-size: clamp(1rem, 4vw, 1.35rem);
      font-weight: 500;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      direction: ltr;
      text-align: right;
      font-variant-numeric: tabular-nums;
      scrollbar-width: none;
    }

    .calc-history-display::-webkit-scrollbar {
      display: none;
    }

    .calc-main-display {
      margin-top: 4px;
      color: var(--text);
      font-size: clamp(2.8rem, 12vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.05em;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .calc-keypad-container {
      width: min(100%, 410px);
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: clamp(5px, 1.8vw, 8px);
    }

    .key.op-key {
      background: var(--orange);
      color: #000;
      font-weight: 600;
    }

    .key.op-key:active {
      background: #ffb340;
    }

    .key.calc-action-clear {
      background: #a5a5a5;
      color: #000;
      font-weight: 600;
    }

    .key.calc-action-clear:active {
      background: #c5c5c5;
    }

    .key.calc-equals {
      background: var(--green);
      color: #000;
      font-weight: 700;
    }

    .key.calc-equals:active {
      background: #50e377;
    }

    /* MODAL BASE */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      padding:
        max(14px, var(--safe-top))
        max(14px, var(--safe-right))
        max(14px, var(--safe-bottom))
        max(14px, var(--safe-left));
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal-content {
      width: min(100%, 460px);
      max-height: min(90dvh, 720px);
      min-height: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow-y: auto;
    }

    /* NAME PROMPT MODAL STYLES */
    .name-input-field {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 1.05rem;
      outline: none;
    }

    .name-input-field:focus {
      border-color: var(--blue);
    }

    .quick-chips-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .chip-btn {
      min-height: 40px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chip-btn:active {
      background: var(--blue);
      color: #fff;
    }

    .chip-dropdown-select {
      min-height: 40px;
      border-radius: 12px;
      font-size: 0.9rem;
    }

    .modal-action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    /* CART MODAL & DASHBOARD */
    .cart-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .cart-title {
      margin: 0;
      font-size: clamp(1.15rem, 4.2vw, 1.3rem);
      font-weight: 700;
    }

    .cart-count {
      color: var(--muted);
      font-size: clamp(0.82rem, 3vw, 0.92rem);
      font-weight: 600;
    }

    .cart-scroll-container {
      min-height: 0;
      margin-top: 10px;
      overflow: auto;
      border-radius: 10px;
    }

    /* DASHBOARD TABLE */
    .dashboard-container {
      margin-bottom: 16px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-2);
    }

    .dashboard-title {
      margin-bottom: 8px;
      color: var(--yellow);
      font-size: 0.85rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dashboard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .dashboard-table th {
      color: var(--muted);
      text-align: left;
      padding: 4px;
      border-bottom: 1px solid var(--border);
    }

    .dashboard-table td {
      padding: 6px 4px;
      border-bottom: 1px solid var(--border);
    }

    .dashboard-table tr.total-row {
      font-weight: 700;
      color: var(--green);
    }

    /* CART ITEMS TABLE */
    .vendor-section-header {
      padding: 8px 6px;
      background: var(--surface-2);
      color: var(--purple);
      font-weight: 700;
      font-size: 0.88rem;
      border-radius: 6px;
      margin-top: 10px;
    }

    .cart-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .cart-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--surface);
      color: var(--muted);
      font-size: clamp(0.75rem, 2.8vw, 0.85rem);
      font-weight: 700;
      text-transform: uppercase;
    }

    .cart-table th,
    .cart-table td {
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      font-size: clamp(0.82rem, 3.2vw, 0.95rem);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .cart-table th:nth-child(1),
    .cart-table td:nth-child(1) {
      width: 25%;
      text-align: left;
      padding-left: 6px;
    }

    .cart-table th:nth-child(2),
    .cart-table td:nth-child(2) {
      width: 18%;
    }

    .cart-table th:nth-child(3),
    .cart-table td:nth-child(3) {
      width: 23%;
    }

    .cart-table th:nth-child(4),
    .cart-table td:nth-child(4) {
      width: 22%;
    }

    .cart-table th:nth-child(5),
    .cart-table td:nth-child(5) {
      width: 12%;
    }

    /* INLINE EDITABLE ITEM NAME STYLES */
    .editable-item-name {
      display: inline-block;
      width: 100%;
      padding: 4px 6px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px dashed var(--border);
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .editable-item-name:hover {
      border-color: var(--blue);
    }
    .item-name-input {
      width: 100%;
      padding: 4px 6px;
      font-size: inherit;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--blue);
      border-radius: 6px;
      outline: none;
    }

    .remove-item-btn {
      min-width: 32px;
      min-height: 32px;
      border-radius: 16px;
      background: transparent;
      color: var(--red);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .remove-item-btn:active {
      background: rgba(255, 69, 58, 0.16);
    }

    .cart-empty {
      padding: 24px 8px;
      color: var(--muted);
      text-align: center;
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
    }

    .cart-modal-actions {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px;
      flex-shrink: 0;
    }

    .btn-clear-cart,
    .btn-share-cart,
    .close-modal-btn {
      min-height: 48px;
      border-radius: 13px;
      cursor: pointer;
      font-size: clamp(0.88rem, 3.4vw, 1rem);
      font-weight: 650;
    }

    .btn-clear-cart {
      background: var(--red);
      color: #fff;
    }

    .btn-share-cart {
      background: var(--blue);
      color: #fff;
    }

    .close-modal-btn {
      background: var(--surface-2);
      color: var(--text);
    }

    .btn-clear-cart:active,
    .btn-share-cart:active,
    .close-modal-btn:active {
      transform: scale(0.97);
    }

    @media (max-height: 650px) {
      :root {
        --key-min-height: 50px;
      }

      .bottom-numpad-40 {
        height: 260px;
        min-height: 260px;
      }

      .top-window-60 {
        padding-top: 6px;
        padding-bottom: 6px;
        gap: 6px;
      }

      .display-section {
        min-height: 75px;
      }

      .price-display {
        font-size: clamp(2.4rem, 10vw, 3.6rem);
      }

      .weight-btn,
      .base-dropdown-select,
      .chip-dropdown-select {
        min-height: 38px;
        padding-top: 4px;
        padding-bottom: 4px;
      }

      .selector-group + .selector-group {
        margin-top: 4px;
      }
    }

    @media (min-width: 500px) {
      .top-window-60,
      .bottom-numpad-40,
      .calc-display-container {
        padding-left: max(20px, var(--page-pad));
        padding-right: max(20px, var(--page-pad));
      }
    }
  </style>
</head>

<body>

  <!-- VIEW 1: HOME MAIN POS SCREEN -->

  <div class="modal" id="cartModal" role="dialog" aria-modal="true" aria-labelledby="cartTitle">

              <!-- Dynamically populated -->

        <button class="close-modal-btn" id="closeCartBtn" type="button">Back</button>
      </div>

    </div>

  <script>
    /* STORAGE KEYS */
    const STORAGE_KEY = "grocery_calc_pos_data_v1";

    /* CORE STATE */
    let activeVendor = 1;
    let priceInput = "";
    let customWeightInput = "";
    let baseWeight = 0.25;
    let pendingTargetWeight = null;
    let itemCounter = 1;
    let isLightTheme = false;
    let cart = []; // Each item: { id, vendorId, name, weight, quote, price }

    /* DOM REFERENCES */
    const homeView = document.getElementById("homeView");
    const customWeightView = document.getElementById("customWeightView");
    const calculatorView = document.getElementById("calculatorView");

    const displayCurrentItemPrice = document.getElementById("displayCurrentItemPrice");
    const displayMathFormula = document.getElementById("displayMathFormula");
    const headerVendorQuote = document.getElementById("headerVendorQuote");
    const vendorQuoteLabel = document.getElementById("vendorQuoteLabel");
    const vendorSelectDropdown = document.getElementById("vendorSelectDropdown");

    const homeKeypad = document.getElementById("homeKeypad");
    const keyFive = document.getElementById("keyFive");
    const homeBackspaceBtn = document.getElementById("homeBackspaceBtn");
    const homeClearEntryBtn = document.getElementById("homeClearEntryBtn");

    const openCustomWtBtn = document.getElementById("openCustomWtBtn");
    const baseWeightRow = document.getElementById("baseWeightRow");
    const baseWeightDropdown = document.getElementById("baseWeightDropdown");
    const targetWeightRow = document.getElementById("targetWeightRow");

    const customDisplay = document.getElementById("customDisplay");
    const customSubDisplay = document.getElementById("customSubDisplay");
    const customKeypad = document.getElementById("customKeypad");
    const customBackspaceBtn = document.getElementById("customBackspaceBtn");
    const cancelCustomBtn = document.getElementById("cancelCustomBtn");
    const addCustomToCartBtn = document.getElementById("addCustomToCartBtn");

    const closeCalcBtn = document.getElementById("closeCalcBtn");
    const calcHistoryDisplay = document.getElementById("calcHistoryDisplay");
    const calcMainDisplay = document.getElementById("calcMainDisplay");
    const calcKeypad = document.getElementById("calcKeypad");
    const calcClearBtn = document.getElementById("calcClearBtn");
    const calcBackspaceBtn = document.getElementById("calcBackspaceBtn");
    const calcEqualsBtn = document.getElementById("calcEqualsBtn");

    const cartBtnTitle = document.getElementById("cartBtnTitle");
    const cartBtnSub = document.getElementById("cartBtnSub");
    const cartCountLabel = document.getElementById("cartCountLabel");
    const openCartBtn = document.getElementById("openCartBtn");
    const cartModal = document.getElementById("cartModal");
    const closeCartBtn = document.getElementById("closeCartBtn");
    const clearAllCartBtn = document.getElementById("clearAllCartBtn");
    const shareDashboardBtn = document.getElementById("shareDashboardBtn");
    const cartEmptyMessage = document.getElementById("cartEmptyMessage");
    const dashboardTableBody = document.getElementById("dashboardTableBody");
    const vendorCartList = document.getElementById("vendorCartList");

    const itemNameModal = document.getElementById("itemNameModal");
    const itemNameInput = document.getElementById("itemNameInput");
    const quickChipsContainer = document.getElementById("quickChipsContainer");
    const moreItemsDropdown = document.getElementById("moreItemsDropdown");
    const skipItemNameBtn = document.getElementById("skipItemNameBtn");
    const confirmItemNameBtn = document.getElementById("confirmItemNameBtn");

    /* PERSISTENCE HELPERS */
    function saveStateToStorage() {
      try {
        const payload = {
          cart,
          itemCounter,
          activeVendor,
          baseWeight,
          priceInput,
          isLightTheme
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {
        console.error("Failed to save state to localStorage:", e);
      }
    }

    function loadStateFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          applyTheme();
          return;
        }

        const data = JSON.parse(raw);
        if (Array.isArray(data.cart)) cart = data.cart;
        if (typeof data.itemCounter === "number") itemCounter = data.itemCounter;
        if (typeof data.activeVendor === "number") activeVendor = data.activeVendor;
        if (typeof data.baseWeight === "number") baseWeight = data.baseWeight;
        if (typeof data.priceInput === "string") priceInput = data.priceInput;
        if (typeof data.isLightTheme === "boolean") isLightTheme = data.isLightTheme;

        applyTheme();

        if (vendorSelectDropdown) {
          vendorSelectDropdown.value = activeVendor.toString();
        }

        syncBaseWeightUI();

      } catch (e) {
        console.error("Failed to restore state from localStorage:", e);
        applyTheme();
      }
    }

    /* THEME SWITCHER LOGIC (LONG PRESS ON '5') */
    function applyTheme() {
      const metaTheme = document.getElementById("metaThemeColor");
      if (isLightTheme) {
        document.body.classList.add("light-theme");
        if (metaTheme) metaTheme.setAttribute("content", "#f2f2f7");
        keyFive.textContent = "5☀︎";
      } else {
        document.body.classList.remove("light-theme");
        if (metaTheme) metaTheme.setAttribute("content", "#000000");
        keyFive.textContent = "5☼";
      }
    }

    function toggleTheme() {
      isLightTheme = !isLightTheme;
      applyTheme();
      saveStateToStorage();
      showTemporaryMessage(`Switched to ${isLightTheme ? 'Light' : 'Dark'} Mode`);
    }

    let pressTimer = null;
    let isLongPress = false;

    function startPress() {
      isLongPress = false;
      pressTimer = setTimeout(() => {
        isLongPress = true;
        toggleTheme();
      }, 600);
    }

    function cancelPress() {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
    }

    keyFive.addEventListener("pointerdown", startPress);
    keyFive.addEventListener("pointerup", cancelPress);
    keyFive.addEventListener("pointerleave", cancelPress);
    keyFive.addEventListener("pointercancel", cancelPress);

    /* LONG PRESS LOGIC ON "CUSTOM" BUTTON TO LAUNCH CALCULATOR */
    let customPressTimer = null;
    let isCustomLongPress = false;

    function startCustomPress() {
      isCustomLongPress = false;
      customPressTimer = setTimeout(() => {
        isCustomLongPress = true;
        openCalculatorWindow();
      }, 600);
    }

    function cancelCustomPress() {
      if (customPressTimer) {
        clearTimeout(customPressTimer);
        customPressTimer = null;
      }
    }

    openCustomWtBtn.addEventListener("pointerdown", startCustomPress);
    openCustomWtBtn.addEventListener("pointerup", cancelCustomPress);
    openCustomWtBtn.addEventListener("pointerleave", cancelCustomPress);
    openCustomWtBtn.addEventListener("pointercancel", cancelCustomPress);

    function syncBaseWeightUI() {
      document.querySelectorAll(".base-btn").forEach((b) => {
        b.classList.remove("base-selected");
        if (parseFloat(b.dataset.weight) === baseWeight) {
          b.classList.add("base-selected");
        }
      });

      let foundInDropdown = false;
      Array.from(baseWeightDropdown.options).forEach((opt) => {
        if (parseFloat(opt.value) === baseWeight) {
          foundInDropdown = true;
        }
      });

      if (foundInDropdown) {
        baseWeightDropdown.value = baseWeight.toString();
        baseWeightDropdown.classList.add("base-selected");
      } else {
        baseWeightDropdown.selectedIndex = 0;
        baseWeightDropdown.classList.remove("base-selected");
      }
    }

    /* DISPLAY HELPERS */
    function formatWeight(weightKg) {
      if (weightKg < 1) {
        return `${Math.round(weightKg * 1000)}g`;
      }
      return `${weightKg.toFixed(2)}Kg`;
    }

    function formatBaseWeight(weightKg) {
      return weightKg >= 1
        ? `${weightKg}Kg`
        : `${Math.round(weightKg * 1000)}g`;
    }

    /* VENDOR SWITCHING VIA DROPDOWN */
    vendorSelectDropdown.addEventListener("change", (e) => {
      activeVendor = parseInt(e.target.value, 10);
      vendorQuoteLabel.textContent = `Vendor ${activeVendor} Price`;
      
      priceInput = "";
      displayCurrentItemPrice.textContent = "₹0";
      displayCurrentItemPrice.classList.remove("has-input");

      updateHomeDisplay();
      renderCart();
      saveStateToStorage();
      
      showTemporaryMessage(`Switched to Vendor ${activeVendor}`);
    });

    function updateHomeDisplay() {
      vendorQuoteLabel.textContent = `Vendor ${activeVendor} Price`;
      headerVendorQuote.textContent = priceInput ? `₹${priceInput}` : "₹0";

      if (priceInput && parseFloat(priceInput) > 0) {
        const val = parseFloat(priceInput);
        const bLabel = formatBaseWeight(baseWeight);
        displayCurrentItemPrice.textContent = `₹${val}`;
        displayCurrentItemPrice.classList.add("has-input");
        displayMathFormula.textContent = `(₹${val} ÷ ${bLabel}) × Target Wt`;
      } else if (!displayCurrentItemPrice.classList.contains("has-input")) {
        displayMathFormula.textContent = `Equation: (Price ÷ ${formatBaseWeight(baseWeight)}) × Wt`;
      }
    }

    /* MAIN KEYPAD */
    homeKeypad.addEventListener("click", (e) => {
      if (isLongPress) {
        isLongPress = false;
        return;
      }

      const key = e.target.closest(".num-key");
      if (!key || !homeKeypad.contains(key)) return;

      const rawVal = key.textContent.trim();
      const val = rawVal.charAt(0); // Extracts digits (e.g., '5' from '5☼' or '5☀︎')

      if (priceInput === "0" && val === "0") return;
      if (priceInput === "0" && val !== "0") {
        priceInput = val;
        updateHomeDisplay();
        saveStateToStorage();
        return;
      }
      if (priceInput.length >= 6) return;

      priceInput += val;
      updateHomeDisplay();
      saveStateToStorage();
    });

    homeBackspaceBtn.addEventListener("click", () => {
      priceInput = priceInput.slice(0, -1);
      if (!priceInput) {
        displayCurrentItemPrice.textContent = "₹0";
        displayCurrentItemPrice.classList.remove("has-input");
      }
      updateHomeDisplay();
      saveStateToStorage();
    });

    homeClearEntryBtn.addEventListener("click", () => {
      priceInput = "";
      displayCurrentItemPrice.textContent = "₹0";
      displayCurrentItemPrice.classList.remove("has-input");
      updateHomeDisplay();
      saveStateToStorage();
    });

    /* BASE WEIGHT SELECTOR */
    baseWeightRow.addEventListener("click", (e) => {
      const button = e.target.closest(".base-btn");
      if (!button || !baseWeightRow.contains(button)) return;

      document.querySelectorAll(".base-btn").forEach((b) => b.classList.remove("base-selected"));
      baseWeightDropdown.classList.remove("base-selected");
      baseWeightDropdown.selectedIndex = 0;

      button.classList.add("base-selected");
      baseWeight = parseFloat(button.dataset.weight);
      updateHomeDisplay();
      saveStateToStorage();
    });

    baseWeightDropdown.addEventListener("change", (e) => {
      const selectedVal = parseFloat(e.target.value);
      if (isNaN(selectedVal)) return;

      document.querySelectorAll(".base-btn").forEach((b) => b.classList.remove("base-selected"));
      baseWeightDropdown.classList.add("base-selected");
      baseWeight = selectedVal;
      updateHomeDisplay();
      saveStateToStorage();
    });

    /* TARGET WEIGHT & PROMPT INTERCEPT */
    targetWeightRow.addEventListener("click", (e) => {
      const button = e.target.closest(".target-btn");
      if (!button || !targetWeightRow.contains(button)) return;

      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        showTemporaryMessage("Enter a price first.");
        return;
      }

      pendingTargetWeight = parseFloat(button.dataset.weight);
      promptItemName();
    });

    /* NAME PROMPT MODAL LOGIC */
    function promptItemName() {
      itemNameInput.value = "";
      itemNameInput.readOnly = true;
      moreItemsDropdown.selectedIndex = 0;
      itemNameModal.style.display = "flex";
    }

    itemNameInput.addEventListener("focus", () => {
      itemNameInput.readOnly = false;
    });

    itemNameInput.addEventListener("touchstart", () => {
      itemNameInput.readOnly = false;
    }, { passive: true });

    quickChipsContainer.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip-btn");
      if (!chip) return;
      itemNameInput.readOnly = true;
      itemNameInput.value = chip.dataset.name;
    });

    moreItemsDropdown.addEventListener("change", (e) => {
      if (e.target.value) {
        itemNameInput.readOnly = true;
        itemNameInput.value = e.target.value;
      }
    });

    skipItemNameBtn.addEventListener("click", () => {
      finalizeAddToCart("");
    });

    confirmItemNameBtn.addEventListener("click", () => {
      finalizeAddToCart(itemNameInput.value.trim());
    });

    itemNameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        finalizeAddToCart(itemNameInput.value.trim());
      }
    });

    function finalizeAddToCart(nameVal) {
      itemNameModal.style.display = "none";
      if (pendingTargetWeight !== null) {
        processAddToCart(pendingTargetWeight, nameVal);
        pendingTargetWeight = null;
      }
    }

    /* CUSTOM WEIGHT SCREEN */
    openCustomWtBtn.addEventListener("click", (e) => {
      if (isCustomLongPress) {
        isCustomLongPress = false;
        return;
      }

      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        showTemporaryMessage("Enter a price first.");
        return;
      }

      customWeightInput = "";
      updateCustomDisplay();
      homeView.style.display = "none";
      customWeightView.style.display = "grid";
    });

    cancelCustomBtn.addEventListener("click", () => {
      customWeightView.style.display = "none";
      homeView.style.display = "grid";
    });

    customKeypad.addEventListener("click", (e) => {
      const key = e.target.closest(".c-num-key");
      if (!key || !customKeypad.contains(key)) return;

      const val = key.textContent.trim();
      if (val === ".") {
        if (customWeightInput.includes(".")) return;
        if (customWeightInput === "") customWeightInput = "0";
        customWeightInput += ".";
        updateCustomDisplay();
        return;
      }

      if (customWeightInput === "0" && val === "0") return;
      if (customWeightInput === "0" && val !== "0") {
        customWeightInput = val;
        updateCustomDisplay();
        return;
      }

      if (customWeightInput.length >= 6) return;

      customWeightInput += val;
      updateCustomDisplay();
    });

    customBackspaceBtn.addEventListener("click", () => {
      customWeightInput = customWeightInput.slice(0, -1);
      updateCustomDisplay();
    });

    function updateCustomDisplay() {
      if (!customWeightInput) {
        customDisplay.textContent = "0 Kg";
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      if (customWeightInput === ".") {
        customDisplay.textContent = "0. Kg";
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      customDisplay.textContent = `${customWeightInput} Kg`;
      const numericVal = parseFloat(customWeightInput);

      if (isNaN(numericVal)) {
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      const calculatedGrams = Math.round(numericVal * 1000);
      customSubDisplay.textContent = `Equivalent: ${calculatedGrams}g`;
    }

    addCustomToCartBtn.addEventListener("click", () => {
      const finalWeightInKg = parseFloat(customWeightInput);
      if (isNaN(finalWeightInKg) || finalWeightInKg <= 0) {
        showTemporaryMessage("Type a valid weight.");
        return;
      }

      pendingTargetWeight = finalWeightInKg;
      customWeightView.style.display = "none";
      homeView.style.display = "grid";
      promptItemName();
    });

    /* ISOLATED EXPRESSION-BASED CALCULATOR LOGIC */
    let calcExpression = "";
    let isCalculated = false;

    function openCalculatorWindow() {
      resetCalculator();
      homeView.style.display = "none";
      customWeightView.style.display = "none";
      calculatorView.style.display = "grid";
    }

    closeCalcBtn.addEventListener("click", () => {
      calculatorView.style.display = "none";
      homeView.style.display = "grid";
    });

    function resetCalculator() {
      calcExpression = "";
      isCalculated = false;
      updateCalcDisplay();
    }

    function updateCalcDisplay() {
      calcHistoryDisplay.textContent = calcExpression;
      
      if (!calcExpression) {
        calcMainDisplay.textContent = "0";
        return;
      }

      calcHistoryDisplay.scrollLeft = calcHistoryDisplay.scrollWidth;

      const tokens = calcExpression.split(/[\+\-\×\÷]/);
      const currentToken = tokens[tokens.length - 1];
      
      if (currentToken === "" && calcExpression.length > 0) {
        const lastChar = calcExpression.slice(-1);
        calcMainDisplay.textContent = isOperators(lastChar) ? lastChar : "0";
      } else {
        calcMainDisplay.textContent = currentToken;
      }
    }

    function isOperators(char) {
      return ["+", "-", "×", "÷"].includes(char);
    }

    calcKeypad.addEventListener("click", (e) => {
      const numKey = e.target.closest(".calc-num-key");
      const opKey = e.target.closest(".op-key");

      if (numKey) {
        const val = numKey.textContent.trim();

        if (isCalculated) {
          calcExpression = val === "." ? "0." : (val === "00" ? "0" : val);
          isCalculated = false;
          updateCalcDisplay();
          return;
        }

        const tokens = calcExpression.split(/[\+\-\×\÷]/);
        const lastToken = tokens[tokens.length - 1];

        if (val === ".") {
          if (lastToken.includes(".")) return;
          if (!lastToken || isOperators(calcExpression.slice(-1))) {
            calcExpression += "0.";
          } else {
            calcExpression += ".";
          }
        } else if (val === "00") {
          if (!lastToken || lastToken === "0" || isOperators(calcExpression.slice(-1))) return;
          calcExpression += "00";
        } else {
          if (lastToken === "0") {
            calcExpression = calcExpression.slice(0, -1) + val;
          } else {
            calcExpression += val;
          }
        }
        updateCalcDisplay();
        return;
      }

      if (opKey) {
        const op = opKey.dataset.op;

        if (op === "%") {
          if (!calcExpression) return;

          if (isCalculated) {
            let val = parseFloat(calcMainDisplay.textContent);
            if (!isNaN(val)) {
              let res = val / 100;
              calcMainDisplay.textContent = Math.round(res * 100000) / 100000;
              calcExpression = calcMainDisplay.textContent;
            }
            return;
          }

          const lastChar = calcExpression.slice(-1);
          if (!isOperators(lastChar) && lastChar !== "%") {
            calcExpression += "%";
            updateCalcDisplay();
          }
          return;
        }

        if (isCalculated) {
          calcExpression = calcMainDisplay.textContent + op;
          isCalculated = false;
          updateCalcDisplay();
          return;
        }

        if (!calcExpression) {
          if (op === "-") {
            calcExpression = "-";
            updateCalcDisplay();
          }
          return;
        }

        const lastChar = calcExpression.slice(-1);
        if (isOperators(lastChar)) {
          calcExpression = calcExpression.slice(0, -1) + op;
        } else {
          calcExpression += op;
        }
        updateCalcDisplay();
      }
    });

    calcBackspaceBtn.addEventListener("click", () => {
      if (isCalculated) {
        resetCalculator();
        return;
      }
      if (calcExpression.length > 0) {
        calcExpression = calcExpression.slice(0, -1);
      }
      updateCalcDisplay();
    });

    calcClearBtn.addEventListener("click", () => {
      resetCalculator();
    });

    calcEqualsBtn.addEventListener("click", () => {
      if (!calcExpression) return;

      let expr = calcExpression;
      while (expr.length > 0 && isOperators(expr.slice(-1))) {
        expr = expr.slice(0, -1);
      }

      if (!expr) return;

      calcExpression = expr;

      try {
        let sanitized = expr.replace(/×/g, "*").replace(/÷/g, "/");
        sanitized = sanitized.replace(/(\d+(?:\.\d+)?)%/g, "($1/100)");

        let result = Function(`'use strict'; return (${sanitized})`)();

        if (typeof result === "number" && !isNaN(result) && isFinite(result)) {
          result = Math.round(result * 100000) / 100000;
          calcMainDisplay.textContent = result.toString();
          calcHistoryDisplay.textContent = expr;
          isCalculated = true;
        } else {
          calcMainDisplay.textContent = "Error";
        }
      } catch (err) {
        calcMainDisplay.textContent = "Error";
      }
    });

    /* CART CALCULATION */
    function processAddToCart(targetWeight, customName = "") {
      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        showTemporaryMessage("Enter a price first.");
        return false;
      }

      const calculatedPrice = ((priceVal / baseWeight) * targetWeight).toFixed(2);
      const baseLabel = formatBaseWeight(baseWeight);
      const targetLabel = formatWeight(targetWeight);

      const newItem = {
        id: itemCounter++,
        vendorId: activeVendor,
        name: customName || `Item #${itemCounter - 1}`,
        weight: targetWeight,
        quote: `₹${priceVal}/${baseLabel}`,
        price: parseFloat(calculatedPrice)
      };

      cart.push(newItem);

      displayCurrentItemPrice.textContent = `₹${newItem.price.toFixed(2)}`;
      displayCurrentItemPrice.classList.add("has-input");

      displayMathFormula.textContent =
        `(₹${priceVal} ÷ ${baseLabel}) × ${targetLabel} = ₹${newItem.price.toFixed(2)}`;

      renderCart();

      priceInput = "";
      headerVendorQuote.textContent = "₹0";

      saveStateToStorage();
      return true;
    }

    /* CART & DASHBOARD RENDERING */
    function renderCart() {
      dashboardTableBody.innerHTML = "";
      vendorCartList.innerHTML = "";

      let overallPrice = 0;
      let overallWeight = 0;

      const vendorStats = {};
      for (let v = 1; v <= 6; v++) {
        vendorStats[v] = { items: [], totalWeight: 0, totalPrice: 0 };
      }

      cart.forEach((item) => {
        overallPrice += item.price;
        overallWeight += item.weight;
        vendorStats[item.vendorId].items.push(item);
        vendorStats[item.vendorId].totalWeight += item.weight;
        vendorStats[item.vendorId].totalPrice += item.price;
      });

      for (let v = 1; v <= 6; v++) {
        const stats = vendorStats[v];
        if (stats.items.length > 0) {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>Vendor ${v}</td>
            <td style="text-align: center;">${stats.items.length}</td>
            <td style="text-align: center;">${stats.totalWeight.toFixed(2)} Kg</td>
            <td style="text-align: right;">₹${stats.totalPrice.toFixed(2)}</td>
          `;
          dashboardTableBody.appendChild(row);
        }
      }

      if (cart.length > 0) {
        const totalRow = document.createElement("tr");
        totalRow.className = "total-row";
        totalRow.innerHTML = `
          <td>TOTAL</td>
          <td style="text-align: center;">${cart.length}</td>
          <td style="text-align: center;">${overallWeight.toFixed(2)} Kg</td>
          <td style="text-align: right;">₹${overallPrice.toFixed(2)}</td>
        `;
        dashboardTableBody.appendChild(totalRow);
      }

      for (let v = 1; v <= 6; v++) {
        const stats = vendorStats[v];
        if (stats.items.length > 0) {
          const sectionHeader = document.createElement("div");
          sectionHeader.className = "vendor-section-header";
          sectionHeader.textContent = `Vendor ${v} (${stats.items.length} items · ₹${stats.totalPrice.toFixed(2)})`;
          vendorCartList.appendChild(sectionHeader);

          const table = document.createElement("table");
          table.className = "cart-table";
          table.innerHTML = `
            <thead>
              <tr>
                <th>Item</th>
                <th>Weight</th>
                <th>Quote</th>
                <th>Price</th>
                <th class="no-pdf"></th>
              </tr>
            </thead>
            <tbody></tbody>
          `;

          const tbody = table.querySelector("tbody");

          stats.items.forEach((item) => {
            const row = tbody.insertRow();
            row.innerHTML = `
              <td>
                <div class="editable-item-name" data-id="${item.id}" title="Tap to edit item name">${item.name || '(No Name)'}</div>
              </td>
              <td>${formatWeight(item.weight)}</td>
              <td>${item.quote}</td>
              <td>₹${item.price.toFixed(2)}</td>
              <td class="no-pdf">
                <button class="remove-item-btn" type="button" data-id="${item.id}" aria-label="Remove item">×</button>
              </td>
            `;
          });

          vendorCartList.appendChild(table);
        }
      }

      const activeStats = vendorStats[activeVendor];
      cartBtnTitle.textContent = `Vendor ${activeVendor} (${activeStats.items.length}) · ₹${activeStats.totalPrice.toFixed(2)}`;
      cartBtnSub.textContent = `Total: ${activeStats.totalWeight.toFixed(2)} Kg`;

      cartCountLabel.textContent = `${cart.length} ${cart.length === 1 ? "item" : "items"}`;
      cartEmptyMessage.style.display = cart.length === 0 ? "block" : "none";

      if (cart.length === 0 && !priceInput) {
        displayCurrentItemPrice.textContent = "₹0";
        displayCurrentItemPrice.classList.remove("has-input");
        updateHomeDisplay();
      }
    }

    /* INLINE EDITING & ITEM REMOVAL HANDLING WITHIN PURCHASE DASHBOARD */
    vendorCartList.addEventListener("click", (e) => {
      // Check if item name container was tapped
      const editableDiv = e.target.closest(".editable-item-name");
      if (editableDiv) {
        const itemId = parseInt(editableDiv.dataset.id, 10);
        const item = cart.find(i => i.id === itemId);
        if (!item) return;

        // Turn div into an input field directly inside the cell
        const currentName = item.name;
        const input = document.createElement("input");
        input.type = "text";
        input.className = "item-name-input";
        input.value = currentName;

        editableDiv.replaceWith(input);
        input.focus();
        input.select();

        const saveInlineEdit = () => {
          const newName = input.value.trim();
          item.name = newName || `Item #${item.id}`;
          saveStateToStorage();
          renderCart();
        };

        input.addEventListener("blur", saveInlineEdit);
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            input.blur();
          }
        });
        return;
      }

      // Check if delete button was tapped
      const button = e.target.closest(".remove-item-btn");
      if (!button) return;

      const itemId = parseInt(button.dataset.id, 10);
      if (Number.isNaN(itemId)) return;

      removeItemById(itemId);
    });

    function removeItemById(id) {
      cart = cart.filter(item => item.id !== id);
      renderCart();
      saveStateToStorage();
    }

    /* CLEAR CART */
    clearAllCartBtn.addEventListener("click", () => {
      if (cart.length === 0) return;

      if (window.confirm("Clear all items across all vendors?")) {
        cart = [];
        itemCounter = 1;
        priceInput = "";

        displayCurrentItemPrice.textContent = "₹0";
        displayCurrentItemPrice.classList.remove("has-input");

        updateHomeDisplay();
        renderCart();

        localStorage.removeItem(STORAGE_KEY);
        cartModal.style.display = "none";
      }
    });

    /* SHARE DASHBOARD FUNCTIONALITY */
    shareDashboardBtn.addEventListener("click", async () => {
      if (cart.length === 0) {
        showTemporaryMessage("Cart is empty.");
        return;
      }

      showTemporaryMessage("Generating image...");

      const scrollContainer = document.querySelector(".cart-scroll-container");
      if (!scrollContainer) return;

      const captureWrapper = document.createElement("div");
      const bgColor = isLightTheme ? "#ffffff" : "#1c1c1e";
      const textColor = isLightTheme ? "#000000" : "#ffffff";
      const borderColor = isLightTheme ? "#e5e5ea" : "#38383a";

      Object.assign(captureWrapper.style, {
        padding: "20px",
        background: bgColor,
        color: textColor,
        width: "480px",
        position: "fixed",
        left: "0",
        top: "0",
        zIndex: "-9999",
        boxSizing: "border-box",
        fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      });

      const now = new Date();
      const dateStamp = now.toLocaleString("en-IN", {
        dateStyle: "medium",
        timeStyle: "short"
      });

      const headerEl = document.createElement("div");
      headerEl.style.marginBottom = "16px";
      headerEl.style.fontSize = "18px";
      headerEl.style.fontWeight = "bold";
      headerEl.style.color = isLightTheme ? "#8e24aa" : "#bf5af2";
      headerEl.style.borderBottom = `1px solid ${borderColor}`;
      headerEl.style.paddingBottom = "8px";
      headerEl.textContent = "Purchase Summary Report";
      captureWrapper.appendChild(headerEl);

      const clone = scrollContainer.cloneNode(true);
      clone.style.overflow = "visible";
      clone.style.maxHeight = "none";
      clone.style.height = "auto";

      clone.querySelectorAll(".no-pdf").forEach(el => el.remove());

      clone.querySelectorAll("th, td, div, span, h3").forEach(el => {
        el.style.color = textColor;
      });

      captureWrapper.appendChild(clone);

      const timestampEl = document.createElement("div");
      timestampEl.style.marginTop = "20px";
      timestampEl.style.fontSize = "12px";
      timestampEl.style.color = "#8e8e93";
      timestampEl.style.textAlign = "right";
      timestampEl.textContent = `Generated: ${dateStamp}`;
      captureWrapper.appendChild(timestampEl);

      document.body.appendChild(captureWrapper);

      try {
        const canvas = await html2canvas(captureWrapper, {
          backgroundColor: bgColor,
          scale: 2,
          useCORS: true,
          logging: false
        });

        const filename = `purchase-summary-${Date.now()}.png`;

        canvas.toBlob(async (blob) => {
          if (!blob) {
            showTemporaryMessage("Failed to generate image.");
            return;
          }

          const file = new File([blob], filename, { type: "image/png" });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                title: "Purchase Dashboard",
                text: `Purchase Summary Report - ${dateStamp}`,
                files: [file]
              });
              return;
            } catch (shareErr) {
              if (shareErr.name === "AbortError") return;
            }
          }

          const link = document.createElement("a");
          link.download = filename;
          link.href = canvas.toDataURL("image/png");
          link.click();
          showTemporaryMessage("Image downloaded.");

        }, "image/png");

      } catch (error) {
        console.error("PNG generation failed:", error);
        showTemporaryMessage("Failed to generate image.");
      } finally {
        if (document.body.contains(captureWrapper)) {
          document.body.removeChild(captureWrapper);
        }
      }
    });

    /* CART MODAL SHOW/HIDE */
    openCartBtn.addEventListener("click", () => {
      renderCart();
      cartModal.style.display = "flex";
    });

    closeCartBtn.addEventListener("click", () => {
      cartModal.style.display = "none";
    });

    cartModal.addEventListener("click", (e) => {
      if (e.target === cartModal) cartModal.style.display = "none";
    });

    /* NON-BLOCKING FEEDBACK TOAST */
    let messageTimer = null;
    function showTemporaryMessage(message) {
      let toast = document.getElementById("appToast");

      if (!toast) {
        toast = document.createElement("div");
        toast.id = "appToast";

        Object.assign(toast.style, {
          position: "fixed",
          left: "50%",
          bottom: "calc(41dvh + 14px)",
          transform: "translateX(-50%)",
          zIndex: "3000",
          maxWidth: "calc(100vw - 32px)",
          padding: "10px 15px",
          borderRadius: "16px",
          background: "var(--surface-3)",
          color: "var(--text)",
          fontSize: "0.88rem",
          fontWeight: "650",
          textAlign: "center",
          boxShadow: "0 8px 30px rgba(0,0,0,.35)",
          pointerEvents: "none",
          transition: "opacity .18s ease, transform .18s ease"
        });

        document.body.appendChild(toast);
      }

      toast.textContent = message;
      toast.style.opacity = "1";
      toast.style.transform = "translateX(-50%) translateY(0)";

      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(-50%) translateY(6px)";
      }, 1600);
    }

    /* INITIALIZATION */
    loadStateFromStorage();
    updateHomeDisplay();
    renderCart();
  </script>

</body>
</html>
