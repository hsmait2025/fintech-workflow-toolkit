<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grocery Calc POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <style>
    :root {
      --bg: #000000;
      --card: #121212;
      --primary: #0a84ff;
      --accent: #30d158;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --key-bg: #2c2c2e;
      --key-active: #48484a;
      --border: #1c1c1e;
      
      --btn-idle-bg: #1c1c1e;
      --btn-idle-border: #2c2c2e;
      --btn-idle-text: #8e8e93;
    }

    * { box-sizing: border-box; touch-action: manipulation; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* TOP HEADER */
    .top-cart-bar {
      background-color: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 8vh;
      flex: 0 0 8vh;
    }

    .vendor-quote-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .vendor-quote-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: #64d2ff;
    }

    .view-cart-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      cursor: pointer;
    }

    .cart-btn-title {
      font-weight: 700;
      font-size: 0.8rem;
    }

    .cart-btn-sub {
      font-size: 0.65rem;
      opacity: 0.85;
      font-weight: 500;
    }

    /* MAIN VIEW STRUCTURE (100vh TOTAL) */
    .view-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    /* 60% TOP WINDOW SECTION (8vh header + 52vh content) */
    .top-window-60 {
      height: 52vh;
      flex: 0 0 52vh;
      background-color: var(--card);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .display-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .price-display {
      font-size: 2.2rem;
      font-weight: 700;
      color: #64d2ff;
      letter-spacing: -0.5px;
    }

    .weight-subdisplay {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .weight-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .target-weight-row-custom {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
    }

    .weight-btn {
      background-color: var(--btn-idle-bg);
      border: 1px solid var(--btn-idle-border);
      color: var(--btn-idle-text);
      padding: 10px 0;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .weight-btn.base-selected {
      border-color: #0a84ff;
      background-color: #0040dd;
      color: #ffffff;
    }

    .weight-btn.target-btn:active,
    .weight-btn.target-btn.target-selected {
      background-color: #30d158;
      border-color: #30d158;
      color: #000000;
      font-weight: 700;
    }

    .weight-btn.custom-inline-btn {
      background-color: #ff9f0a;
      border-color: #ff9f0a;
      color: #ffffff;
      font-weight: 700;
    }

    /* 40% BOTTOM NUMPAD SECTION */
    .bottom-numpad-40 {
      height: 40vh;
      flex: 0 0 40vh;
      background-color: var(--bg);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .keypad-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 340px;
      height: 100%;
      max-height: 100%;
    }

    .key {
      background-color: var(--key-bg);
      color: var(--text);
      font-size: 1.54rem;
      font-weight: 600;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      border: none;
    }

    .key:active {
      background-color: var(--key-active);
    }

    .key.action-backspace {
      background-color: #ff453a;
      color: #ffffff;
    }

    .key.action-clear-all {
      background-color: #a5a5a5;
      color: #000000;
      font-weight: 700;
    }

    /* DEDICATED CUSTOM WEIGHT SCREEN (60/40 RATIO) */
    #customWeightView {
      display: none;
      background-color: var(--bg);
    }

    .custom-top-60 {
      height: 60vh;
      flex: 0 0 60vh;
      background-color: #1c1c1e;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .custom-display-group {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
    }

    .custom-title {
      color: #bf5af2;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .custom-display {
      font-size: 2.8rem;
      font-weight: 700;
      color: #ffd60a;
    }

    .custom-subdisplay {
      font-size: 1rem;
      color: #bf5af2;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Action Buttons in 60% Top Section */
    .custom-action-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
    }

    .btn-cancel {
      background-color: #3a3a3c;
      color: white;
      border: none;
      height: 48px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-add-cart {
      background-color: #30d158;
      color: #000000;
      border: none;
      height: 48px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* Modal Cart Sheet */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal-content {
      background: #1c1c1e;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
    }

    /* SCROLLABLE CART TABLE CONTAINER */
    .cart-scroll-container {
      overflow-y: auto;
      max-height: 50vh;
      margin-top: 10px;
      border-radius: 8px;
    }

    .cart-table {
      width: 100%;
      border-collapse: collapse;
    }

    .cart-table th {
      position: sticky;
      top: 0;
      background-color: #1c1c1e;
      z-index: 10;
    }

    .cart-table th, .cart-table td {
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      font-size: 0.9rem;
    }

    .cart-modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
      flex-shrink: 0;
    }

    .btn-clear-cart {
      background-color: #ff453a;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .close-modal-btn {
      background: #2c2c2e;
      color: var(--text);
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- VIEW 1: HOME MAIN POS SCREEN -->
  <div class="view-container" id="homeView">
    
    <!-- TOP 60% WINDOW AREA -->
    <div class="top-cart-bar" id="topHeader">
      <div>
        <div class="vendor-quote-label">Vendor Price Quote</div>
        <div class="vendor-quote-price" id="headerVendorQuote">₹0</div>
      </div>
      <button class="view-cart-btn" id="openCartBtn">
        <span class="cart-btn-title" id="cartBtnTitle">Cart (0) • ₹0.00</span>
        <span class="cart-btn-sub" id="cartBtnSub">Total: 0.00 Kg</span>
      </button>
    </div>

    <div class="top-window-60" id="homeDisplayContainer">
      <div>
        <div class="section-label">Current Item Calculated</div>
        <div class="display-row">
          <div class="price-display" id="displayCurrentItemPrice">₹0.00</div>
          <div class="weight-subdisplay" id="displayCurrentItemWeight">Weight: --</div>
        </div>
      </div>

      <div>
        <!-- Base Quote Selector -->
        <div class="section-label">Quote Base Weight</div>
        <div class="weight-row" id="baseWeightRow">
          <div class="weight-btn base-btn" data-weight="0.1">100g</div>
          <div class="weight-btn base-btn base-selected" data-weight="0.25">250g</div>
          <div class="weight-btn base-btn" data-weight="0.5">500g</div>
          <div class="weight-btn base-btn" data-weight="0.75">750g</div>
          <div class="weight-btn base-btn" data-weight="1">1Kg</div>
        </div>

        <!-- Target Purchase Selector + CW Button -->
        <div class="section-label" style="margin-top: 10px;">Tap Target Weight to Add</div>
        <div class="target-weight-row-custom" id="targetWeightRow">
          <div class="weight-btn target-btn" data-weight="0.1">100g</div>
          <div class="weight-btn target-btn" data-weight="0.25">250g</div>
          <div class="weight-btn target-btn" data-weight="0.5">500g</div>
          <div class="weight-btn target-btn" data-weight="0.75">750g</div>
          <div class="weight-btn target-btn" data-weight="1">1Kg</div>
          <div class="weight-btn custom-inline-btn" id="openCustomWtBtn">CW</div>
        </div>
      </div>
    </div>

    <!-- BOTTOM 40% NUMPAD AREA -->
    <div class="bottom-numpad-40">
      <div class="keypad-container" id="homeKeypad">
        <div class="key num-key">7</div>
        <div class="key num-key">8</div>
        <div class="key num-key">9</div>
        <div class="key num-key">4</div>
        <div class="key num-key">5</div>
        <div class="key num-key">6</div>
        <div class="key num-key">1</div>
        <div class="key num-key">2</div>
        <div class="key num-key">3</div>
        <div class="key action-clear-all" id="homeClearEntryBtn">C</div>
        <div class="key num-key">0</div>
        <div class="key action-backspace" id="homeBackspaceBtn">⌫</div>
      </div>
    </div>
  </div>

  <!-- VIEW 2: DEDICATED CUSTOM WEIGHT SCREEN (60/40 RATIO) -->
  <div class="view-container" id="customWeightView">
    <!-- TOP 60% WINDOW AREA -->
    <div class="custom-top-60" id="customDisplayContainer">
      <div class="custom-display-group">
        <div class="custom-title">Enter Custom Weight</div>
        <div class="custom-display" id="customDisplay">0 Kg</div>
        <div class="custom-subdisplay" id="customSubDisplay">Equivalent: 0g</div>
      </div>

      <!-- Action Buttons in 60% Top Section -->
      <div class="custom-action-row">
        <button class="btn-cancel" id="cancelCustomBtn">Cancel</button>
        <button class="btn-add-cart" id="addCustomToCartBtn">Add to Cart</button>
      </div>
    </div>

    <!-- BOTTOM 40% NUMPAD AREA -->
    <div class="bottom-numpad-40">
      <div class="keypad-container" id="customKeypad">
        <div class="key c-num-key">7</div>
        <div class="key c-num-key">8</div>
        <div class="key c-num-key">9</div>
        <div class="key c-num-key">4</div>
        <div class="key c-num-key">5</div>
        <div class="key c-num-key">6</div>
        <div class="key c-num-key">1</div>
        <div class="key c-num-key">2</div>
        <div class="key c-num-key">3</div>
        <div class="key c-num-key">.</div>
        <div class="key c-num-key">0</div>
        <div class="key action-backspace" id="customBackspaceBtn">⌫</div>
      </div>
    </div>
  </div>

  <!-- Cart Modal Sheet with Scrollable Body -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <h3 style="margin: 0;">🛒 Shopping Cart</h3>
      <div class="cart-scroll-container">
        <table class="cart-table" id="cartTable">
          <thead>
            <tr><th>#</th><th>Weight</th><th>Quote</th><th>Price</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      
      <div class="cart-modal-actions">
        <button class="btn-clear-cart" id="clearAllCartBtn">Clear Cart</button>
        <button class="close-modal-btn" id="closeCartBtn">Back</button>
      </div>
    </div>
  </div>

  <script>
    let priceInput = "";
    let customWeightInput = "";
    let baseWeight = 0.25;
    let itemCounter = 1;
    let cart = [];

    const homeView = document.getElementById("homeView");
    const customWeightView = document.getElementById("customWeightView");

    const displayCurrentItemPrice = document.getElementById("displayCurrentItemPrice");
    const displayCurrentItemWeight = document.getElementById("displayCurrentItemWeight");
    const headerVendorQuote = document.getElementById("headerVendorQuote");
    const homeKeypad = document.getElementById("homeKeypad");
    const homeBackspaceBtn = document.getElementById("homeBackspaceBtn");
    const homeClearEntryBtn = document.getElementById("homeClearEntryBtn");
    const openCustomWtBtn = document.getElementById("openCustomWtBtn");
    const baseWeightRow = document.getElementById("baseWeightRow");
    const targetWeightRow = document.getElementById("targetWeightRow");

    const customDisplay = document.getElementById("customDisplay");
    const customSubDisplay = document.getElementById("customSubDisplay");
    const customKeypad = document.getElementById("customKeypad");
    const customBackspaceBtn = document.getElementById("customBackspaceBtn");
    const cancelCustomBtn = document.getElementById("cancelCustomBtn");
    const addCustomToCartBtn = document.getElementById("addCustomToCartBtn");

    const cartBtnTitle = document.getElementById("cartBtnTitle");
    const cartBtnSub = document.getElementById("cartBtnSub");
    
    const openCartBtn = document.getElementById("openCartBtn");
    const cartModal = document.getElementById("cartModal");
    const closeCartBtn = document.getElementById("closeCartBtn");
    const clearAllCartBtn = document.getElementById("clearAllCartBtn");
    const cartTableBody = document.querySelector("#cartTable tbody");

    homeKeypad.addEventListener("click", (e) => {
      if (!e.target.classList.contains("num-key")) return;
      if (priceInput.length >= 6) return;
      priceInput += e.target.textContent;
      updateHomeDisplay();
    });

    homeBackspaceBtn.addEventListener("click", () => {
      priceInput = priceInput.slice(0, -1);
      updateHomeDisplay();
    });

    homeClearEntryBtn.addEventListener("click", () => {
      priceInput = "";
      displayCurrentItemPrice.textContent = "₹0.00";
      displayCurrentItemWeight.textContent = "Weight: --";
      document.querySelectorAll(".target-btn").forEach(b => b.classList.remove("target-selected"));
      updateHomeDisplay();
    });

    function updateHomeDisplay() {
      headerVendorQuote.textContent = priceInput ? `₹${priceInput}` : "₹0";
    }

    baseWeightRow.addEventListener("click", (e) => {
      if (!e.target.classList.contains("base-btn")) return;
      document.querySelectorAll(".base-btn").forEach(b => b.classList.remove("base-selected"));
      e.target.classList.add("base-selected");
      baseWeight = parseFloat(e.target.dataset.weight);
    });

    targetWeightRow.addEventListener("click", (e) => {
      if (!e.target.classList.contains("target-btn")) return;
      document.querySelectorAll(".target-btn").forEach(b => b.classList.remove("target-selected"));
      e.target.classList.add("target-selected");

      const targetWeight = parseFloat(e.target.dataset.weight);
      processAddToCart(targetWeight);
    });

    openCustomWtBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        alert("Enter a vendor price first!");
        return;
      }

      customWeightInput = "";
      updateCustomDisplay();
      homeView.style.display = "none";
      customWeightView.style.display = "flex";
    });

    cancelCustomBtn.addEventListener("click", () => {
      customWeightView.style.display = "none";
      homeView.style.display = "flex";
    });

    customKeypad.addEventListener("click", (e) => {
      if (!e.target.classList.contains("c-num-key")) return;
      const val = e.target.textContent;
      
      if (val === "." && customWeightInput.includes(".")) return;
      if (customWeightInput.length >= 6) return;

      customWeightInput += val;
      updateCustomDisplay();
    });

    customBackspaceBtn.addEventListener("click", () => {
      customWeightInput = customWeightInput.slice(0, -1);
      updateCustomDisplay();
    });

    function updateCustomDisplay() {
      if (!customWeightInput || customWeightInput === ".") {
        customDisplay.textContent = customWeightInput === "." ? ". Kg" : "0 Kg";
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      const numericVal = parseFloat(customWeightInput);
      if (isNaN(numericVal)) {
        customDisplay.textContent = "0 Kg";
        customSubDisplay.textContent = "Equivalent: 0g";
        return;
      }

      customDisplay.textContent = `${customWeightInput} Kg`;
      const calculatedGrams = Math.round(numericVal * 1000);
      customSubDisplay.textContent = `Equivalent: ${calculatedGrams}g`;
    }

    addCustomToCartBtn.addEventListener("click", () => {
      const finalWeightInKg = parseFloat(customWeightInput);

      if (isNaN(finalWeightInKg) || finalWeightInKg <= 0) {
        alert("Type a valid weight!");
        return;
      }

      processAddToCart(finalWeightInKg);

      customWeightView.style.display = "none";
      homeView.style.display = "flex";
    });

    function processAddToCart(targetWeight) {
      const priceVal = parseFloat(priceInput);
      if (isNaN(priceVal) || priceVal <= 0) {
        alert("Enter a price first!");
        return;
      }

      const calculatedPrice = ((priceVal / baseWeight) * targetWeight).toFixed(2);
      const baseLabel = baseWeight >= 1 ? `${baseWeight}Kg` : `${baseWeight * 1000}g`;

      const newItem = {
        id: itemCounter++,
        weight: targetWeight,
        quote: `₹${priceVal}/${baseLabel}`,
        price: parseFloat(calculatedPrice)
      };

      cart.push(newItem);

      displayCurrentItemPrice.textContent = `₹${newItem.price.toFixed(2)}`;
      const formattedWt = newItem.weight < 1 ? `${Math.round(newItem.weight * 1000)}g` : `${newItem.weight.toFixed(2)}Kg`;
      displayCurrentItemWeight.textContent = `Weight: ${formattedWt}`;

      renderCart();

      priceInput = "";
      updateHomeDisplay();
    }

    function renderCart() {
      cartTableBody.innerHTML = "";
      let totalP = 0, totalW = 0;

      cart.forEach((item, idx) => {
        totalP += item.price;
        totalW += item.weight;

        const row = cartTableBody.insertRow();
        row.innerHTML = `
          <td>Item #${item.id}</td>
          <td>${item.weight < 1 ? Math.round(item.weight * 1000) + 'g' : item.weight.toFixed(2) + 'Kg'}</td>
          <td>${item.quote}</td>
          <td>₹${item.price.toFixed(2)}</td>
          <td><button onclick="removeItem(${idx})" style="background:none;border:none;color:#ff453a;font-weight:bold;cursor:pointer;">🗑️</button></td>
        `;
      });

      cartBtnTitle.textContent = `Cart (${cart.length}) • ₹${totalP.toFixed(2)}`;
      cartBtnSub.textContent = `Total: ${totalW.toFixed(2)} Kg`;

      if (cart.length === 0) {
        displayCurrentItemPrice.textContent = "₹0.00";
        displayCurrentItemWeight.textContent = "Weight: --";
        document.querySelectorAll(".target-btn").forEach(b => b.classList.remove("target-selected"));
      }
    }

    window.removeItem = function(index) {
      cart.splice(index, 1);
      renderCart();
    };

    clearAllCartBtn.addEventListener("click", () => {
      if (cart.length === 0) return;
      if (confirm("Clear all items in cart?")) {
        cart = [];
        itemCounter = 1;
        priceInput = "";
        displayCurrentItemPrice.textContent = "₹0.00";
        displayCurrentItemWeight.textContent = "Weight: --";
        document.querySelectorAll(".target-btn").forEach(b => b.classList.remove("target-selected"));
        updateHomeDisplay();
        renderCart();
        cartModal.style.display = "none";
      }
    });

    openCartBtn.addEventListener("click", () => cartModal.style.display = "flex");
    closeCartBtn.addEventListener("click", () => cartModal.style.display = "none");
  </script>
</body>
</html>
