<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f2f1ef" />
<title>Notes</title>
<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
:root {
  --bg-sidebar:   #f2f1ef;
  --bg-list:      #ffffff;
  --bg-editor:    #ffffff;

  --text-primary:   #1d1d1f;
  --text-secondary: rgba(0,0,0,0.45);

  --separator:      rgba(0,0,0,0.10);
  --separator-soft: rgba(0,0,0,0.06);

  --hover:   rgba(0,0,0,0.045);
  --active:  rgba(0,0,0,0.09);
  --selection: #ffe9a8;
  --field:     rgba(0,0,0,0.055);

  --accent:      #f5c400;
  --accent-text: #1d1d1f;
  --danger:      #ff3b30;

  --check-border: rgba(0,0,0,0.30);
  --scroll-thumb: rgba(0,0,0,0.22);
}

[data-theme="dark"] {
  --bg-sidebar:   #1f1f1f;
  --bg-list:      #262626;
  --bg-editor:    #1c1c1e;

  --text-primary:   #f2f2f7;
  --text-secondary: rgba(255,255,255,0.50);

  --separator:      rgba(255,255,255,0.10);
  --separator-soft: rgba(255,255,255,0.06);

  --hover:   rgba(255,255,255,0.07);
  --active:  rgba(255,255,255,0.13);
  --selection: #4a3d00;
  --field:     rgba(255,255,255,0.09);

  --accent:      #ffd60a;
  --accent-text: #1d1d1f;
  --danger:      #ff453a;

  --check-border: rgba(255,255,255,0.38);
  --scroll-thumb: rgba(255,255,255,0.25);
}

/* ============================================================
   RESET / BASE
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
               "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-editor);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent;
}

button { font-family: inherit; color: inherit; }

button, .folder, .note-row, .tb, .icon-btn {
  touch-action: manipulation;
}

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--scroll-thumb);
  border-radius: 5px;
  border: 2px solid transparent;
  background-clip: content-box;
}

/* ============================================================
   WINDOW LAYOUT
   ============================================================ */
.window {
  display: flex;
  height: 100vh;
  height: 100dvh;
  width: 100vw;
  overflow: hidden;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
  width: 222px;
  flex: 0 0 222px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--separator);
  display: flex;
  flex-direction: column;
  padding: 12px 0 8px;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
}

.traffic {
  display: flex;
  gap: 8px;
  padding: 2px 14px 18px;
  flex: 0 0 auto;
}
.traffic span { width: 12px; height: 12px; border-radius: 50%; display: block; }
.traffic .red    { background: #ff5f57; }
.traffic .yellow { background: #febc2e; }
.traffic .green  { background: #28c840; }

.sidebar-section {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 0 0 8px;
  -webkit-overflow-scrolling: touch;
}

.sidebar-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text-secondary);
  padding: 4px 20px 6px;
}

.folder-list { list-style: none; }

.folder {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 1px 8px;
  padding: 5px 8px 5px 11px;
  border-radius: 6px;
  font-size: 13px;
  cursor: default;
  color: var(--text-primary);
  transition: background 0.08s ease;
}
.folder:hover { background: var(--hover); }
.folder.active { background: var(--active); }
.folder.active .folder-name { font-weight: 500; }

.folder-icon {
  display: flex;
  align-items: center;
  color: var(--text-secondary);
  flex: 0 0 auto;
}
.folder-name {
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.folder-badge {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
  padding: 0 4px;
  min-width: 16px;
  text-align: center;
}

.folder-input {
  flex: 1 1 auto;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 13px;
  color: var(--text-primary);
  padding: 0;
}

.folder-trash {
  margin-top: 12px;
}
.folder-trash::before {
  content: "";
  position: absolute;
  top: -6px;
  left: 8px;
  right: 8px;
  height: 1px;
  background: var(--separator);
}

/* --- Selectable folders --- */
.folder.selectable {
  padding-left: 38px;
}
.folder.selectable:hover { background: var(--hover); }
.folder.selected {
  background: var(--selection);
}
.folder.selected:hover { background: var(--selection); }

.sel-circle {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--check-border);
  background: var(--bg-list);
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  pointer-events: none;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.sel-circle svg {
  width: 11px;
  height: 11px;
  color: var(--accent-text);
  opacity: 0;
  transition: opacity 0.1s ease;
}

.folder.selected .sel-circle,
.note-row.selected .sel-circle {
  background: var(--accent);
  border-color: var(--accent);
}
.folder.selected .sel-circle svg,
.note-row.selected .sel-circle svg {
  opacity: 1;
}

.sidebar-footer {
  flex: 0 0 auto;
  padding: 6px 12px 2px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.sidebar-footer .theme-btn { margin-left: auto; }

.new-folder {
  display: flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: none;
  font-size: 12px;
  color: var(--text-secondary);
  padding: 5px 8px;
  border-radius: 6px;
  cursor: default;
}
.new-folder:hover { background: var(--hover); color: var(--text-primary); }
.new-folder svg { opacity: 0.8; }
.new-folder:disabled { opacity: 0.4; pointer-events: none; }

.theme-btn {
  width: 26px; height: 26px;
  border: none;
  background: transparent;
  border-radius: 6px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
  flex: 0 0 auto;
}
.theme-btn:hover { background: var(--hover); color: var(--text-primary); }

/* ============================================================
   CONTEXT MENU
   ============================================================ */
.ctx-menu {
  position: fixed;
  z-index: 2000;
  min-width: 168px;
  background: var(--bg-list);
  border: 1px solid var(--separator);
  border-radius: 8px;
  padding: 4px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.20), 0 1px 4px rgba(0,0,0,0.10);
  user-select: none;
  -webkit-user-select: none;
}
.ctx-menu[hidden] { display: none; }

.ctx-item {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  padding: 6px 10px;
  border-radius: 5px;
  cursor: default;
  color: var(--text-primary);
  font-size: 13px;
}
.ctx-item:hover { background: var(--accent); color: var(--accent-text); }
.ctx-item.ctx-danger:hover { background: var(--danger); color: #fff; }
.ctx-item[disabled] { opacity: 0.35; pointer-events: none; }

/* ============================================================
   NOTE LIST PANE
   ============================================================ */
.list-pane {
  width: 300px;
  flex: 0 0 300px;
  background: var(--bg-list);
  border-right: 1px solid var(--separator);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.list-header {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 12px 10px;
  user-select: none;
  -webkit-user-select: none;
}

.list-folder-name {
  display: none;
  flex: 1 1 auto;
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  align-self: center;
  letter-spacing: -0.02em;
}

.search-wrap {
  position: relative;
  flex: 1 1 auto;
  display: flex;
  align-items: center;
}

.search-icon {
  position: absolute;
  left: 7px;
  color: var(--text-secondary);
  pointer-events: none;
  display: flex;
}

.search {
  width: 100%;
  height: 26px;
  border: none;
  outline: none;
  border-radius: 6px;
  background: var(--field);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 12.5px;
  padding: 0 8px 0 25px;
  transition: box-shadow 0.12s ease;
}
.search::placeholder { color: var(--text-secondary); }
.search:focus { box-shadow: 0 0 0 3px rgba(245,196,0,0.35); }

.icon-btn {
  flex: 0 0 auto;
  width: 28px; height: 26px;
  border: none;
  background: transparent;
  border-radius: 5px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
}
.icon-btn:hover { background: var(--hover); color: var(--text-primary); }
.icon-btn:active { background: var(--active); }

.text-btn {
  flex: 0 0 auto;
  padding: 4px 10px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: default;
  white-space: nowrap;
}
.text-btn:hover { background: var(--hover); color: var(--text-primary); }
.text-btn:active { background: var(--active); }
.text-btn[disabled] { opacity: 0.4; pointer-events: none; }

.note-list {
  flex: 1 1 auto;
  overflow-y: auto;
  list-style: none;
  padding-bottom: 40px;
  -webkit-overflow-scrolling: touch;
}

.note-row {
  position: relative;
  padding: 8px 14px 9px;
  border-bottom: 1px solid var(--separator-soft);
  cursor: default;
  user-select: none;
  -webkit-user-select: none;
}
.note-row:hover { background: var(--hover); }
.note-row.active { background: var(--selection); }
.note-row.active:hover { background: var(--selection); }

/* --- Selectable notes --- */
.note-row.selectable {
  padding-left: 42px;
}
.note-row.selected {
  background: var(--selection);
}
.note-row.selected:hover { background: var(--selection); }

.row-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 4px;
}

.row-pin {
  display: inline-flex;
  color: var(--text-secondary);
  flex: 0 0 auto;
}

.row-meta {
  display: flex;
  gap: 6px;
  font-size: 12px;
  line-height: 1.35;
  color: var(--text-secondary);
  overflow: hidden;
}
.row-date { flex: 0 0 auto; }
.row-snippet {
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.list-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 13px;
}

/* ============================================================
   EDITOR PANE
   ============================================================ */
.editor-pane {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-editor);
  overflow: hidden;
}

.toolbar {
  flex: 0 0 auto;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 1px;
  padding: 0 14px;
  user-select: none;
  -webkit-user-select: none;
}

.toolbar-content {
  display: flex;
  align-items: center;
  gap: 1px;
}

.tb {
  width: 28px;
  height: 26px;
  border: none;
  background: transparent;
  border-radius: 5px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
  font-size: 13px;
  transition: background 0.08s ease, color 0.08s ease;
  flex: 0 0 auto;
}
.tb:hover { background: var(--hover); color: var(--text-primary); }
.tb:active { background: var(--active); }
.tb.active { background: var(--active); color: var(--text-primary); }

body.selecting .tb {
  pointer-events: none;
  opacity: 0.4;
}

.tb-sep {
  width: 1px;
  height: 15px;
  background: var(--separator);
  margin: 0 5px;
  flex: 0 0 auto;
}

.ico-b { font-weight: 800; font-size: 13px; line-height: 1; }
.ico-i { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 700; font-size: 14px; line-height: 1; }
.ico-u { text-decoration: underline; text-underline-offset: 2px; font-weight: 600; }
.ico-s { text-decoration: line-through; font-weight: 600; }
.ico-aa { font-weight: 600; font-size: 12.5px; letter-spacing: -0.03em; }

/* Trash banner */
.trash-banner {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 20px;
  background: var(--field);
  border-bottom: 1px solid var(--separator);
  font-size: 12.5px;
  color: var(--text-secondary);
  user-select: none;
  -webkit-user-select: none;
}
.trash-banner .trash-actions { display: flex; gap: 6px; }
.trash-banner button {
  padding: 5px 11px;
  border-radius: 6px;
  border: 1px solid var(--separator);
  background: var(--bg-editor);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 500;
  cursor: default;
  white-space: nowrap;
}
.trash-banner button:hover { background: var(--hover); }
.trash-banner button.danger { color: var(--danger); }
.trash-banner button.danger:hover {
  background: var(--danger); color: #fff; border-color: var(--danger);
}

.editor-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

.editor-wrap {
  max-width: 780px;
  margin: 0 auto;
  padding: 4px 46px 160px;
}

.note-title {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.021em;
  color: var(--text-primary);
  padding: 6px 0 2px;
  line-height: 1.25;
}
.note-title::placeholder { color: var(--text-secondary); }
.note-title[readonly] { cursor: default; }

.note-date {
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  user-select: none;
  -webkit-user-select: none;
}

.note-body {
  outline: none;
  font-size: 14px;
  line-height: 1.55;
  color: var(--text-primary);
  min-height: 320px;
  word-wrap: break-word;
  overflow-wrap: break-word;
  caret-color: var(--accent);
}
.note-body:empty::before {
  content: attr(data-placeholder);
  color: var(--text-secondary);
  pointer-events: none;
}
.note-body[contenteditable="false"] { cursor: default; }

.note-body div { min-height: 1.55em; }
.note-body h2 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 10px 0 2px;
  line-height: 1.35;
}
.note-body ul,
.note-body ol { padding-left: 24px; margin: 4px 0; }
.note-body li { margin: 1px 0; }
.note-body b, .note-body strong { font-weight: 700; }

.note-body .check {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 1px 0;
}
.note-body .check > .box {
  flex: 0 0 auto;
  width: 14px;
  height: 14px;
  margin-top: 4px;
  border-radius: 4px;
  border: 1.5px solid var(--check-border);
  display: inline-block;
  cursor: pointer;
  position: relative;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.note-body .check > .txt {
  flex: 1 1 auto;
  min-width: 0;
  outline: none;
}
.note-body .check.checked > .box {
  background: var(--accent);
  border-color: var(--accent);
}
.note-body .check.checked > .box::after {
  content: "";
  position: absolute;
  left: 4px;
  top: 1px;
  width: 4px;
  height: 8px;
  border: solid var(--accent-text);
  border-width: 0 1.7px 1.7px 0;
  transform: rotate(45deg);
}
.note-body .check.checked > .txt {
  color: var(--text-secondary);
  text-decoration: line-through;
}

.editor-empty {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--text-secondary);
  user-select: none;
  -webkit-user-select: none;
}
.editor-empty .glyph { opacity: 0.55; }
.editor-empty .msg { font-size: 14px; font-weight: 500; }
.editor-empty .sub { font-size: 12px; opacity: 0.8; }

/* ============================================================
   SELECTION BAR
   ============================================================ */
.selection-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: var(--bg-list);
  border-top: 1px solid var(--separator);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 16px;
  padding-bottom: env(safe-area-inset-bottom, 0);
  z-index: 400;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
  user-select: none;
  -webkit-user-select: none;
}
.selection-bar[hidden] { display: none; }

.selection-count {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
}

.selection-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.sel-btn {
  padding: 6px 14px;
  border-radius: 7px;
  border: 1px solid var(--separator);
  background: var(--bg-editor);
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 500;
  cursor: default;
  white-space: nowrap;
}
.sel-btn:hover { background: var(--hover); }
.sel-btn:active { background: var(--active); }
.sel-btn.danger { color: var(--danger); }
.sel-btn.danger:hover {
  background: var(--danger); color: #fff; border-color: var(--danger);
}
.sel-btn[disabled] { opacity: 0.35; pointer-events: none; }

/* Padding so content isn't hidden under the bar */
body.selecting .note-list { padding-bottom: 100px; }
body.selecting .editor-scroll { padding-bottom: 60px; }
body.selecting .sidebar-section { padding-bottom: 80px; }

/* ============================================================
   MOBILE-ONLY (hidden by default)
   ============================================================ */
.mobile-only { display: none !important; }

/* ============================================================
   RESPONSIVE — TABLET
   ============================================================ */
@media (max-width: 900px) and (min-width: 769px) {
  .sidebar { width: 180px; flex-basis: 180px; }
  .list-pane { width: 250px; flex-basis: 250px; }
  .editor-wrap { padding: 4px 24px 120px; }
}

/* ============================================================
   RESPONSIVE — MOBILE / ANDROID
   ============================================================ */
@media (max-width: 768px) {
  body { font-size: 15px; }

  .mobile-only { display: flex !important; }
  .traffic { display: none; }

  .sidebar {
    position: fixed;
    inset: 0;
    width: 100%;
    max-width: 100%;
    flex-basis: auto;
    z-index: 200;
    border-right: none;
    padding-top: calc(12px + env(safe-area-inset-top));
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
  }

  .sidebar-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    padding: 8px 20px 12px;
  }

  .list-pane {
    flex: 1 1 100%;
    width: 100%;
    border-right: none;
  }
  .editor-pane {
    flex: 1 1 100%;
    width: 100%;
  }

  .window[data-mobile-view="folders"] .sidebar    { display: flex; }
  .window[data-mobile-view="folders"] .list-pane  { display: none; }
  .window[data-mobile-view="folders"] .editor-pane{ display: none; }

  .window[data-mobile-view="list"]    .sidebar    { display: none; }
  .window[data-mobile-view="list"]    .list-pane  { display: flex; }
  .window[data-mobile-view="list"]    .editor-pane{ display: none; }

  .window[data-mobile-view="editor"]  .sidebar    { display: none; }
  .window[data-mobile-view="editor"]  .list-pane  { display: none; }
  .window[data-mobile-view="editor"]  .editor-pane{ display: flex; }

  .folder {
    padding: 9px 10px 9px 12px;
    font-size: 15px;
    min-height: 40px;
  }
  .folder.selectable { padding-left: 42px; }
  .folder-input { font-size: 16px; }
  .folder-badge { font-size: 13px; }
  .new-folder { font-size: 13px; padding: 8px 10px; }
  .theme-btn { width: 34px; height: 34px; }

  .list-header {
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 12px 8px;

<script>
/* ============================================================================
   Apple Notes — Application Logic
   ============================================================================ */

const STORAGE_KEY = 'apple-notes-clone-v1';
const MOBILE_BREAKPOINT = 768;
const TRASH_ID = '__trash__';
const TRASH_TTL = 30 * 24 * 60 * 60 * 1000;

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const uid = () =>
  Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

const escapeHtml = (s) =>
  String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function plainText(html) {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return d.textContent.replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
}

const isMobile = () => window.innerWidth <= MOBILE_BREAKPOINT;

/* ---------------------------------------------------------------- ICONS --- */
const FOLDER_SVG = `
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
     stroke-width="1.3" stroke-linejoin="round">
  <path d="M1.6 4.3c0-.7.55-1.2 1.2-1.2h3.1l1.4 1.6h5.1c.65 0 1.2.5 1.2 1.2v6.4c0 .7-.55 1.2-1.2 1.2H2.8c-.65 0-1.2-.5-1.2-1.2V4.3Z"/>
</svg>`;

const TRASH_SVG = `
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
     stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M2.3 4.1h11.4"/>
  <path d="M5.9 4.1V2.4h4.2v1.7"/>
  <path d="M3.9 4.1 4.6 13a1 1 0 0 0 1 .9h4.8a1 1 0 0 0 1-.9l.7-8.9"/>
  <path d="M6.6 6.6v4.6M9.4 6.6v4.6"/>
</svg>`;

const PIN_SVG = `
<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5.6 1.6h4.8M6.6 1.6v4.2L4 8.4v1.1h8V8.4L9.4 5.8V1.6"/>
  <path d="M8 9.5v4.9"/>
</svg>`;

const CHECK_SVG = `
<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 8.5 6.5 12 13 4.5"/>
</svg>`;

/* ---------------------------------------------------------------- STATE --- */
let state = null;
let saveTimer = null;

/* Selection state (not persisted) */
let selectionMode = null; // 'notes' | 'folders' | null
const selectedIds = new Set();

function defaultState() {
  return {
    folders: [{ id: 'notes', name: 'Notes' }],
    notes: [],
    activeFolder: 'notes',
    activeNoteId: null,
    query: '',
    theme: null
  };
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.folders) || !Array.isArray(parsed.notes))
      return defaultState();
    const s = Object.assign(defaultState(), parsed);
    s.notes.forEach((n) => {
      if (n.deletedAt === undefined) n.deletedAt = null;
    });
    return s;
  } catch (e) {
    return defaultState();
  }
}

function save(immediate = false) {
  clearTimeout(saveTimer);
  const write = () => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* ignore */ }
  };
  if (immediate) write();
  else saveTimer = setTimeout(write, 350);
}

/* ------------------------------------------------------------- HELPERS --- */
const activeNote = () =>
  state.notes.find((n) => n.id === state.activeNoteId) || null;

const isTrashView = () => state.activeFolder === TRASH_ID;
const trashedNotes = () => state.notes.filter((n) => n.deletedAt != null);
const trashCount = () => trashedNotes().length;

function snippet(note) {
  const t = plainText(note.body);
  if (!t) return 'No additional text';
  return t.length > 110 ? t.slice(0, 110) + '…' : t;
}

function formatListDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.getFullYear() === now.getFullYear() &&
    d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  if (sameDay)
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

  const yest = new Date(now);
  yest.setDate(now.getDate() - 1);
  const isYesterday = d.getFullYear() === yest.getFullYear() &&
    d.getMonth() === yest.getMonth() && d.getDate() === yest.getDate();
  if (isYesterday) return 'Yesterday';

  const m = d.getMonth() + 1;
  const day = d.getDate();
  const yy = String(d.getFullYear()).slice(-2);
  return `${m}/${day}/${yy}`;
}

function formatFullDate(ts) {
  const d = new Date(ts);
  const date = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  return `${date} at ${time}`;
}

/* -------------------------------------------------- MOBILE VIEW SWITCH --- */
const windowEl = $('#windowEl');

function setMobileView(view) {
  windowEl.dataset.mobileView = view;
}

function syncListFolderName() {
  const nameEl = $('#listFolderName');
  if (!nameEl) return;
  if (isTrashView()) { nameEl.textContent = 'Trash'; return; }
  const folder = state.folders.find((f) => f.id === state.activeFolder);
  if (folder) nameEl.textContent = folder.name;
}

/* ------------------------------------------------------ LONG PRESS HELPER -- */
function attachLongPress(el, callback, ms = 500) {
  let timer = null;
  let startX = 0, startY = 0;
  const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };

  el.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    if (e.pointerType === 'pen' && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY;
    clear();
    timer = setTimeout(() => {
      timer = null;
      if (navigator.vibrate) { try { navigator.vibrate(20); } catch (_) {} }
      callback(e.clientX, e.clientY);
    }, ms);
  }, { passive: true });

  el.addEventListener('pointermove', (e) => {
    if (!timer) return;
    if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) clear();
  }, { passive: true });

  el.addEventListener('pointerup', clear, { passive: true });
  el.addEventListener('pointercancel', clear, { passive: true });
  el.addEventListener('pointerleave', clear, { passive: true });
}

/* ============================================================
   SELECTION MODE
   ============================================================ */
function enterSelectionMode(mode) {
  if (mode === 'folders' && state.folders.length <= 1) return;
  selectionMode = mode;
  selectedIds.clear();
  renderFolders();
  renderList();
  renderEditor();
}

function exitSelectionMode() {
  selectionMode = null;
  selectedIds.clear();
  renderFolders();
  renderList();
  renderEditor();
}

function toggleSelection(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  renderFolders();
  renderList();
}

function selectAllItems() {
  if (selectionMode === 'notes') {
    visibleNotes().forEach((n) => selectedIds.add(n.id));
  } else if (selectionMode === 'folders') {
    state.folders.forEach((f) => selectedIds.add(f.id));
  }
  renderFolders();
  renderList();
}

/* ============================================================
   RENDERING
   ============================================================ */
function visibleNotes() {
  const q = state.query.trim().toLowerCase();
  let notes;

  if (isTrashView()) {
    notes = state.notes.filter((n) => n.deletedAt != null);
    notes.sort((a, b) => b.deletedAt - a.deletedAt);
  } else {
    notes = state.notes.filter((n) => n.deletedAt == null && n.folder === state.activeFolder);
    notes.sort((a, b) => {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return b.edited - a.edited;
    });
  }

  if (q) {
    notes = notes.filter((n) => {
      const haystack = (n.title + ' ' + plainText(n.body)).toLowerCase();
      return haystack.includes(q);
    });
  }

  return notes;
}

function ensureActiveNoteValid() {
  const vis = visibleNotes();
  if (!vis.some((n) => n.id === state.activeNoteId)) {
    state.activeNoteId = vis.length ? vis[0].id : null;
  }
}

function renderHeaderActions() {
  const newBtn = $('#newNoteBtn');
  const emptyBtn = $('#emptyTrashBtn');
  const selectBtn = $('#selectNotesBtn');

  if (selectionMode === 'notes') {
    newBtn.style.display = 'none';
    emptyBtn.style.display = 'none';
    selectBtn.textContent = 'Done';
  } else {
    selectBtn.textContent = 'Select';
    if (isTrashView()) {
      newBtn.style.display = 'none';
      const count = trashCount();
      emptyBtn.style.display = count > 0 ? 'flex' : 'none';
      emptyBtn.textContent = count > 0 ? `Empty (${count})` : 'Empty';
    } else {
      newBtn.style.display = 'flex';
      emptyBtn.style.display = 'none';
    }
  }
}

function renderSelectionBar() {
  const bar = $('#selectionBar');
  if (!selectionMode) {
    bar.hidden = true;
    document.body.classList.remove('selecting');
    return;
  }
  bar.hidden = false;
  document.body.classList.add('selecting');

  const count = selectedIds.size;
  $('#selectionCount').textContent = `${count} selected`;

  const restoreBtn = $('#selRestoreBtn');
  const moveBtn    = $('#selMoveBtn');
  const deleteBtn  = $('#selDeleteBtn');
  const selectAllBtn = $('#selSelectAllBtn');

  // "Select All" hides when everything selectable is already selected
  let totalSelectable;
  if (selectionMode === 'notes') totalSelectable = visibleNotes().length;
  else totalSelectable = state.folders.length;

  const allSelected = totalSelectable > 0 && count >= totalSelectable;
  selectAllBtn.style.display = allSelected ? 'none' : '';

  if (selectionMode === 'notes') {
    const isTrash = isTrashView();
    restoreBtn.style.display = (isTrash && count > 0) ? '' : 'none';
    moveBtn.style.display    = (!isTrash && count > 0) ? '' : 'none';
    deleteBtn.style.display  = count > 0 ? '' : 'none';
    deleteBtn.textContent = isTrash ? 'Delete Permanently' : 'Delete';
  } else {
    restoreBtn.style.display = 'none';
    moveBtn.style.display = 'none';
    deleteBtn.style.display = count > 0 ? '' : 'none';
    deleteBtn.textContent = 'Delete Folders';
  }
}

function renderFolders() {
  const list = $('#folderList');
  list.innerHTML = '';

  const isSelectingFolders = selectionMode === 'folders';

  state.folders.forEach((f) => {
    const li = document.createElement('li');
    li.className = 'folder';
    if (isSelectingFolders) {
      li.classList.add('selectable');
      if (selectedIds.has(f.id)) li.classList.add('selected');
    } else if (f.id === state.activeFolder) {
      li.classList.add('active');
    }
    li.dataset.folder = f.id;

    let html = '';
    if (isSelectingFolders) html += `<span class="sel-circle">${CHECK_SVG}</span>`;
    html += `<span class="folder-icon">${FOLDER_SVG}</span>`;
    html += `<span class="folder-name">${escapeHtml(f.name)}</span>`;
    li.innerHTML = html;

    li.addEventListener('click', (e) => {
      if (isSelectingFolders) {
        toggleSelection(f.id);
      } else if (e.metaKey || e.ctrlKey) {
        selectionMode = 'folders';
        selectedIds.clear();
        selectedIds.add(f.id);
        renderFolders();
        renderList();
        renderEditor();
      } else {
        selectFolder(f.id);
      }
    });

    if (!isSelectingFolders) {
      li.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        openFolderMenu(e.clientX, e.clientY, f.id);
      });
      li.addEventListener('dblclick', () => {
        if (!isMobile()) startRenameFolder(f.id);
      });
      attachLongPress(li, (x, y) => openFolderMenu(x, y, f.id));
    }

    list.appendChild(li);
  });

  /* Trash entry — never selectable */
  const count = trashCount();
  const trashLi = document.createElement('li');
  trashLi.className = 'folder folder-trash' +
    (state.activeFolder === TRASH_ID && !isSelectingFolders ? ' active' : '');
  trashLi.innerHTML =
    `<span class="folder-icon">${TRASH_SVG}</span>` +
    `<span class="folder-name">Trash</span>` +
    (count > 0 ? `<span class="folder-badge">${count}</span>` : '');

  trashLi.addEventListener('click', () => {
    if (isSelectingFolders) return;
    selectFolder(TRASH_ID);
  });

  if (!isSelectingFolders) {
    trashLi.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (count > 0) openTrashMenu(e.clientX, e.clientY);
    });
    attachLongPress(trashLi, (x, y) => {
      if (trashCount() > 0) openTrashMenu(x, y);
    });
  }

  list.appendChild(trashLi);

  /* Select button state */
  const selectFoldersBtn = $('#selectFoldersBtn');
  if (selectFoldersBtn) {
    if (selectionMode === 'folders') {
      selectFoldersBtn.textContent = 'Done';
      selectFoldersBtn.disabled = false;
    } else {
      selectFoldersBtn.textContent = 'Select';
      selectFoldersBtn.disabled = state.folders.length <= 1;
    }
  }

  syncListFolderName();
  renderHeaderActions();
  renderSelectionBar();
}

function renderList() {
  syncListFolderName();
  renderHeaderActions();

  const listEl = $('#noteList');
  const notes = visibleNotes();

  listEl.innerHTML = '';

  if (!notes.length) {
    const empty = document.createElement('div');
    empty.className = 'list-empty';
    if (isTrashView()) {
      empty.textContent = state.query.trim() ? 'No Results' : 'Trash is Empty';
    } else {
      empty.textContent = state.query.trim() ? 'No Results' : 'No Notes';
    }
    listEl.appendChild(empty);
    renderSelectionBar();
    return;
  }

  const isSelectingNotes = selectionMode === 'notes';

  notes.forEach((note) => {
    const li = document.createElement('li');
    li.className = 'note-row';
    if (isSelectingNotes) {
      li.classList.add('selectable');
      if (selectedIds.has(note.id)) li.classList.add('selected');
    } else if (note.id === state.activeNoteId) {
      li.classList.add('active');
    }
    li.dataset.id = note.id;

    const isTrashed = note.deletedAt != null;
    const dateTs = isTrashed ? note.deletedAt : note.edited;

    let html = '';
    if (isSelectingNotes) html += `<span class="sel-circle">${CHECK_SVG}</span>`;
    html +=
      `<div class="row-title">` +
        (!isTrashed && note.pinned ? `<span class="row-pin">${PIN_SVG}</span>` : '') +
        `<span class="row-title-text">${escapeHtml(note.title || 'New Note')}</span>` +
      `</div>` +
      `<div class="row-meta">` +
        `<span class="row-date">${formatListDate(dateTs)}</span>` +
        `<span class="row-snippet">${escapeHtml(snippet(note))}</span>` +
      `</div>`;
    li.innerHTML = html;

    li.addEventListener('click', (e) => {
      if (isSelectingNotes) {
        toggleSelection(note.id);
      } else if (e.metaKey || e.ctrlKey) {
        selectionMode = 'notes';
        selectedIds.clear();
        selectedIds.add(note.id);
        renderFolders();
        renderList();
        renderEditor();
      } else {
        selectNote(note.id);
      }
    });

    if (!isSelectingNotes) {
      li.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (!isMobile()) selectNote(note.id);
        openNoteMenu(e.clientX, e.clientY, note.id);
      });
      attachLongPress(li, (x, y) => openNoteMenu(x, y, note.id));
    }

    listEl.appendChild(li);
  });

  renderSelectionBar();
}

function renderEditor() {
  const note = activeNote();
  const emptyEl = $('#editorEmpty');
  const wrapEl = $('#editorWrap');
  const bodyEl = $('#noteBody');
  const titleEl = $('#noteTitle');
  const banner = $('#trashBanner');
  const toolbarContent = $('#toolbarContent');

  if (!note) {
    emptyEl.style.display = 'flex';
    wrapEl.style.display = 'none';
    $('#toolbar').style.visibility = 'hidden';
    banner.style.display = 'none';
    return;
  }

  const isTrashed = note.deletedAt != null;
  const inSelection = selectionMode !== null;
  const readOnly = isTrashed || inSelection;

  $('#toolbar').style.visibility = 'visible';
  emptyEl.style.display = 'none';
  wrapEl.style.display = 'block';

  banner.style.display = isTrashed ? 'flex' : 'none';
  toolbarContent.style.display = (isTrashed || inSelection) ? 'none' : 'flex';

  titleEl.value = note.title;
  titleEl.readOnly = readOnly;
  bodyEl.contentEditable = readOnly ? 'false' : 'true';

  $('#noteDate').textContent = isTrashed
    ? `Deleted ${formatFullDate(note.deletedAt)}`
    : formatFullDate(note.edited);

  if (bodyEl.innerHTML !== note.body) bodyEl.innerHTML = note.body;
  if (!isTrashed) normalizeChecks(bodyEl);

  const pinBtn = $('#pinBtn');
  pinBtn.classList.toggle('active', !!note.pinned);
  pinBtn.title = note.pinned ? 'Unpin Note' : 'Pin Note';

  updateToolbarState();
}

function updateActiveRow(note) {
  const row = $(`.note-row[data-id="${note.id}"]`);
  if (!row) return;

  const titleText = row.querySelector('.row-title-text');
  if (titleText) titleText.textContent = note.title || 'New Note';

  const dateEl = row.querySelector('.row-date');
  if (dateEl) {
    const ts = note.deletedAt != null ? note.deletedAt : note.edited;
    dateEl.textContent = formatListDate(ts);
  }

  const snipEl = row.querySelector('.row-snippet');
  if (snipEl) snipEl.textContent = snippet(note);

  const editorDate = $('#noteDate');
  if (editorDate && note.id === state.activeNoteId) {
    editorDate.textContent = note.deletedAt != null
      ? `Deleted ${formatFullDate(note.deletedAt)}`
      : formatFullDate(note.edited);
  }
}

/* ============================================================
   ACTIONS
   ============================================================ */
function selectFolder(folderId) {
  state.activeFolder = folderId;
  ensureActiveNoteValid();
  save(true);
  renderFolders();
  renderList();
  renderEditor();
  if (isMobile()) setMobileView('list');
}

function selectNote(noteId) {
  state.activeNoteId = noteId;
  const note = activeNote();
  if (note && note.deletedAt == null && note.folder !== state.activeFolder) {
    state.activeFolder = note.folder;
    renderFolders();
  }
  save(true);
  renderList();
  renderEditor();
  if (isMobile()) setMobileView('editor');
}

function createNote() {
  if (isTrashView()) return;

  const note = {
    id: uid(),
    folder: state.activeFolder,
    title: '',
    body: '',
    created: Date.now(),
    edited: Date.now(),
    deletedAt: null,
    pinned: false
  };

  state.notes.unshift(note);
  state.activeNoteId = note.id;
  state.query = '';
  $('#searchInput').value = '';

  save(true);
  renderList();
  renderEditor();
  if (isMobile()) setMobileView('editor');

  requestAnimationFrame(() => {
    $('#noteTitle').focus();
    $('#editorScroll').scrollTop = 0;
  });
}

function deleteNote(id = state.activeNoteId) {
  const note = state.notes.find((n) => n.id === id);
  if (!note) return;

  if (note.deletedAt != null) {
    if (!confirm('Permanently delete this note? This cannot be undone.')) return;
    deleteNotePermanently(id);
  } else {
    moveToTrash(id);
  }
}

function moveToTrash(id) {
  const note = state.notes.find((n) => n.id === id);
  if (!note || note.deletedAt != null) return;

  note.deletedAt = Date.now();
  note.pinned = false;

  ensureActiveNoteValid();
  save(true);
  renderFolders();
  renderList();
  renderEditor();
}

function restoreNote(id) {
  const note = state.notes.find((n) => n.id === id);
  if (!note || note.deletedAt == null) return;

  note.deletedAt = null;
  note.edited = Date.now();
  if (!state.folders.some((f) => f.id === note.folder)) {
    note.folder = state.folders[0].id;
  }

  ensureActiveNoteValid();
  save(true);
  renderFolders();
  renderList();
  renderEditor();
}

function deleteNotePermanently(id) {
  const idx = state.notes.findIndex((n) => n.id === id);
  if (idx === -1) return;
  state.notes.splice(idx, 1);
  ensureActiveNoteValid();
  save(true);
  renderFolders();
  renderList();
  renderEditor();
}

function emptyTrash() {
  const count = trashCount();
  if (count === 0) return;
  if (!confirm(`Permanently delete ${count} note${count === 1 ? '' : 's'}? This cannot be undone.`))
    return;

  state.notes = state.notes.filter((n) => n.deletedAt == null);
  ensureActiveNoteValid();
  save(true);
  renderFolders();
  renderList();
  renderEditor();
}

function togglePin(id = state.activeNoteId) {
  const note = state.notes.find((n) => n.id === id);
  if (!note || note.deletedAt != null) return;
  note.pinned = !note.pinned;
  save(true);
  renderList();
  renderEditor();
}

/* ============================================================
   BULK ACTIONS
   ============================================================ */
function bulkDeleteNotes() {
  if (selectedIds.size === 0) return;
  const ids = Array.from(selectedIds);

  if (isTrashView()) {
    if (!confirm(`Permanently delete ${ids.length} note${ids.length === 1 ? '' : 's'}? This cannot be undone.`))
      return;
    state.notes = state.notes.filter((n) => !ids.includes(n.id));
  } else {
    const now = Date.now();
    ids.forEach((id) => {
      const note = state.notes.find((n) => n.id === id);
      if (note && note.deletedAt == null) {
        note.deletedAt = now;
        note.pinned = false;
      }
    });
  }

  selectedIds.clear();
  ensureActiveNoteValid();
  save(true);
  renderFolders();
  renderList();
  renderEditor();
}

function bulkRestoreNotes() {
  if (selectedIds.size === 0) return;
  const ids = Array.from(selectedIds);
  const fallback = state.folders[0].id;

  ids.forEach((id) => {
    const note = state.notes.find((n) => n.id === id);
    if (note && note.deletedAt != null) {
      note.deletedAt = null;
      note.edited = Date.now();
      if (!state.folders.some((f) => f.id === note.folder)) {
        note.folder = fallback;
      }
    }
  });

  selectedIds.clear();
  ensureActiveNoteValid();
  save(true);
  renderFolders();
  renderList();
  renderEditor();
}

function bulkMoveNotes(targetFolderId) {
  if (selectedIds.size === 0) return;
  const ids = Array.from(selectedIds);

  ids.forEach((id) => {
    const note = state.notes.find((n) => n.id === id);
    if (note && note.deletedAt == null && note.folder !== targetFolderId) {
      note.folder = targetFolderId;
      note.edited = Date.now();
    }
  });

  selectedIds.clear();
  ensureActiveNoteValid();
  save(true);
  renderFolders();
  renderList();
  renderEditor();
}

function bulkDeleteFolders() {
  if (selectedIds.size === 0) return;
  const ids = Array.from(selectedIds).filter((id) =>
    state.folders.some((f) => f.id === id)
  );

  if (ids.length === 0) return;

  if (ids.length >= state.folders.length) {
    alert('You cannot delete all folders. At least one folder must remain.');
    return;
  }

  const totalNotes = ids.reduce(
    (sum, id) => sum + state.notes.filter((n) => n.folder === id && n.deletedAt == null).length,
    0
  );

  const msg = `Delete ${ids.length} folder${ids.length === 1 ? '' : 's'}` +
    (totalNotes > 0 ? ` and move ${totalNotes} note${totalNotes === 1 ? '' : 's'} to Trash?` : '?');

  if (!confirm(msg)) return;

  const now = Date.now();
  state.notes.forEach((n) => {
    if (ids.includes(n.folder) && n.deletedAt == null) {
      n.deletedAt = now;
      n.pinned = false;
    }
  });

  state.folders = state.folders.filter((f) => !ids.includes(f.id));

  if (ids.includes(state.activeFolder)) {
    state.activeFolder = state.folders[0].id;
  }

  selectedIds.clear();
  ensureActiveNoteValid();
  save(true);
  renderFolders();
  renderList();
  renderEditor();
}

/* ============================================================
   MOVE-TO-FOLDER MENU
   ============================================================ */
const moveMenu = $('#moveMenu');

function openMoveMenu(anchorEl) {
  const noteIds = Array.from(selectedIds).filter((id) => {
    const n = state.notes.find((x) => x.id === id);
    return n && n.deletedAt == null;
  });
  if (noteIds.length === 0) return;

  moveMenu.innerHTML = '';

  const currentFolders = new Set(noteIds.map((id) => state.notes.find((n) => n.id === id).folder));
  const singleFolderId = currentFolders.size === 1 ? Array.from(currentFolders)[0] : null;

  state.folders.forEach((f) => {
    const btn = document.createElement('button');
    btn.className = 'ctx-item';
    btn.textContent = f.name;
    if (f.id === singleFolderId) {
      btn.disabled = true;
      btn.title = 'Notes are already in this folder';
    }
    btn.addEventListener('click', () => {
      hideMoveMenu();
      bulkMoveNotes(f.id);
    });
    moveMenu.appendChild(btn);
  });

  moveMenu.hidden = false;
  moveMenu.style.left = '0px';
  moveMenu.style.top = '0px';

  const rect = moveMenu.getBoundingClientRect();
  const anchorRect = anchorEl.getBoundingClientRect();
  const px = Math.max(6, Math.min(anchorRect.left, window.innerWidth - rect.width - 8));
  const py = Math.max(6, anchorRect.top - rect.height - 8);
  moveMenu.style.left = px + 'px';
  moveMenu.style.top = py + 'px';
}

function hideMoveMenu() {
  moveMenu.hidden = true;
}

/* ============================================================
   CONTEXT MENUS
   ============================================================ */
const ctxMenu = $('#ctxMenu');
let ctxFolderId = null;

function openFolderMenu(x, y, folderId) {
  hideNoteMenu(); hideTrashMenu(); hideMoveMenu();
  ctxFolderId = folderId;

  const delBtn = ctxMenu.querySelector('[data-action="delete"]');
  delBtn.disabled = state.folders.length <= 1;
  delBtn.title = delBtn.disabled ? 'You can’t delete the only folder' : '';

  showMenuAt(ctxMenu, x, y);
}

function hideCtxMenu() { ctxMenu.hidden = true; ctxFolderId = null; }

ctxMenu.addEventListener('click', (e) => {
  const btn = e.target.closest('.ctx-item');
  if (!btn || btn.disabled) return;
  const action = btn.dataset.action;
  const id = ctxFolderId;
  hideCtxMenu();
  if (!id) return;
  if (action === 'rename') startRenameFolder(id);
  if (action === 'delete') deleteFolder(id);
});

const trashCtxMenu = $('#trashCtxMenu');

function openTrashMenu(x, y) {
  hideCtxMenu(); hideNoteMenu(); hideMoveMenu();
  showMenuAt(trashCtxMenu, x, y);
}
function hideTrashMenu() { trashCtxMenu.hidden = true; }

trashCtxMenu.addEventListener('click', (e) => {
  const btn = e.target.closest('.ctx-item');
  if (!btn || btn.disabled) return;
  hideTrashMenu();
  if (btn.dataset.action === 'empty') emptyTrash();
});

const noteCtxMenu = $('#noteCtxMenu');
let noteCtxId = null;

function openNoteMenu(x, y, noteId) {
  hideCtxMenu(); hideTrashMenu(); hideMoveMenu();
  const note = state.notes.find((n) => n.id === noteId);
  if (!note) return;

  noteCtxId = noteId;
  const isTrashed = note.deletedAt != null;

  const pinItem = noteCtxMenu.querySelector('[data-action="pin"]');
  const delItem = noteCtxMenu.querySelector('[data-action="delete"]');

  pinItem.textContent = note.pinned ? 'Unpin Note' : 'Pin Note';
  pinItem.style.display = isTrashed ? 'none' : 'block';
  delItem.textContent = isTrashed ? 'Delete Permanently' : 'Move to Trash';

  showMenuAt(noteCtxMenu, x, y);
}

function hideNoteMenu() { noteCtxMenu.hidden = true; noteCtxId = null; }

noteCtxMenu.addEventListener('click', (e) => {
  const btn = e.target.closest('.ctx-item');
  if (!btn || btn.disabled) return;
  const action = btn.dataset.action;
  const id = noteCtxId;
  hideNoteMenu();
  if (!id) return;
  if (action === 'pin') togglePin(id);
  if (action === 'delete') deleteNote(id);
});

function showMenuAt(menu, x, y) {
  menu.hidden = false;
  menu.style.left = '0px';
  menu.style.top = '0px';
  const rect = menu.getBoundingClientRect();
  const px = Math.max(6, Math.min(x, window.innerWidth  - rect.width  - 8));
  const py = Math.max(6, Math.min(y, window.innerHeight - rect.height - 8));
  menu.style.left = px + 'px';
  menu.style.top  = py + 'px';
}

/* --- Global menu dismissal --- */
document.addEventListener('pointerdown', (e) => {
  if (!ctxMenu.hidden && !ctxMenu.contains(e.target)) hideCtxMenu();
  if (!trashCtxMenu.hidden && !trashCtxMenu.contains(e.target)) hideTrashMenu();
  if (!noteCtxMenu.hidden && !noteCtxMenu.contains(e.target)) hideNoteMenu();
  if (!moveMenu.hidden && !moveMenu.contains(e.target)) hideMoveMenu();
}, true);

const closeAllMenus = () => {
  hideCtxMenu(); hideTrashMenu(); hideNoteMenu(); hideMoveMenu();
};

window.addEventListener('resize', closeAllMenus);
window.addEventListener('blur', closeAllMenus);
$('#editorScroll').addEventListener('scroll', closeAllMenus, { passive: true });
$('#noteList').addEventListener('scroll', closeAllMenus, { passive: true });

/* ============================================================
   FOLDER RENAME / DELETE
   ============================================================ */
function startRenameFolder(id) {
  const li = $(`.folder[data-folder="${id}"]`);
  if (!li) return;
  const nameEl = li.querySelector('.folder-name');
  if (!nameEl) return;

  const input = document.createElement('input');
  input.className = 'folder-input';
  input.type = 'text';
  input.maxLength = 40;
  input.value = nameEl.textContent;
  nameEl.replaceWith(input);

  input.focus();
  input.select();

  let done = false;
  const commit = (apply) => {
    if (done) return;
    done = true;
    if (apply) {
      const name = input.value.trim();
      if (name) {
        const f = state.folders.find((x) => x.id === id);
        if (f) f.name = name;
        save(true);
      }
    }
    renderFolders();
  };

  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter')  { ev.preventDefault(); commit(true); }
    if (ev.key === 'Escape') { ev.preventDefault(); commit(false); }
  });
  input.addEventListener('blur', () => commit(true));
}

/**
 * Deleting a folder now moves all of its active notes to Trash
 * (instead of silently relocating them to another folder).
 */
function deleteFolder(id) {
  if (state.folders.length <= 1) return;
  const idx = state.folders.findIndex((f) => f.id === id);
  if (idx === -1) return;

  const folder = state.folders[idx];
  const notesInFolder = state.notes.filter((n) => n.folder === id && n.deletedAt == null);

  if (notesInFolder.length > 0) {
    const msg = `Delete "${folder.name}"? ${notesInFolder.length} note${notesInFolder.length === 1 ? '' : 's'} will be moved to Trash.`;
    if (!confirm(msg)) return;
  }

  state.folders.splice(idx, 1);

  const now = Date.now();
  state.notes.forEach((n) => {
    if (n.folder === id && n.deletedAt == null) {
      n.deletedAt = now;
      n.pinned = false;
    }
  });

  if (state.activeFolder === id) state.activeFolder = state.folders[0].id;

  ensureActiveNoteValid();
  save(true);
  renderFolders();
  renderList();
  renderEditor();
}

/* ============================================================
   EDITOR SYNCING
   ============================================================ */
function syncBody() {
  const note = activeNote();
  if (!note || note.deletedAt != null || selectionMode !== null) return;

  const bodyEl = $('#noteBody');
  note.body = bodyEl.innerHTML;
  note.edited = Date.now();

  save();
  updateActiveRow(note);
  updateToolbarState();
}

function syncTitle() {
  const note = activeNote();
  if (!note || note.deletedAt != null || selectionMode !== null) return;

  note.title = $('#noteTitle').value;
  note.edited = Date.now();

  save();
  updateActiveRow(note);
}

/* ============================================================
   CHECKLISTS
   ============================================================ */
function createCheckEl() {
  const div = document.createElement('div');
  div.className = 'check';
  const box = document.createElement('span');
  box.className = 'box';
  box.setAttribute('contenteditable', 'false');
  const txt = document.createElement('span');
  txt.className = 'txt';
  txt.appendChild(document.createElement('br'));
  div.appendChild(box);
  div.appendChild(txt);
  return div;
}

function getCheckTxt(checkEl) {
  return checkEl.querySelector(':scope > .txt') || checkEl.querySelector('.txt') || checkEl;
}
function getCheckBox(checkEl) {
  return checkEl.querySelector(':scope > .box') || checkEl.querySelector('.box');
}

function focusCheckText(checkEl) {
  const bodyEl = $('#noteBody');
  if (bodyEl && document.activeElement !== bodyEl) bodyEl.focus();

  const txt = getCheckTxt(checkEl);
  if (!txt.firstChild) txt.appendChild(document.createElement('br'));

  const range = document.createRange();
  range.selectNodeContents(txt);
  range.collapse(true);

  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function outermostCheck(el) {
  let cur = el.closest ? el.closest('.check') : null;
  while (cur) {
    const parent = cur.parentElement;
    const parentCheck = parent && parent.closest ? parent.closest('.check') : null;
    if (!parentCheck) break;
    cur = parentCheck;
  }
  return cur;
}

function caretElement() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  let node = sel.getRangeAt(0).startContainer;
  if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
  return node;
}

function getCaretCheckInfo() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  let node = range.startContainer;
  if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
  if (!node || !node.closest) return null;

  const check = node.closest('.check');
  if (!check) return null;

  const txt = getCheckTxt(check);
  const box = getCheckBox(check);
  const inTxt = txt ? (node === txt || txt.contains(node)) : false;
  const inBox = box ? (node === box || box.contains(node)) : false;
  return { check, txt, box, inTxt, inBox, node, range };
}

function normalizeChecks(root) {
  if (!root) return;
  root.querySelectorAll('.check').forEach((check) => {
    const txt = getCheckTxt(check);
    if (!txt) return;
    Array.from(check.childNodes).forEach((node) => {
      if (node === txt) return;
      if (node.nodeType === Node.ELEMENT_NODE && node.classList.contains('box')) return;
      if (node.nodeType === Node.TEXT_NODE && !node.textContent.trim()) {
        node.remove(); return;
      }
      const nodeIdx = Array.prototype.indexOf.call(check.childNodes, node);
      const txtIdx = Array.prototype.indexOf.call(check.childNodes, txt);
      if (nodeIdx < txtIdx) txt.insertBefore(node, txt.firstChild);
      else txt.appendChild(node);
    });
  });
}

function placeCaretAtStart(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(true);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function makeParagraph() {
  const p = document.createElement('div');
  p.appendChild(document.createElement('br'));
  return p;
}

function insertChecklistItem() {
  const bodyEl = $('#noteBody');
  bodyEl.focus();
  const newCheck = createCheckEl();
  const node = caretElement();

  const insideCheck = node && node.closest ? node.closest('.check') : null;
  if (insideCheck && bodyEl.contains(insideCheck)) {
    const outer = outermostCheck(insideCheck) || insideCheck;
    outer.after(newCheck);
    focusCheckText(newCheck);
    syncBody();
    return;
  }

  const block = node && node.closest
    ? node.closest('div, p, li, h1, h2, blockquote') : null;

  if (block && block !== bodyEl && bodyEl.contains(block)) {
    const isEmpty = !block.textContent.trim() && block.children.length === 0;
    if (isEmpty) block.replaceWith(newCheck);
    else block.after(newCheck);
    focusCheckText(newCheck);
    syncBody();
    return;
  }

  if (!bodyEl.textContent.trim() && !bodyEl.querySelector('.check')) {
    bodyEl.innerHTML = '';
  }
  bodyEl.appendChild(newCheck);
  focusCheckText(newCheck);
  syncBody();
}

function handleChecklistKey(e) {
  if (e.isComposing) return;
  const bodyEl = e.currentTarget;
  const info = getCaretCheckInfo();
  if (!info) return;
  if (!bodyEl.contains(info.check)) return;

  const { check, txt, inTxt } = info;

  if (!inTxt) {
    if (e.key === 'Enter' || e.key === 'Backspace' || e.key === 'Delete') {
      e.preventDefault();
      focusCheckText(check);
    }
    return;
  }

  const outer = outermostCheck(check) || check;
  const text = txt.textContent.replace(/\u00a0/g, ' ').trim();

  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!text) {
      const p = makeParagraph();
      outer.replaceWith(p);
      placeCaretAtStart(p);
      syncBody();
      return;
    }
    const next = createCheckEl();
    outer.after(next);
    focusCheckText(next);
    syncBody();
    return;
  }

  if (e.key === 'Backspace' && !text) {
    e.preventDefault();
    const p = makeParagraph();
    outer.replaceWith(p);
    placeCaretAtStart(p);
    syncBody();
  }
}

/* ============================================================
   FORMAT TOOLS
   ============================================================ */
function updateToolbarState() {
  const cmds = ['bold', 'italic', 'underline', 'strikeThrough',
                'insertUnorderedList', 'insertOrderedList'];
  cmds.forEach((cmd) => {
    const btn = $(`.tb[data-cmd="${cmd}"]`);
    if (!btn) return;
    let on = false;
    try { on = document.queryCommandState(cmd); } catch (e) {}
    btn.classList.toggle('active', on);
  });

  const aa = $('.tb[data-cmd="formatBlock"]');
  if (aa) {
    let block = '';
    try { block = (document.queryCommandValue('formatBlock') || '').toLowerCase(); } catch (e) {}
    aa.classList.toggle('active', block === 'h2' || block === 'h1');
  }
}

function handleToolbar(btn) {
  const cmd = btn.dataset.cmd;
  const note = activeNote();
  if (!note || note.deletedAt != null || selectionMode !== null) return;

  if (cmd === 'pin')    { togglePin(); return; }
  if (cmd === 'delete') { deleteNote(); return; }
  if (cmd === 'checklist') { insertChecklistItem(); return; }

  const bodyEl = $('#noteBody');
  bodyEl.focus();

  if (cmd === 'formatBlock') {
    let cur = '';
    try { cur = (document.queryCommandValue('formatBlock') || '').toLowerCase(); } catch (e) {}
    document.execCommand('formatBlock', false, cur === 'h2' ? 'div' : 'h2');
  } else {
    document.execCommand(cmd, false, null);
  }
  syncBody();
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  state = load();

  /* Auto-purge notes in Trash for more than 30 days */
  const now = Date.now();
  const before = state.notes.length;
  state.notes = state.notes.filter((n) => n.deletedAt == null || (now - n.deletedAt) < TRASH_TTL);
  if (state.notes.length !== before) save(true);

  if (!state.theme) {
    state.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', state.theme);

  const validFolder = state.activeFolder === TRASH_ID ||
    state.folders.some((f) => f.id === state.activeFolder);
  if (!state.activeFolder || !validFolder) state.activeFolder = state.folders[0].id;

  ensureActiveNoteValid();
  setMobileView(isMobile() ? 'folders' : 'list');

  renderFolders();
  renderList();
  renderEditor();

  /* ---- Note list events ---- */
  $('#newNoteBtn').addEventListener('click', createNote);
  $('#emptyTrashBtn').addEventListener('click', emptyTrash);

  $('#selectNotesBtn').addEventListener('click', () => {
    if (selectionMode === 'notes') exitSelectionMode();
    else enterSelectionMode('notes');
  });

  $('#selectFoldersBtn').addEventListener('click', () => {
    if (selectionMode === 'folders') exitSelectionMode();
    else enterSelectionMode('folders');
  });

  $('#searchInput').addEventListener('input', (e) => {
    state.query = e.target.value;
    renderList();
  });

  /* ---- Editor events ---- */
  $('#noteTitle').addEventListener('input', syncTitle);
  $('#noteBody').addEventListener('input', syncBody);

  $('#noteBody').addEventListener('click', (e) => {
    const note = activeNote();
    if (!note || note.deletedAt != null || selectionMode !== null) return;
    const box = e.target.closest ? e.target.closest('.box') : null;
    if (!box) return;
    const check = box.closest('.check');
    if (!check) return;
    check.classList.toggle('checked');
    syncBody();
  });

  $('#noteBody').addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') return;
    const note = activeNote();
    if (!note || note.deletedAt != null || selectionMode !== null) return;
    const check = e.target.closest ? e.target.closest('.check') : null;
    if (!check) return;
    if (e.target.closest('.box')) return;
    const txt = getCheckTxt(check);
    if (txt && (txt === e.target || txt.contains(e.target))) return;
    e.preventDefault();
    focusCheckText(check);
  });

  $('#noteBody').addEventListener('keydown', handleChecklistKey);

  let redirectingInput = false;
  $('#noteBody').addEventListener('beforeinput', (e) => {
    if (e.isComposing || redirectingInput) return;
    const info = getCaretCheckInfo();
    if (!info || info.inTxt) return;
    e.preventDefault();
    if (info.inBox) return;
    focusCheckText(info.check);
    if (e.inputType === 'insertText' && typeof e.data === 'string' && e.data) {
      redirectingInput = true;
      try { document.execCommand('insertText', false, e.data); }
      finally { redirectingInput = false; }
      syncBody();
    }
  });

  $('#noteBody').addEventListener('paste', (e) => {
    const info = getCaretCheckInfo();
    if (!info || info.inTxt) return;
    e.preventDefault();
    const cd = e.clipboardData || window.clipboardData;
    const text = cd ? cd.getData('text/plain') : '';
    focusCheckText(info.check);
    if (text) {
      document.execCommand('insertText', false, text);
      syncBody();
    }
  });

  document.addEventListener('selectionchange', () => {
    const sel = document.getSelection();
    if (!sel || !sel.anchorNode) return;
    const bodyEl = $('#noteBody');
    if (bodyEl.contains(sel.anchorNode)) updateToolbarState();
  });

  /* ---- Toolbar events ---- */
  $$('.tb').forEach((btn) => {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => handleToolbar(btn));
  });

  /* ---- Trash banner actions ---- */
  $('#restoreBtn').addEventListener('click', () => {
    if (state.activeNoteId) restoreNote(state.activeNoteId);
  });
  $('#deleteForeverBtn').addEventListener('click', () => {
    if (state.activeNoteId) deleteNote(state.activeNoteId);
  });

  /* ---- Selection bar actions ---- */
  $('#selDoneBtn').addEventListener('click', exitSelectionMode);
  $('#selSelectAllBtn').addEventListener('click', selectAllItems);

  $('#selDeleteBtn').addEventListener('click', () => {
    if (selectionMode === 'notes') bulkDeleteNotes();
    else if (selectionMode === 'folders') bulkDeleteFolders();
  });

  $('#selRestoreBtn').addEventListener('click', bulkRestoreNotes);

  $('#selMoveBtn').addEventListener('click', (e) => openMoveMenu(e.currentTarget));

  /* ---- Mobile navigation ---- */
  $('#menuBtn').addEventListener('click', () => setMobileView('folders'));
  $('#backBtn').addEventListener('click', () => setMobileView('list'));

  /* ---- New folder ---- */
  $('#newFolderBtn').addEventListener('click', () => {
    if ($('.folder-new')) return;
    const li = document.createElement('li');
    li.className = 'folder folder-new';
    li.innerHTML =
      `<span class="folder-icon">${FOLDER_SVG}</span>` +
      `<input class="folder-input" type="text" placeholder="New Folder" maxlength="40">`;
    $('#folderList').appendChild(li);

    const input = li.querySelector('input');
    input.focus();

    let done = false;
    const commit = () => {
      if (done) return;
      done = true;
      const name = input.value.trim();
      if (name) {
        state.folders.push({ id: uid(), name });
        save(true);
      }
      renderFolders();
    };

    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter')  { ev.preventDefault(); commit(); }
      if (ev.key === 'Escape') { done = true; renderFolders(); }
    });
    input.addEventListener('blur', commit);
  });

  /* ---- Theme toggle ---- */
  $('#themeBtn').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', state.theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', state.theme === 'dark' ? '#1f1f1f' : '#f2f1ef');
    save(true);
  });

  /* ---- Responsive transition ---- */
  let lastMobile = isMobile();
  window.addEventListener('resize', () => {
    const nowMobile = isMobile();
    if (nowMobile === lastMobile) return;
    lastMobile = nowMobile;
    if (nowMobile) setMobileView('folders');
  });

  /* ---- Keyboard shortcuts ---- */
  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;

    if (e.key === 'Escape') {
      if (!ctxMenu.hidden) { hideCtxMenu(); return; }
      if (!trashCtxMenu.hidden) { hideTrashMenu(); return; }
      if (!noteCtxMenu.hidden) { hideNoteMenu(); return; }
      if (!moveMenu.hidden) { hideMoveMenu(); return; }
      if (selectionMode) { exitSelectionMode(); return; }
      if (isMobile()) {
        if (windowEl.dataset.mobileView === 'editor') { setMobileView('list'); return; }
        if (windowEl.dataset.mobileView === 'list')   { setMobileView('folders'); return; }
      }
    }

    if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); createNote(); return; }

    if (mod && e.key.toLowerCase() === 'a' && selectionMode) {
      e.preventDefault();
      selectAllItems();
      return;
    }

    if (mod && e.key.toLowerCase() === 'f') {
      e.preventDefault();
      if (isMobile() && windowEl.dataset.mobileView === 'folders') setMobileView('list');
      $('#searchInput').focus();
      $('#searchInput').select();
      return;
    }

    if (mod && e.key === 'Backspace' && selectionMode === 'notes') {
      e.preventDefault();
      bulkDeleteNotes();
      return;
    }

    if (mod && e.key === 'Backspace' && !selectionMode) {
      e.preventDefault();
      deleteNote();
      return;
    }

    if (mod && e.key.toLowerCase() === 'b') {
      const bodyEl = $('#noteBody');
      const note = activeNote();
      if (note && note.deletedAt == null && selectionMode === null &&
          (bodyEl.contains(document.activeElement) || document.activeElement === bodyEl)) {
        e.preventDefault();
        document.execCommand('bold');
        syncBody();
      }
      return;
    }

    if (e.key === 'Escape' && document.activeElement === $('#searchInput')) {
      $('#searchInput').value = '';
      state.query = '';
      renderList();
      $('#searchInput').blur();
    }
  });

  /* ---- Persist on exit ---- */
  window.addEventListener('beforeunload', () => save(true));
  window.addEventListener('pagehide', () => save(true));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') save(true);
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
